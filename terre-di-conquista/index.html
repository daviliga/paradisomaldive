<style>
/* Layout: edge-to-edge map, floating frosted HUD cards (identity left, resources right), a floating sheet for the selection and a pill CTA for the turn. Single dark "command center" look. */
:root {
  --bg: #070b14;
  --glass: rgba(14, 20, 34, 0.72);
  --glass-strong: rgba(14, 20, 34, 0.9);
  --line: rgba(255, 255, 255, 0.09);
  --ink: #eef2f8;
  --muted: #8d9ab0;
  --accent: #5b8cff;
  --gold: #f5c451;
  --war: #ff5d6c;
  --peace: #3ddc97;
  --display: "Sora", -apple-system, "Segoe UI", system-ui, sans-serif;
  --serif: "Noto Serif", Georgia, "Times New Roman", serif;
  --body: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; background: var(--bg); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
svg.i { width: 16px; height: 16px; flex: none; }

#top {
  position: fixed; z-index: 5; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: flex-start; gap: 8px; pointer-events: none;
}
#top > * { pointer-events: auto; }
.who-card { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; min-width: 104px; flex: 0 1 auto; }
.flag { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.who { min-width: 0; display: grid; }
.who b { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: flex; align-items: center; gap: 4px; padding: 8px 8px; border-radius: 999px; font-weight: 800; font-size: 13px; white-space: nowrap; }
.pill small { font-weight: 700; font-size: 11px; color: var(--peace); }
.pill small.neg { color: var(--war); }
.pill.gold svg { color: var(--gold); }
.pill.army svg { color: var(--accent); }
.pill.nuke { cursor: pointer; border: 1px solid var(--line); color: var(--ink); font-family: var(--body); }
.pill.nuke svg { color: #d4f25a; }
.act.nuke { background: rgba(212, 242, 90, 0.1); border-color: rgba(212, 242, 90, 0.45); color: #e9f9b8; }
.act.nuke svg { color: #d4f25a; }
.tag.rad { color: #d4f25a; background: rgba(212,242,90,.12); }
.arsenal { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.05); }
.arsenal svg { width: 40px; height: 40px; color: #d4f25a; flex: none; }
.arsenal b { font-family: var(--display); font-size: 26px; display: block; }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--ink); cursor: pointer; flex: none; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
#layerBtn { position: fixed; z-index: 6; width: 48px; height: 48px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: max(14px, env(safe-area-inset-left, 0px)); }
#top .res { gap: 5px; }

button { font-family: var(--body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#endTurn {
  position: fixed; z-index: 6;
  right: max(14px, env(safe-area-inset-right, 0px));

  background: linear-gradient(135deg, #6f9bff, #4a6cf0); color: #fff; border: 0; border-radius: 999px;

  box-shadow: 0 10px 28px rgba(74, 108, 240, 0.45), inset 0 1px 0 rgba(255,255,255,.25); cursor: pointer;
}

#panel {
  position: fixed; z-index: 6;

  margin: 0 auto; max-width: 520px;
  padding: 14px; border-radius: 22px;
  display: grid; gap: 10px;
  max-height: 58%; overflow-y: auto;
  background: var(--glass-strong);
}
#panel .head { display: flex; align-items: center; gap: 12px; }
#panel .chip { width: 12px; height: 34px; border-radius: 6px; flex: none; }
#panel h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; min-width: 0; text-wrap: balance; letter-spacing: -0.01em; }
#panel .sub, .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
.cap-badge { display: inline-block; vertical-align: 3px; margin-left: 6px; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: rgba(245,196,81,.12); padding: 3px 7px; border-radius: 999px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { display: grid; gap: 3px; padding: 7px 9px; border-radius: 12px; background: rgba(255,255,255,0.04); }
.cell span { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cell b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.meter { display: flex; gap: 3px; }
.meter i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); }
.meter i.on { background: var(--accent); }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.act {
  background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--line);
  border-radius: 14px; padding: 8px 6px; font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.act svg { width: 18px; height: 18px; color: var(--accent); }
.act small { color: var(--gold); font-size: 11.5px; font-weight: 800; }
.act:disabled { opacity: .38; }
.act.war { background: rgba(255, 93, 108, 0.14); border-color: rgba(255, 93, 108, 0.4); color: #ffd3d8; }
.act.peace { background: rgba(61, 220, 151, 0.12); border-color: rgba(61, 220, 151, 0.4); color: #c9f6e2; }
.act.send { background: linear-gradient(135deg, #6f9bff, #4a6cf0); color: #fff; border: 0; }
.act.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 8px; padding: 13px; }
.move { display: grid; gap: 8px; }
.move label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); }
.move label b { color: var(--ink); font-family: var(--display); }
.move input { width: 100%; accent-color: var(--accent); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.4; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.war { color: var(--war); background: rgba(255,93,108,.12); }
.tag.peace { color: var(--peace); background: rgba(61,220,151,.12); }
.tag.truce { color: var(--gold); background: rgba(245,196,81,.12); }
.vs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }

#toasts {
  position: fixed; z-index: 7; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  display: grid; justify-items: center; gap: 6px; pointer-events: none;

.toast {
  display: flex; align-items: center; gap: 10px;

.toast.bad::before { background: var(--war); color: var(--war); }
.toast.good::before { background: var(--peace); color: var(--peace); }

#modal { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(4, 7, 14, 0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

#clock button[data-s="0"].on { background: rgba(255, 255, 255, .16); box-shadow: none; }

  border-top: 3px solid var(--accent); animation: bin .35s cubic-bezier(.2,.9,.3,1.3); max-width: calc(100vw - 32px);

.feed { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
.fi { text-align: left; display: grid; gap: 2px; padding: 9px 12px; border-radius: 12px; border: 0; border-left: 3px solid var(--accent); background: rgba(255,255,255,.05); color: var(--ink); font: 600 13.5px/1.35 var(--body); cursor: pointer; }

<script>
'use strict';
const WD = window.WORLD;
const MW = WD.W, MH = WD.H;
const SAVE_KEY = 'terre-di-conquista-live-v1';
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const START_YEAR = 2026;
const RECRUIT = 1000, RECRUIT_COST = 20;
const NUKE_PROGRAM_COST = 400, NUKE_PROGRAM_DAYS = 240, NUKE_COST = 120, RAD_DAYS = 360, TRUCE_DAYS = 300;
// today's nuclear powers start with a (scaled-down) arsenal
const START_NUKES = { US: 12, RU: 12, CN: 6, FR: 4, GB: 4, IN: 3, PK: 3, IL: 2, KP: 2 };
const MAX_ZOOM = 8;
const MARCH_SPEED = 45;       // map units an army covers per day
const SPEEDS = [0, 1, 2, 4];  // game days per real second
const AI_EVERY = 5;           // days between decisions of each AI nation

// ---------- world (static) ----------
function decodeRing(d) {
  const a = new Float32Array(d.length);
  let x = 0, y = 0;
  for (let i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; a[i] = x / 2; a[i + 1] = y / 2; }
  return a;
}
function ringPath(path, r) { path.moveTo(r[0], r[1]); for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]); path.closePath(); }
const ecoFromPop = pop => pop >= 5e6 ? 5 : pop >= 1.5e6 ? 4 : pop >= 5e5 ? 3 : pop >= 1.5e5 ? 2 : 1;

function buildWorld() {
  const routeSet = new Set(WD.routes.map(([a, b]) => a < b ? a + '-' + b : b + '-' + a));
  const provs = WD.p.map((p, i) => {
    const rings = [];
    for (const poly of p.r) for (const r of poly) rings.push(decodeRing(r));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const path = new Path2D();
    for (const r of rings) {
      ringPath(path, r);
      for (let k = 0; k < r.length; k += 2) { x0 = Math.min(x0, r[k]); x1 = Math.max(x1, r[k]); y0 = Math.min(y0, r[k + 1]); y1 = Math.max(y1, r[k + 1]); }
    }
    const land = p.nb.filter(j => !routeSet.has(i < j ? i + '-' + j : j + '-' + i));
    return { id: i, name: p.n, country: p.c, pop: p.pop, area: p.a || 1, cap: !!p.k, c: [p.x, p.y], nb: p.nb, landNb: land, rings, bb: [x0, y0, x1, y1], path };
  });

  // border chunks grouped in tiles, so only visible tiles get stroked
  const TILE = 250, tcols = Math.ceil(MW / TILE), trows = Math.ceil(MH / TILE);
  const chunks = [];
  for (const a of WD.arcs) {
    const pts = decodeRing(a.d);
    for (let s = 0; s < pts.length - 2; s += 60) {
      const seg = pts.subarray(s, Math.min(pts.length, s + 62));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let k = 0; k < seg.length; k += 2) { x0 = Math.min(x0, seg[k]); x1 = Math.max(x1, seg[k]); y0 = Math.min(y0, seg[k + 1]); y1 = Math.max(y1, seg[k + 1]); }
      const tile = Math.min(tcols - 1, Math.floor((x0 + x1) / 2 / TILE)) + tcols * Math.min(trows - 1, Math.floor((y0 + y1) / 2 / TILE));
      chunks.push({ o: a.o, pts: seg, tile, bb: [x0, y0, x1, y1] });
    }
  }
  const tiles = [];
  for (let t = 0; t < tcols * trows; t++) tiles.push({ bb: [Infinity, Infinity, -Infinity, -Infinity], chunks: [] });
  for (const ch of chunks) {
    const T = tiles[ch.tile]; T.chunks.push(ch);
    T.bb = [Math.min(T.bb[0], ch.bb[0]), Math.min(T.bb[1], ch.bb[1]), Math.max(T.bb[2], ch.bb[2]), Math.max(T.bb[3], ch.bb[3])];
  }

  // hit-test grid
  const HG = 50, hcols = Math.ceil(MW / HG), hrows = Math.ceil(MH / HG);
  const hit = Array.from({ length: hcols * hrows }, () => []);
  for (const p of provs) {
    for (let gy = Math.floor(p.bb[1] / HG); gy <= Math.floor(p.bb[3] / HG); gy++)
      for (let gx = Math.floor(p.bb[0] / HG); gx <= Math.floor(p.bb[2] / HG); gx++)
        if (gx >= 0 && gy >= 0 && gx < hcols && gy < hrows) hit[gx + gy * hcols].push(p.id);
  }

  // nations = countries with at least one province
  const nations = WD.countries.map((c, i) => ({ id: i, place: c.n, capital: -1, size: 0, color: '#888', nb: new Set() }));
  for (const p of provs) {
    const n = nations[p.country];
    n.size++;
    if (p.cap && n.capital < 0) n.capital = p.id;
    for (const j of p.landNb) if (provs[j].country !== p.country) n.nb.add(provs[j].country);
  }
  for (const n of nations) if (n.capital < 0 && n.size) n.capital = provs.find(p => p.country === n.id).id;

  // colours: pick hues far from already-coloured neighbours
  const order = nations.filter(n => n.size).sort((a, b) => b.size - a.size);
  const hues = new Map();
  for (const n of order) {
    let best = 0, bd = -1;
    for (let k = 0; k < 48; k++) {
      const h = (k * 7.5 + n.id * 13) % 360;
      let d = 180;
      for (const m of n.nb) if (hues.has(m)) { const x = Math.abs(hues.get(m) - h) % 360; d = Math.min(d, Math.min(x, 360 - x)); }
      d += ((n.id * 31 + k * 17) % 10) * 0.3;
      if (d > bd) { bd = d; best = h; }
    }
    hues.set(n.id, best);
    const s = 44 + (n.id * 37) % 18, l = 55 + (n.id * 53) % 10;
    n.color = `hsl(${best.toFixed(0)} ${s}% ${l}%)`;
  }
  return { provs, nations, tiles, hit, HG, hcols, hrows, routes: WD.routes };
}

// ---------- game state ----------
let W = null, G = null;
let phase = 'pick';
let pickNation = -1, selected = -1, pendingConfirm = null, moveMode = false;
let speedIdx = 1, modalOpen = false;
const modalQueue = [];

function initialState() {
  return {
    v: 2, time: 0, day: 0, player: -1, truce: {}, asked: {}, retal: [], moves: [], nextMove: 1,
    p: W.provs.map(p => {
      const eco = ecoFromPop(p.pop);
      const army = p.cap ? 2500 + eco * 400 : 300 + eco * 200;
      return { owner: p.country, army, eco, fort: p.cap ? 1 : 0, rad: -1 };
    }),
    n: W.nations.map(n => {
      const nk = START_NUKES[WD.countries[n.id].a] || 0;
      return { gold: 60, alive: n.size > 0, capital: n.capital, wars: [], since: {}, allies: [], nukes: nk, prog: nk ? 0 : -1 };
    }),
  };
}
function serialize() {
  return { ...G, p: G.p.map(x => [x.owner, x.army, x.eco, x.fort, x.rad]) };
}
function restore(s) {
  if (!s || s.v !== 2) return false;
  G = { ...s, retal: s.retal || [], asked: s.asked || {}, p: s.p.map(a => ({ owner: a[0], army: a[1], eco: a[2], fort: a[3], rad: a[4] })) };
  ownVer++; bordersDirty = true; staticDirty = true;
  return true;
}
function save() { try { if (G && phase === 'play') localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s && s.v === 2 ? s : null; } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ownership lists, cached until a province changes hands
let ownVer = 0, listVer = -1, lists = [];
function provsOf(n) {
  if (listVer !== ownVer) {
    lists = W.nations.map(() => []);
    for (let i = 0; i < G.p.length; i++) lists[G.p[i].owner].push(i);
    listVer = ownVer;
  }
  return lists[n];
}
const nat = i => W.nations[i];
const fullName = i => nat(i).place;
const pname = i => W.provs[i].name;
function armyOf(n) {
  let s = 0;
  for (const i of provsOf(n)) s += G.p[i].army;
  for (const m of G.moves) if (m.owner === n) s += m.amount;
  return s;
}
const atWar = (a, b) => G.n[a].wars.includes(b);
const allied = (a, b) => G.n[a].allies.includes(b);
const tkey = (a, b) => a < b ? a + '-' + b : b + '-' + a;
const truceLeft = (a, b) => Math.max(0, (G.truce[tkey(a, b)] || 0) - G.day);
const radLeft = i => Math.max(0, G.p[i].rad - G.day);
const provIncome = i => radLeft(i) ? 0 : 2 + G.p[i].eco * 2 + (G.n[G.p[i].owner].capital === i ? 6 : 0);
function income(n) {
  let inc = 0;
  for (const i of provsOf(n)) inc += provIncome(i);
  const upkeep = Math.round(armyOf(n) / 1000 * 0.8);
  return { inc, upkeep, net: inc - upkeep };
}
const defense = i => G.p[i].army * (1.1 + 0.15 * G.p[i].fort);
const ecoCost = i => 25 * G.p[i].eco;
const fortCost = i => 40 * (G.p[i].fort + 1);
function neighborNations(n) {
  const s = new Set();
  for (const i of provsOf(n)) for (const j of W.provs[i].nb) if (G.p[j].owner !== n) s.add(G.p[j].owner);
  return [...s];
}
function dateStr(day) { return (day % 30 + 1) + ' ' + MONTHS[Math.floor(day / 30) % 12] + ' ' + (START_YEAR + Math.floor(day / 360)); }
const nearPlayer = n => G.player >= 0 && (n === G.player || allied(G.player, n) || neighborNations(G.player).includes(n));

// ---------- diplomacy: war, peace, alliances ----------
function declareWar(a, b) {
  if (a === b || atWar(a, b) || !G.n[a].alive || !G.n[b].alive) return;
  if (allied(a, b)) breakAlliance(a, b, true);
  G.n[a].wars.push(b); G.n[b].wars.push(a);
  G.n[a].since[b] = G.day; G.n[b].since[a] = G.day;
  delete G.truce[tkey(a, b)];
  if (b === G.player) news(`${fullName(a)} ti ha dichiarato guerra!`, 'bad', G.n[a].capital);
  else if (a !== G.player && (nearPlayer(a) || nearPlayer(b))) news(`${fullName(a)} ha dichiarato guerra a ${fullName(b)}.`, '', G.n[b].capital);
  staticDirty = true;
  // the defender's allies are called in
  for (const x of G.n[b].allies.slice()) {
    if (x === a || atWar(x, a) || allied(x, a) || !G.n[x].alive) continue;
    if (x === G.player) ask(() => showCallToArms(b, a));
    else if (Math.random() < 0.75) declareWar(x, a);
  }
}
function makePeace(a, b) {
  G.n[a].wars = G.n[a].wars.filter(x => x !== b);
  G.n[b].wars = G.n[b].wars.filter(x => x !== a);
  G.truce[tkey(a, b)] = G.day + TRUCE_DAYS;
  staticDirty = true;
}
function makeAlliance(a, b) {
  if (allied(a, b) || a === b) return;
  G.n[a].allies.push(b); G.n[b].allies.push(a);
  if (a === G.player || b === G.player) news(`Alleanza firmata con ${fullName(a === G.player ? b : a)}.`, 'good', G.n[a === G.player ? b : a].capital);
  staticDirty = true;
}
function breakAlliance(a, b, quiet) {
  G.n[a].allies = G.n[a].allies.filter(x => x !== b);
  G.n[b].allies = G.n[b].allies.filter(x => x !== a);
  if (!quiet && (a === G.player || b === G.player)) news(`L'alleanza con ${fullName(a === G.player ? b : a)} è finita.`, 'bad');
  staticDirty = true;
}
function allianceChance(n, other) {
  if (atWar(n, other) || allied(n, other)) return 0;
  if (G.n[n].wars.some(w => allied(other, w))) return 0;
  let p = 0.18;
  if (G.n[n].wars.some(w => atWar(other, w))) p += 0.5;
  if (armyOf(other) > armyOf(n)) p += 0.12;
  if (G.n[n].allies.length >= 4) p *= 0.3;
  return p;
}

// ---------- armies on the move ----------
function provDist(a, b) {
  const p = W.provs[a].c, q = W.provs[b].c;
  let dx = Math.abs(p[0] - q[0]); dx = Math.min(dx, MW - dx);
  return Math.hypot(dx, p[1] - q[1]);
}
// shortest hop path through own and allied land; the last hop may enter `to` whoever owns it
function findPath(owner, from, to) {
  if (from === to) return null;
  const passable = i => { const o = G.p[i].owner; return o === owner || allied(owner, o); };
  const prev = new Map([[from, -1]]);
  const q = [from];
  for (let k = 0; k < q.length; k++) {
    const a = q[k];
    for (const b of W.provs[a].nb) {
      if (prev.has(b)) continue;
      prev.set(b, a);
      if (b === to) {
        const path = [to];
        for (let x = a; x !== -1; x = prev.get(x)) path.unshift(x);
        return path;
      }
      if (passable(b)) q.push(b);
    }
  }
  return null;
}
function sendArmy(owner, path, amount) {
  const from = path[0];
  amount = Math.min(Math.round(amount / 10) * 10, G.p[from].army);
  if (amount <= 0) return null;
  G.p[from].army -= amount;
  const legs = [0];
  for (let k = 1; k < path.length; k++) legs.push(legs[k - 1] + provDist(path[k - 1], path[k]));
  const m = { id: G.nextMove++, owner, amount, path, legs, dep: G.time, arr: G.time + Math.max(0.6, legs[legs.length - 1] / MARCH_SPEED) };
  G.moves.push(m);
  return m;
}
function movePos(m, time) {
  const f = Math.max(0, Math.min(1, (time - m.dep) / (m.arr - m.dep)));
  const total = m.legs[m.legs.length - 1], d = f * total;
  let k = 0;
  while (k < m.legs.length - 2 && m.legs[k + 1] < d) k++;
  const a = W.provs[m.path[k]].c, b = W.provs[m.path[k + 1]].c;
  const seg = m.legs[k + 1] - m.legs[k] || 1, t = (d - m.legs[k]) / seg;
  let bx = b[0];
  if (Math.abs(bx - a[0]) > MW / 2) bx += bx > a[0] ? -MW : MW;
  return { x: a[0] + (bx - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, k };
}
function resolveMove(m) {
  const to = m.path[m.path.length - 1], back = m.path[m.path.length - 2], o = G.p[to].owner, me = m.owner;
  if (!G.n[me].alive) return;
  if (o === me) { G.p[to].army += m.amount; return; }
  if (atWar(me, o)) {
    const defender = o, res = fight(back, to, m.amount, G.p[to].army, me);
    burst(to, res.win);
    if (defender === G.player && !res.win) news(`Attacco di ${fullName(me)} respinto a ${pname(to)}.`, 'good', to);
    if (me === G.player && !res.win) news(`Attacco respinto a ${pname(to)}: persi ${fmt(res.lossA)} soldati.`, 'bad', to);
    return;
  }
  // the war ended or the target became friendly: the troops go home
  const home = G.p[back].owner === me ? back : G.p[m.path[0]].owner === me ? m.path[0] : -1;
  if (home >= 0) G.p[home].army += m.amount;
}
function processMoves() {
  if (!G.moves.length) return;
  const done = [];
  G.moves = G.moves.filter(m => (m.arr <= G.time ? (done.push(m), false) : true));
  for (const m of done) resolveMove(m);
}

// ---------- battles and conquest ----------
function fight(retreat, to, A, D, me) {
  if (D <= 0) { capture(to, me, A); return { win: true, lossA: 0, lossD: 0 }; }
  const atk = A * (0.85 + Math.random() * 0.3), def = defense(to) * (0.85 + Math.random() * 0.3);
  if (atk > def) {
    const surv = Math.max(10, Math.round(A * (1 - 0.6 * def / atk) / 10) * 10);
    capture(to, me, surv);
    return { win: true, lossA: A - surv, lossD: D };
  }
  const survD = Math.max(0, Math.round(D * (1 - 0.6 * atk / def) / 10) * 10);
  G.p[to].army = survD;
  const back = Math.round(A * 0.25 * atk / def / 10) * 10;
  if (retreat >= 0 && G.p[retreat].owner === me) G.p[retreat].army += back;
  return { win: false, lossA: A - back, lossD: D - survD };
}
function capture(i, newOwner, army) {
  const p = G.p[i], old = p.owner;
  p.owner = newOwner; p.army = army;
  p.eco = Math.max(1, p.eco - 1); p.fort = Math.max(0, p.fort - 1);
  ownVer++; bordersDirty = true; staticDirty = true;
  if (newOwner === G.player) { conquestFx(i, 'win'); announce('win', pname(i), i); }
  else if (old === G.player) { conquestFx(i, 'loss'); announce('loss', pname(i), i); }
  else conquestFx(i, 'other');
  if (G.n[old].capital === i) {
    const rest = provsOf(old).slice().sort((x, y) => G.p[y].eco - G.p[x].eco || G.p[y].army - G.p[x].army);
    if (rest.length) {
      G.n[old].capital = rest[0];
      if (old === G.player) news(`La capitale è stata spostata a ${pname(rest[0])}.`, 'bad', rest[0]);
    }
  }
  if (!provsOf(old).length) {
    G.n[old].alive = false;
    for (const w of G.n[old].wars.slice()) makePeace(old, w);
    for (const x of G.n[old].allies.slice()) breakAlliance(old, x, true);
    if (old !== G.player && (newOwner === G.player || nearPlayer(newOwner)))
      news(`${fullName(old)} è stato annesso da ${fullName(newOwner)}.`, newOwner === G.player ? 'good' : '', i);
  }
  if (old === G.player || newOwner === G.player) checkEnd();
}

// ---------- nuclear weapons ----------
function nukeTarget(n, m) {
  let best = -1, bs = -Infinity;
  for (const i of provsOf(m)) {
    const v = G.p[i].army + G.p[i].eco * 900 + (G.n[m].capital === i ? 3000 : 0) - (radLeft(i) ? 5000 : 0);
    if (v > bs) { bs = v; best = i; }
  }
  return best;
}
function launchNuke(att, target) {
  if (G.n[att].nukes <= 0 || target < 0) return false;
  G.n[att].nukes--;
  const P = G.p[target], victim = P.owner;
  P.army = Math.round(P.army * 0.05 / 10) * 10;
  P.eco = 1; P.fort = 0; P.rad = G.day + RAD_DAYS;
  for (const j of W.provs[target].landNb) G.p[j].army = Math.round(G.p[j].army * 0.7 / 10) * 10;
  // armies marching through the blast are lost
  G.moves = G.moves.filter(m => { const pos = movePos(m, G.time); return Math.hypot(pos.x - W.provs[target].c[0], pos.y - W.provs[target].c[1]) > 40; });
  if (victim !== att && G.n[victim].nukes > 0) G.retal.push([victim, att]);
  for (const m of neighborNations(att)) if (m !== G.player && m !== victim && !atWar(m, att) && !allied(m, att) && G.n[m].alive && Math.random() < 0.12) declareWar(m, att);
  staticDirty = true;
  const where = pname(target);
  if (att === G.player) news(`Testata nucleare su ${where}. Il mondo guarda con orrore.`, 'bad', target);
  else if (victim === G.player) { news(`${fullName(att)} ha colpito ${where} con un'arma nucleare!`, 'bad', target); const c = W.provs[target].c; centerOn(c[0], c[1], Math.max(cam.s, 0.9), 0.45); }
  else news(`${fullName(att)} ha lanciato un'arma nucleare su ${where} (${fullName(victim)}).`, 'bad', target);
  nukeAnim(att, target);
  return true;
}

// ---------- AI ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function aiTick(n) {
  const me = G.n[n];
  if (!me.alive) return;
  const myArmy = armyOf(n);

  // nuclear: build, retaliate, or strike first when losing badly
  if (me.prog < 0 && me.gold > 700 && Math.random() < 0.002) { me.gold -= NUKE_PROGRAM_COST; me.prog = G.day + NUKE_PROGRAM_DAYS; }
  if (me.prog === 0 && me.nukes < 5 && me.gold > 250 && Math.random() < 0.01) { me.gold -= NUKE_COST; me.nukes++; }
  for (const r of G.retal.filter(r => r[0] === n)) {
    G.retal.splice(G.retal.indexOf(r), 1);
    if (G.n[r[1]].alive && me.nukes > 0) { if (!atWar(n, r[1])) declareWar(n, r[1]); launchNuke(n, nukeTarget(n, r[1])); }
  }
  if (me.nukes > 0 && me.wars.length && Math.random() < 0.01) {
    const m = me.wars.slice().sort((a, b) => armyOf(b) - armyOf(a))[0];
    if (myArmy < armyOf(m) * 0.5) launchNuke(n, nukeTarget(n, m));
  }
  if (!me.alive) return;

  // diplomacy
  const nb = neighborNations(n);
  if (me.wars.length === 0 && Math.random() < 0.005) {
    const cands = nb.filter(m => G.n[m].alive && !truceLeft(n, m) && !allied(n, m) && armyOf(m) < myArmy * 0.7);
    if (cands.length) { cands.sort((a, b) => armyOf(a) - armyOf(b)); declareWar(n, cands[0]); }
  }
  for (const m of me.wars.slice()) {
    const long = G.day - (me.since[m] || 0) > 540;
    const losing = myArmy < armyOf(m) * 0.55;
    if ((losing && Math.random() < 0.04) || (long && Math.random() < 0.02)) {
      if (m !== G.player) makePeace(n, m);
      else if ((G.asked['p' + n] || 0) <= G.day) { G.asked['p' + n] = G.day + 60; ask(() => showOffer(n)); }
    }
  }
  if (Math.random() < 0.02) {
    // look for partners: enemies of my enemies first, then any big neighbour
    const pool = new Set();
    for (const w of me.wars) for (const x of G.n[w].wars) if (x !== n) pool.add(x);
    if (!pool.size) for (const x of nb) pool.add(x);
    const cand = shuffle([...pool]).find(x => G.n[x].alive && allianceChance(n, x) > 0);
    if (cand !== undefined) {
      if (cand === G.player) {
        if ((G.asked['a' + n] || 0) <= G.day && Math.random() < 0.35) { G.asked['a' + n] = G.day + 90; ask(() => showAllianceOffer(n)); }
      } else if (Math.random() < allianceChance(n, cand) * allianceChance(cand, n) * 2) makeAlliance(n, cand);
    }
  }

  // military: attack weak enemy provinces next door
  const marching = new Set(G.moves.filter(m => m.owner === n).map(m => m.path[m.path.length - 1]));
  const enemyNb = i => W.provs[i].nb.filter(j => atWar(n, G.p[j].owner));
  for (const i of shuffle(provsOf(n).slice())) {
    if (G.p[i].owner !== n || G.p[i].army < 300) continue;
    const targets = enemyNb(i).filter(t => !marching.has(t)).sort((a, b) => defense(a) - defense(b));
    if (!targets.length) continue;
    const t = targets[0], send = G.p[i].army * 0.8;
    if (send > defense(t) * 1.25 + 200) { sendArmy(n, [i, t], send); marching.add(t); }
  }

  // move reserves toward the front while at war
  const owned = provsOf(n);
  const dist = new Map();
  let q = [];
  for (const i of owned) {
    const front = me.wars.length ? enemyNb(i).length > 0 : W.provs[i].nb.some(j => G.p[j].owner !== n);
    if (front) { dist.set(i, 0); q.push(i); }
  }

const pointers = new Map();

cv.addEventListener('pointerdown', e => {

  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

function pointInProv(x, y, p) {
  let inside = false;
  for (const r of p.rings) {
    for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) {
      const yi = r[i + 1], yj = r[j + 1];
      if ((yi > y) !== (yj > y) && x < (r[j] - r[i]) * (y - yi) / (yj - yi) + r[i]) inside = !inside;
    }
  }
  return inside;
}
function provAt(sx, sy) {
  const mx = (sx - cam.x) / cam.s, my = (sy - cam.y) / cam.s;
  const gx = Math.floor(mx / W.HG), gy = Math.floor(my / W.HG);
  if (gx < 0 || gy < 0 || gx >= W.hcols || gy >= W.hrows) return -1;
  for (const id of W.hit[gx + gy * W.hcols]) {
    const p = W.provs[id];
    if (mx < p.bb[0] || mx > p.bb[2] || my < p.bb[1] || my > p.bb[3]) continue;
    if (pointInProv(mx, my, p)) return id;
  }
  // forgiving taps on tiny islands: nearest centre within 14 screen px
  let best = -1, bd = (14 / cam.s) ** 2;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cell = W.hit[(gx + dx) + (gy + dy) * W.hcols];
    if (!cell || gx + dx < 0 || gx + dx >= W.hcols) continue;
    for (const id of cell) { const c = W.provs[id].c, d = (c[0] - mx) ** 2 + (c[1] - my) ** 2; if (d < bd) { bd = d; best = id; } }
  }
  return best;
}
function tap(sx, sy) {
  if (!W) return;
  const i = provAt(sx, sy);
  if (phase === 'pick') {
    pickNation = i >= 0 ? G.p[i].owner : -1;
    updateIntro(); requestRender();
    return;
  }
  if (phase !== 'play') return;
  if (i < 0) { selected = -1; moveMode = false; pendingConfirm = null; renderPanel(); staticDirty = true; requestRender(); return; }
  // "Invia truppe" mode: the next tap picks the destination
  if (moveMode) {
    moveMode = false;
    if (i !== selected && selected >= 0 && G.p[selected].owner === G.player) orderMove(selected, i);
    renderPanel(); staticDirty = true; requestRender();
    return;
  }
  if (selected !== i) moveKeep = 0;
  selected = i; pendingConfirm = null;
  renderPanel(); staticDirty = true; requestRender();
}

    $('nClose').onclick = hideModal;
  });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>
      <li>Il tempo scorre da solo. In basso a destra metti in pausa o acceleri (1×, 2×, 4×). Ogni giorno incassi la rendita meno il soldo delle truppe.</li>
      <li>Tocca una tua provincia per arruolare, migliorare l'economia o fortificarla.</li>
      <li>Con una tua provincia selezionata, tocca qualsiasi altra provincia: le truppe partono e la raggiungono in qualche giorno, passando per il tuo territorio e quello degli alleati.</li>
      <li>Per attaccare un paese devi prima dichiarargli guerra. Le province che conquisti lampeggiano in blu, quelle che perdi in rosso.</li>
      <li>Alleanze: se qualcuno attacca un tuo alleato ti viene chiesto di intervenire, e i tuoi alleati ti difendono.</li>
      <li>Il simbolo radioattivo apre l'arsenale nucleare. Il giornale raccoglie tutte le notizie.</li>
    </ul>
    <div class="row"><button class="btn primary" id="mClose">Riprendi</button><button class="btn" id="mNew">Nuova partita</button></div>`, () => {
    $('mClose').onclick = hideModal;
    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); modalQueue.length = 0; hideModal(); toIntro(); }
      else { $('mNew').dataset.c = '1'; $('mNew').textContent = 'Conferma: perdi la partita attuale'; }
    };
  });
}
function setSpeed(k) {
  speedIdx = k;
  for (const b of document.querySelectorAll('#clock button')) b.classList.toggle('on', +b.dataset.s === k);
}

function findProv(name) { const p = W.provs.find(p => p.name === name); return p ? p.c : [MW / 2, MH / 2]; }
function toIntro() {
  phase = 'pick'; pickNation = -1; selected = -1;
  G = initialState(); ownVer++; bordersDirty = true; staticDirty = true;
  feed.length = 0; unread = 0;
  $('top').hidden = true; $('clock').hidden = true; $('panel').hidden = true; $('banner').hidden = true;
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  vw = window.innerWidth; vh = window.innerHeight;
  const [x, y] = findProv('Vienna');
  centerOn(x, y, Math.max(minScale(), vw / 1100), 0.3);
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play'; lastDayShown = -1;
  $('intro').hidden = true; $('top').hidden = false; $('clock').hidden = false;
  setSpeed(1);
  staticDirty = true;
  updateUI(); resize();
}
$('startBtn').onclick = () => {
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 420), 0.25);
  startPlay(); save();
  toast(`Governi ${fullName(pickNation)}. Il tempo scorre: buona fortuna.`, 'good');
};
$('continueBtn').onclick = () => {
  if (!restore(loadSaved())) return;
  selected = -1;
  const c = W.provs[G.n[G.player].capital].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 700), 0.4);
  startPlay();
};
for (const b of document.querySelectorAll('#clock button')) b.onclick = () => setSpeed(+b.dataset.s);
window.addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'play' && !modalOpen) { e.preventDefault(); setSpeed(speedIdx ? 0 : 1); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('menuBtn').onclick = showMenu;
$('nukePill').onclick = showArsenal;
$('newsBtn').onclick = showNews;
$('layerBtn').onclick = () => {
  mapMode = mapMode === 'sat' ? 'pol' : 'sat';
  try { localStorage.setItem('tdc-mapmode', mapMode); } catch (e) {}
  bordersDirty = true; staticDirty = true; requestRender();
  toast(mapMode === 'sat' ? 'Mappa satellitare' : 'Mappa politica a colori');
};

function boot(data) {
  W = buildWorld();
  readFonts();
  prepareSea();
  if (restore(data) && G.player >= 0) {
    vw = window.innerWidth; vh = window.innerHeight;
    const c = W.provs[G.n[G.player].capital].c; centerOn(c[0], c[1], vw / 700, 0.4);
    startPlay();
  } else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); bordersDirty = true; staticDirty = true; requestRender(); });
  requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
}
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
