<style>
/* Layout: edge-to-edge map, floating frosted HUD cards (identity left, resources right), a floating sheet for the selection and a pill CTA for the turn. Single dark "command center" look. */
:root {

  --peace: #3ddc97;
  --display: "Sora", -apple-system, "Segoe UI", system-ui, sans-serif;
  --serif: "Noto Serif", Georgia, "Times New Roman", serif;

  --radius: 18px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;

}
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; background: var(--bg); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
svg.i { width: 16px; height: 16px; flex: none; }

#top {
  position: fixed; z-index: 5; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: flex-start; gap: 8px; pointer-events: none;
}
#top > * { pointer-events: auto; }
.who-card { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; border-radius: 999px; min-width: 0; flex: 0 1 auto; }

.who { min-width: 0; display: grid; }

.pill small { font-weight: 700; font-size: 11px; color: var(--peace); }
.pill small.neg { color: var(--war); }
.pill.gold svg { color: var(--gold); }

}

<script>
'use strict';
const WD = window.WORLD;
const MW = WD.W, MH = WD.H;
const SAVE_KEY = 'terre-di-conquista-mondo-v1';
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const START_YEAR = 2026;
const RECRUIT = 1000, RECRUIT_COST = 20;
const MAX_ZOOM = 8;

// ---------- world (static) ----------
function decodeRing(d) {
  const a = new Float32Array(d.length);
  let x = 0, y = 0;
  for (let i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; a[i] = x / 2; a[i + 1] = y / 2; }
  return a;
}
function ringPath(path, r) { path.moveTo(r[0], r[1]); for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]); path.closePath(); }
const ecoFromPop = pop => pop >= 5e6 ? 5 : pop >= 1.5e6 ? 4 : pop >= 5e5 ? 3 : pop >= 1.5e5 ? 2 : 1;

function buildWorld() {
  const routeSet = new Set(WD.routes.map(([a, b]) => a < b ? a + '-' + b : b + '-' + a));
  const provs = WD.p.map((p, i) => {
    const rings = [];
    for (const poly of p.r) for (const r of poly) rings.push(decodeRing(r));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const path = new Path2D();
    for (const r of rings) {
      ringPath(path, r);
      for (let k = 0; k < r.length; k += 2) { x0 = Math.min(x0, r[k]); x1 = Math.max(x1, r[k]); y0 = Math.min(y0, r[k + 1]); y1 = Math.max(y1, r[k + 1]); }
    }
    const land = p.nb.filter(j => !routeSet.has(i < j ? i + '-' + j : j + '-' + i));
    return { id: i, name: p.n, country: p.c, pop: p.pop, area: p.a || 1, cap: !!p.k, c: [p.x, p.y], nb: p.nb, landNb: land, rings, bb: [x0, y0, x1, y1], path };
  });

  // border chunks grouped in tiles, so only visible tiles get stroked
  const TILE = 250, tcols = Math.ceil(MW / TILE), trows = Math.ceil(MH / TILE);
  const chunks = [];
  for (const a of WD.arcs) {
    const pts = decodeRing(a.d);
    for (let s = 0; s < pts.length - 2; s += 60) {
      const seg = pts.subarray(s, Math.min(pts.length, s + 62));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let k = 0; k < seg.length; k += 2) { x0 = Math.min(x0, seg[k]); x1 = Math.max(x1, seg[k]); y0 = Math.min(y0, seg[k + 1]); y1 = Math.max(y1, seg[k + 1]); }
      const tile = Math.min(tcols - 1, Math.floor((x0 + x1) / 2 / TILE)) + tcols * Math.min(trows - 1, Math.floor((y0 + y1) / 2 / TILE));
      chunks.push({ o: a.o, pts: seg, tile, bb: [x0, y0, x1, y1] });
    }
  }
  const tiles = [];
  for (let t = 0; t < tcols * trows; t++) tiles.push({ bb: [Infinity, Infinity, -Infinity, -Infinity], chunks: [] });
  for (const ch of chunks) {
    const T = tiles[ch.tile]; T.chunks.push(ch);
    T.bb = [Math.min(T.bb[0], ch.bb[0]), Math.min(T.bb[1], ch.bb[1]), Math.max(T.bb[2], ch.bb[2]), Math.max(T.bb[3], ch.bb[3])];
  }

  // hit-test grid
  const HG = 50, hcols = Math.ceil(MW / HG), hrows = Math.ceil(MH / HG);
  const hit = Array.from({ length: hcols * hrows }, () => []);
  for (const p of provs) {
    for (let gy = Math.floor(p.bb[1] / HG); gy <= Math.floor(p.bb[3] / HG); gy++)
      for (let gx = Math.floor(p.bb[0] / HG); gx <= Math.floor(p.bb[2] / HG); gx++)
        if (gx >= 0 && gy >= 0 && gx < hcols && gy < hrows) hit[gx + gy * hcols].push(p.id);
  }

  // nations = countries with at least one province
  const nations = WD.countries.map((c, i) => ({ id: i, place: c.n, capital: -1, size: 0, color: '#888', nb: new Set() }));
  for (const p of provs) {
    const n = nations[p.country];
    n.size++;
    if (p.cap && n.capital < 0) n.capital = p.id;
    for (const j of p.landNb) if (provs[j].country !== p.country) n.nb.add(provs[j].country);
  }
  for (const n of nations) if (n.capital < 0 && n.size) n.capital = provs.find(p => p.country === n.id).id;

  // colours: pick hues far from already-coloured neighbours
  const order = nations.filter(n => n.size).sort((a, b) => b.size - a.size);
  const hues = new Map();
  for (const n of order) {
    let best = 0, bd = -1;
    for (let k = 0; k < 48; k++) {
      const h = (k * 7.5 + n.id * 13) % 360;
      let d = 180;
      for (const m of n.nb) if (hues.has(m)) { const x = Math.abs(hues.get(m) - h) % 360; d = Math.min(d, Math.min(x, 360 - x)); }
      d += ((n.id * 31 + k * 17) % 10) * 0.3;
      if (d > bd) { bd = d; best = h; }
    }
    hues.set(n.id, best);
    const s = 44 + (n.id * 37) % 18, l = 55 + (n.id * 53) % 10;
    n.color = `hsl(${best.toFixed(0)} ${s}% ${l}%)`;
  }
  return { provs, nations, tiles, hit, HG, hcols, hrows, routes: WD.routes };
}

// ---------- game state ----------
let W = null, G = null;
let phase = 'pick';
let pickNation = -1, selected = -1, pendingConfirm = null, busy = false;
let offers = [];

function initialState() {
  return {
    v: 1, turn: 0, player: -1, truce: {}, asked: [],
    p: W.provs.map(p => {
      const eco = ecoFromPop(p.pop);
      const army = p.cap ? 2500 + eco * 400 : 300 + eco * 200;
      return { owner: p.country, army, fresh: army, eco, fort: p.cap ? 1 : 0, hit: -1 };
    }),
    n: W.nations.map(n => ({ gold: 60, alive: n.size > 0, capital: n.capital, wars: [], since: {} })),
  };
}
function serialize() {
  return { v: 1, turn: G.turn, player: G.player, truce: G.truce,
    p: G.p.map(x => [x.owner, x.army, x.fresh, x.eco, x.fort]),
    n: G.n.map(x => ({ gold: x.gold, alive: x.alive, capital: x.capital, wars: x.wars, since: x.since })) };
}
function restore(s) {
  G = { v: 1, turn: s.turn, player: s.player, truce: s.truce || {}, asked: [],
    p: s.p.map(a => ({ owner: a[0], army: a[1], fresh: a[2], eco: a[3], fort: a[4], hit: -1 })),

  const meter = (v, max) => '<div class="meter">' + Array.from({ length: max }, (_, k) => `<i class="${k < v ? 'on' : ''}"></i>`).join('') + '</div>';
  let html = `<div class="head"><span class="chip" style="background:${nat(o).color}"></span>
    <div style="min-width:0;flex:1"><h2>${esc(pr.name)}${isCap ? '<span class="cap-badge">Capitale</span>' : ''}</h2><div class="sub">${esc(fullName(o))}${origin} · ${popStr(pr.pop)} abitanti</div></div>
    <button class="icon-btn" id="closePanel" aria-label="Chiudi" style="background:rgba(255,255,255,.06)"><svg><use href="#i-close"/></svg></button></div>
    <div class="grid4">
      <div class="cell"><span>Truppe</span><b>${fmt(P.army)}</b></div>
      <div class="cell"><span>Economia</span><b>${P.eco}</b>${meter(P.eco, 5)}</div>
      <div class="cell"><span>Fortezza</span><b>${P.fort}</b>${meter(P.fort, 3)}</div>
      <div class="cell"><span>Rendita</span><b>+${provIncome(i)}</b></div>
    </div>`;
  if (o === me) {
    html += `<div class="actions">
      <button class="act" id="aRec" ${gold < RECRUIT_COST ? 'disabled' : ''}><svg><use href="#i-plus"/></svg>Arruola 1k<small>${RECRUIT_COST} oro</small></button>
      <button class="act" id="aEco" ${P.eco >= 5 || gold < ecoCost(i) ? 'disabled' : ''}><svg><use href="#i-chart"/></svg>Economia<small>${P.eco >= 5 ? 'max' : ecoCost(i) + ' oro'}</small></button>
      <button class="act" id="aFort" ${P.fort >= 3 || gold < fortCost(i) ? 'disabled' : ''}><svg><use href="#i-fort"/></svg>Fortifica<small>${P.fort >= 3 ? 'max' : fortCost(i) + ' oro'}</small></button>
    </div>`;
    if (P.fresh > 0) {
      const step = P.fresh >= 1000 ? 100 : 10;
      html += `<div class="move"><label for="moveAmt">Truppe da muovere <b id="moveVal">${fmt(P.fresh)}</b></label>
        <input type="range" id="moveAmt" min="${step}" max="${P.fresh}" step="${step}" value="${P.fresh}">
        <p class="hint">Tocca un confine evidenziato: blu per spostarti, rosso per attaccare.</p></div>`;
    } else html += `<p class="hint">Queste truppe hanno già marciato. Potranno muoversi il prossimo mese.</p>`;
  } else {
    const war = atWar(me, o), tr = truceLeft(me, o);
    const tag = war ? '<span class="tag war">In guerra</span>' : tr ? `<span class="tag truce">Tregua · ${tr} mesi</span>` : '<span class="tag peace">In pace</span>';
    html += `<div class="vs">${tag}<span class="sub">${provsOf(o).length} province · esercito ${fmt(armyOf(o))} · il tuo ${fmt(armyOf(me))}</span></div>`;
    if (war) html += `<div class="actions"><button class="act peace wide" id="aPeace" ${G.asked.includes(o) ? 'disabled' : ''}>${G.asked.includes(o) ? 'Hanno già risposto questo mese' : 'Proponi la pace'}</button></div>`;
    else if (!tr) html += `<div class="actions"><button class="act war wide" id="aWar">${pendingConfirm === o ? 'Conferma: guerra a ' + esc(nat(o).place) : 'Dichiara guerra'}</button></div>`;
  }
  panel.innerHTML = html;
  panel.hidden = false;
  $('closePanel').onclick = () => { selected = -1; pendingConfirm = null; updateUI(); requestRender(); };
  if (o === me) {
    $('aRec').onclick = () => recruit(i);
    $('aEco').onclick = () => upgradeEco(i);
    $('aFort').onclick = () => fortify(i);
    const r = $('moveAmt');
    if (r) r.oninput = () => { $('moveVal').textContent = fmt(+r.value); };
  } else {
    if ($('aPeace')) $('aPeace').onclick = () => playerPeace(o);
    if ($('aWar')) $('aWar').onclick = () => { if (pendingConfirm === o) playerDeclare(o); else { pendingConfirm = o; renderPanel(); } };
  }
}

function showModal(html, wire) { $('modalBox').innerHTML = html; $('modal').hidden = false; wire && wire(); }
function hideModal() { $('modal').hidden = true; }
function showOffer(n) {
  showModal(`<h1 style="font-size:26px">Proposta di pace</h1><p>${esc(fullName(n))} chiede di firmare la pace. Seguirebbero 10 mesi di tregua.</p>
    <div class="row"><button class="btn primary" id="okP">Accetta</button><button class="btn" id="noP">Rifiuta</button></div>`, () => {
    $('okP').onclick = () => { makePeace(G.player, n); hideModal(); toast(`Pace con ${nat(n).place}.`, 'good'); afterAction(); next(); };
    $('noP').onclick = () => { hideModal(); next(); };
  });
  function next() { if (offers.length) showOffer(offers.shift()); }
}
function showEnd(win) {
  $('endTurn').hidden = true;
  showModal(`<h1 style="font-size:30px">${win ? 'Vittoria' : 'Sconfitta'}</h1>
    <p>${win ? `A ${dateStr(G.turn)} ${esc(fullName(G.player))} governa il mondo intero.` : `A ${dateStr(G.turn)} l'ultima provincia di ${esc(nat(G.player).place)} è caduta.`}</p>
    <div class="row"><button class="btn primary" id="again">Nuova partita</button></div>`, () => { $('again').onclick = () => { hideModal(); toIntro(); }; });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>
      <li>Ogni turno è un mese. A fine turno incassi la rendita delle province meno il soldo delle truppe.</li>
      <li>Tocca una tua provincia per arruolare, migliorare l'economia o fortificarla.</li>
      <li>Con una tua provincia selezionata, tocca una provincia confinante per spostare le truppe o attaccare. Ogni truppa marcia una volta al mese.</li>
      <li>Per attaccare un paese devi prima dichiarargli guerra: tocca una sua provincia.</li>
      <li>Le linee tratteggiate sono rotte via mare tra coste vicine e isole.</li>
      <li>Vinci quando sei l'ultima nazione rimasta.</li>
    </ul>
    <div class="row"><button class="btn primary" id="mClose">Riprendi</button><button class="btn" id="mNew">Nuova partita</button></div>`, () => {
    $('mClose').onclick = hideModal;
    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); hideModal(); toIntro(); }
      else { $('mNew').dataset.c = '1'; $('mNew').textContent = 'Conferma: perdi la partita attuale'; }
    };
  });
}

function findProv(name) { const p = W.provs.find(p => p.name === name); return p ? p.c : [MW / 2, MH / 2]; }
function toIntro() {
  phase = 'pick'; pickNation = -1; selected = -1;
  G = initialState(); ownVer++; bordersDirty = true;
  $('top').hidden = true; $('endTurn').hidden = true; $('panel').hidden = true;
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  vw = window.innerWidth; vh = window.innerHeight;
  const [x, y] = findProv('Vienna');
  centerOn(x, y, Math.max(minScale(), vw / 1100), 0.3);
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play';
  $('intro').hidden = true; $('top').hidden = false; $('endTurn').hidden = false;
  updateUI(); resize();
}
$('startBtn').onclick = () => {
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 420), 0.25);
  startPlay(); save();
  toast(`Governi ${fullName(pickNation)}. Buona fortuna.`, 'good');
};
$('continueBtn').onclick = () => {
  const s = loadSaved(); if (!s) return;
  restore(s); selected = -1;
  const c = W.provs[G.n[G.player].capital].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 700), 0.4);
  startPlay();
};
$('endTurn').onclick = endTurn;
$('menuBtn').onclick = showMenu;
$('layerBtn').onclick = () => {
  mapMode = mapMode === 'sat' ? 'pol' : 'sat';
  try { localStorage.setItem('tdc-mapmode', mapMode); } catch (e) {}
  bordersDirty = true; requestRender();
  toast(mapMode === 'sat' ? 'Mappa satellitare' : 'Mappa politica a colori');
};

function boot(data) {
  W = buildWorld();
  readFonts();
  prepareSea();
  if (data && data.p && data.player >= 0) {
    restore(data); vw = window.innerWidth; vh = window.innerHeight;
    const c = W.provs[G.n[G.player].capital].c; centerOn(c[0], c[1], vw / 700, 0.4);
    startPlay();
  } else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); bordersDirty = true; requestRender(); });
}
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
