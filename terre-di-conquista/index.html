<style>

<script src="world.js"></script>
<script>
'use strict';
const WD = window.WORLD;
const MW = WD.W, MH = WD.H;
const SAVE_KEY = 'terre-di-conquista-live-v3';
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const START_YEAR = 2026;
const RECRUIT = 1000, RECRUIT_COST = 20;
const NUKE_PROGRAM_COST = 400, NUKE_PROGRAM_DAYS = 240, NUKE_COST = 120, RAD_DAYS = 360, TRUCE_DAYS = 300;
// today's nuclear powers start with a (scaled-down) arsenal
const START_NUKES = { US: 12, RU: 12, CN: 6, FR: 4, GB: 4, IN: 3, PK: 3, IL: 2, KP: 2 };
const MAX_ZOOM = 8;
const LAND_SPEED = 12, SEA_SPEED = 40, AIR_SPEED = 160;  // map units per day
const AIR_RANGE = 380;                                    // how far planes fly from their base
const SPEEDS = [0, 0.5, 1, 2];                            // game days per real second
const FGT_COST = 45, BMB_COST = 55, SHIP_COST = 70, AID_COST = 60;
// air force and navy of the main military powers at the start: [planes, ships]
const START_MIL = { US: [40, 30], RU: [30, 14], CN: [32, 22], IN: [18, 10], GB: [12, 12], FR: [12, 10], JP: [12, 14], KR: [12, 8],
  DE: [10, 5], IT: [9, 9], TR: [12, 8], IL: [10, 3], PK: [9, 4], EG: [8, 5], SA: [9, 4], IR: [6, 5], BR: [6, 6], AU: [6, 6],
  ES: [6, 6], CA: [5, 6], UA: [4, 2], GR: [5, 6], ID: [4, 8], TW: [8, 6], KP: [6, 4], VN: [4, 4], PL: [6, 2], DZ: [5, 4] };
const AI_EVERY = 7;           // days between decisions of each AI nation

// ---------- world (static) ----------
function decodeRing(d) {
  const a = new Float32Array(d.length);
  let x = 0, y = 0;
  for (let i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; a[i] = x / 2; a[i + 1] = y / 2; }
  return a;
}
function ringPath(path, r) { path.moveTo(r[0], r[1]); for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]); path.closePath(); }
const ecoFromPop = pop => pop >= 5e6 ? 5 : pop >= 1.5e6 ? 4 : pop >= 5e5 ? 3 : pop >= 1.5e5 ? 2 : 1;

function buildWorld() {
  const routeSet = new Set(WD.routes.map(([a, b]) => a < b ? a + '-' + b : b + '-' + a));
  const provs = WD.p.map((p, i) => {
    const rings = [];
    for (const poly of p.r) for (const r of poly) rings.push(decodeRing(r));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const path = new Path2D();
    for (const r of rings) {
      ringPath(path, r);
      for (let k = 0; k < r.length; k += 2) { x0 = Math.min(x0, r[k]); x1 = Math.max(x1, r[k]); y0 = Math.min(y0, r[k + 1]); y1 = Math.max(y1, r[k + 1]); }
    }
    const land = p.nb.filter(j => !routeSet.has(i < j ? i + '-' + j : j + '-' + i));
    return { id: i, name: p.n, country: p.c, pop: p.pop, area: p.a || 1, cap: !!p.k, c: [p.x, p.y], nb: p.nb, landNb: land, rings, bb: [x0, y0, x1, y1], path };
  });

  // border chunks grouped in tiles, so only visible tiles get stroked
  const TILE = 250, tcols = Math.ceil(MW / TILE), trows = Math.ceil(MH / TILE);
  const chunks = [];
  for (const a of WD.arcs) {
    const pts = decodeRing(a.d);
    for (let s = 0; s < pts.length - 2; s += 60) {
      const seg = pts.subarray(s, Math.min(pts.length, s + 62));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let k = 0; k < seg.length; k += 2) { x0 = Math.min(x0, seg[k]); x1 = Math.max(x1, seg[k]); y0 = Math.min(y0, seg[k + 1]); y1 = Math.max(y1, seg[k + 1]); }
      const tile = Math.min(tcols - 1, Math.floor((x0 + x1) / 2 / TILE)) + tcols * Math.min(trows - 1, Math.floor((y0 + y1) / 2 / TILE));
      chunks.push({ o: a.o, pts: seg, tile, bb: [x0, y0, x1, y1] });
    }
  }
  const tiles = [];
  for (let t = 0; t < tcols * trows; t++) tiles.push({ bb: [Infinity, Infinity, -Infinity, -Infinity], chunks: [] });
  for (const ch of chunks) {
    const T = tiles[ch.tile]; T.chunks.push(ch);
    T.bb = [Math.min(T.bb[0], ch.bb[0]), Math.min(T.bb[1], ch.bb[1]), Math.max(T.bb[2], ch.bb[2]), Math.max(T.bb[3], ch.bb[3])];
  }

  // hit-test grid
  const HG = 50, hcols = Math.ceil(MW / HG), hrows = Math.ceil(MH / HG);
  const hit = Array.from({ length: hcols * hrows }, () => []);
  for (const p of provs) {
    for (let gy = Math.floor(p.bb[1] / HG); gy <= Math.floor(p.bb[3] / HG); gy++)
      for (let gx = Math.floor(p.bb[0] / HG); gx <= Math.floor(p.bb[2] / HG); gx++)
        if (gx >= 0 && gy >= 0 && gx < hcols && gy < hrows) hit[gx + gy * hcols].push(p.id);
  }

  // nations = countries with at least one province
  const nations = WD.countries.map((c, i) => ({ id: i, place: c.n, capital: -1, size: 0, color: '#888', nb: new Set() }));
  for (const p of provs) {
    const n = nations[p.country];
    n.size++;
    if (p.cap && n.capital < 0) n.capital = p.id;
    for (const j of p.landNb) if (provs[j].country !== p.country) n.nb.add(provs[j].country);
  }
  for (const n of nations) if (n.capital < 0 && n.size) n.capital = provs.find(p => p.country === n.id).id;

  // colours: pick hues far from already-coloured neighbours
  const order = nations.filter(n => n.size).sort((a, b) => b.size - a.size);
  const hues = new Map();
  for (const n of order) {
    let best = 0, bd = -1;
    for (let k = 0; k < 48; k++) {
      const h = (k * 7.5 + n.id * 13) % 360;
      let d = 180;
      for (const m of n.nb) if (hues.has(m)) { const x = Math.abs(hues.get(m) - h) % 360; d = Math.min(d, Math.min(x, 360 - x)); }
      d += ((n.id * 31 + k * 17) % 10) * 0.3;
      if (d > bd) { bd = d; best = h; }
    }
    hues.set(n.id, best);
    const s = 44 + (n.id * 37) % 18, l = 55 + (n.id * 53) % 10;
    n.color = `hsl(${best.toFixed(0)} ${s}% ${l}%)`;
  }
  // coastal provinces and the sea lanes between them (nearby coasts and the sea routes)
  for (const a of WD.arcs) if (a.o.length === 1) provs[a.o[0]].coastal = true;
  const coastal = provs.filter(p => p.coastal), navNb = provs.map(() => []);
  const NG = 170, ncols = Math.ceil(MW / NG), ngrid = new Map();
  for (const p of coastal) { const k = Math.floor(p.c[0] / NG) + ',' + Math.floor(p.c[1] / NG); if (!ngrid.has(k)) ngrid.set(k, []); ngrid.get(k).push(p.id); }
  for (const p of coastal) {
    const gx = Math.floor(p.c[0] / NG), gy = Math.floor(p.c[1] / NG);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const j of ngrid.get(((gx + dx + ncols) % ncols) + ',' + (gy + dy)) || []) {
      if (j === p.id) continue;
      let ddx = Math.abs(provs[j].c[0] - p.c[0]); ddx = Math.min(ddx, MW - ddx);
      if (Math.hypot(ddx, provs[j].c[1] - p.c[1]) < NG) navNb[p.id].push(j);
    }
  }
  for (const [a, b] of WD.routes) { if (!navNb[a].includes(b)) navNb[a].push(b); if (!navNb[b].includes(a)) navNb[b].push(a); }
  return { provs, nations, tiles, hit, HG, hcols, hrows, routes: WD.routes, routeSet, navNb };
}

// ---------- game state ----------
let W = null, G = null;
let phase = 'pick';
let pickNation = -1, selected = -1, pendingConfirm = null, moveMode = false;
let speedIdx = 1, modalOpen = false;
const modalQueue = [];

function startForces(n) {
  const a2 = WD.countries[n.id].a, big = START_MIL[a2];
  const air = big ? big[0] : Math.round(n.size / 5), navy = big ? big[1] : Math.round(n.size / 7);
  return { air, navy };
}
function initialState() {
  const p = W.provs.map(p => {
    const eco = ecoFromPop(p.pop);
    const army = p.cap ? 2500 + eco * 400 : 300 + eco * 200;
    return { owner: p.country, army, fgt: 0, bmb: 0, ships: 0, eco, fort: p.cap ? 1 : 0, rad: -1, hit: -1, sup: 1 };
  });
  const n = W.nations.map(x => {
    const nk = START_NUKES[WD.countries[x.id].a] || 0;
    if (x.size) {
      // air force at the capital, fleet in the main port
      const f = startForces(x), cap = x.capital;
      p[cap].fgt = Math.ceil(f.air * 0.6); p[cap].bmb = Math.floor(f.air * 0.4);
      const port = W.provs[cap].coastal ? cap : W.provs.filter(q => q.country === x.id && q.coastal).sort((a, b) => provDist(a.id, cap) - provDist(b.id, cap))[0]?.id;
      if (port !== undefined) p[port].ships = f.navy;
    }
    return { gold: 60, alive: x.size > 0, capital: x.capital, wars: [], since: {}, allies: [], nukes: nk, prog: nk ? 0 : -1 };
  });
  const rel = W.nations.map(() => Math.round(Math.random() * 30 - 10));
  return { v: 3, time: 0, day: 0, player: -1, truce: {}, asked: {}, retal: [], moves: [], fleets: [], nextMove: 1, ws: {}, hist: [], rel, autoPause: true, p, n };
}
function serialize() {
  return { ...G, p: G.p.map(x => [x.owner, x.army, x.fgt, x.bmb, x.ships, x.eco, x.fort, x.rad, x.hit, x.sup]) };
}
function restore(s) {
  if (!s || s.v !== 3) return false;
  G = { ...s, retal: s.retal || [], asked: s.asked || {}, p: s.p.map(a => ({ owner: a[0], army: a[1], fgt: a[2], bmb: a[3], ships: a[4], eco: a[5], fort: a[6], rad: a[7], hit: a[8], sup: a[9] })) };
  ownVer++; bordersDirty = true; staticDirty = true;
  return true;
}
function save() { try { if (G && phase === 'play') localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s && s.v === 3 ? s : null; } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ownership lists, cached until a province changes hands
let ownVer = 0, listVer = -1, lists = [];
function provsOf(n) {
  if (listVer !== ownVer) {
    lists = W.nations.map(() => []);
    for (let i = 0; i < G.p.length; i++) lists[G.p[i].owner].push(i);
    listVer = ownVer;
  }
  return lists[n];
}
const nat = i => W.nations[i];
const fullName = i => nat(i).place;
const pname = i => W.provs[i].name;
function forcesOf(n) {
  const f = { army: 0, fgt: 0, bmb: 0, ships: 0 };
  for (const i of provsOf(n)) { const P = G.p[i]; f.army += P.army; f.fgt += P.fgt; f.bmb += P.bmb; f.ships += P.ships; }
  for (const m of G.moves) if (m.owner === n) { f.army += m.amount || 0; f.fgt += m.fgt || 0; f.bmb += m.bmb || 0; f.ships += m.ships || 0; }
  for (const fl of G.fleets) if (fl.owner === n) f.ships += fl.ships;
  return f;
}
// one number for military strength: soldiers, with planes and ships counted as their weight in soldiers
const power = f => f.army + f.fgt * 600 + f.bmb * 700 + f.ships * 800;
const armyOf = n => power(forcesOf(n));
const atWar = (a, b) => G.n[a].wars.includes(b);
const allied = (a, b) => G.n[a].allies.includes(b);
const tkey = (a, b) => a < b ? a + '-' + b : b + '-' + a;
const truceLeft = (a, b) => Math.max(0, (G.truce[tkey(a, b)] || 0) - G.day);
const radLeft = i => Math.max(0, G.p[i].rad - G.day);
const blockaded = i => G.fleets.some(f => f.prov === i && atWar(f.owner, G.p[i].owner));
function provIncome(i) {
  if (radLeft(i)) return 0;
  const base = 2 + G.p[i].eco * 2 + (G.n[G.p[i].owner].capital === i ? 6 : 0);
  return blockaded(i) ? Math.floor(base / 2) : base;
}
function income(n) {
  let inc = 0;
  for (const i of provsOf(n)) inc += provIncome(i);
  const f = forcesOf(n);
  const army = Math.round(f.army / 1000 * 0.8), air = Math.round(f.fgt * 1 + f.bmb * 1.2), navy = Math.round(f.ships * 1.5);
  return { inc, upkeep: army + air + navy, army, air, navy, net: inc - army - air - navy };
}
const recentlyBombed = i => G.p[i].hit >= 0 && G.day - G.p[i].hit < 6;
const defense = i => G.p[i].army * (1.25 + 0.15 * G.p[i].fort) * (recentlyBombed(i) ? 0.75 : 1);
const ecoCost = i => 25 * G.p[i].eco;
const fortCost = i => 40 * (G.p[i].fort + 1);
function neighborNations(n) {
  const s = new Set();
  for (const i of provsOf(n)) for (const j of W.provs[i].nb) if (G.p[j].owner !== n) s.add(G.p[j].owner);
  return [...s];
}
function dateStr(day) { return (Math.floor(day) % 30 + 1) + ' ' + MONTHS[Math.floor(day / 30) % 12] + ' ' + (START_YEAR + Math.floor(day / 360)); }
const nearPlayer = n => G.player >= 0 && (n === G.player || allied(G.player, n) || neighborNations(G.player).includes(n));

// ---------- relations with the player, -100..100 ----------
function relAdd(n, d) { if (n >= 0 && n !== G.player) G.rel[n] = Math.max(-100, Math.min(100, (G.rel[n] || 0) + d)); }
function relAll(d, except = []) { for (let n = 0; n < G.n.length; n++) if (G.n[n].alive && !except.includes(n)) relAdd(n, d); }
const relOf = n => Math.round(G.rel[n] || 0);
function relWord(r) { return r >= 60 ? 'Amichevole' : r >= 20 ? 'Cordiale' : r > -20 ? 'Neutrale' : r > -60 ? 'Freddo' : 'Ostile'; }

// ---------- war statistics for the dashboard ----------
function wstat(a, b) {
  const k = tkey(a, b);
  if (!G.ws[k]) G.ws[k] = { start: G.day, cap: {}, kia: {} };
  return G.ws[k];
}
function addKia(a, b, who, n) { const s = wstat(a, b); s.kia[who] = (s.kia[who] || 0) + Math.max(0, Math.round(n)); }

// ---------- diplomacy: war, peace, alliances ----------
function declareWar(a, b) {
  if (a === b || atWar(a, b) || !G.n[a].alive || !G.n[b].alive) return;
  if (allied(a, b)) breakAlliance(a, b, true);
  G.n[a].wars.push(b); G.n[b].wars.push(a);
  G.n[a].since[b] = G.day; G.n[b].since[a] = G.day;
  delete G.truce[tkey(a, b)];
  G.ws[tkey(a, b)] = { start: G.day, cap: {}, kia: {} };
  if (a === G.player) { relAdd(b, -60); relAll(-8, [b]); for (const x of G.n[b].allies) relAdd(x, -25); }
  if (b === G.player) { relAdd(a, -40); raiseAlert(`${fullName(a)} ti ha dichiarato guerra!`, G.n[a].capital, true); }
  else if (a !== G.player && (nearPlayer(a) || nearPlayer(b))) news(`${fullName(a)} ha dichiarato guerra a ${fullName(b)}.`, '', G.n[b].capital);
  staticDirty = true;
  // the defender's allies are called in
  for (const x of G.n[b].allies.slice()) {
    if (x === a || atWar(x, a) || allied(x, a) || !G.n[x].alive) continue;
    if (x === G.player) ask(() => showCallToArms(b, a));
    else if (Math.random() < 0.75) declareWar(x, a);
  }
}
function makePeace(a, b) {
  G.n[a].wars = G.n[a].wars.filter(x => x !== b);
  G.n[b].wars = G.n[b].wars.filter(x => x !== a);
  G.truce[tkey(a, b)] = G.day + TRUCE_DAYS;
  if (a === G.player) relAdd(b, 10); if (b === G.player) relAdd(a, 10);
  staticDirty = true;
}
function makeAlliance(a, b) {
  if (allied(a, b) || a === b) return;
  G.n[a].allies.push(b); G.n[b].allies.push(a);
  if (a === G.player || b === G.player) { const o = a === G.player ? b : a; relAdd(o, 30); news(`Alleanza firmata con ${fullName(o)}.`, 'good', G.n[o].capital); }
  staticDirty = true;
}
function breakAlliance(a, b, quiet) {
  G.n[a].allies = G.n[a].allies.filter(x => x !== b);
  G.n[b].allies = G.n[b].allies.filter(x => x !== a);
  if (!quiet && (a === G.player || b === G.player)) news(`L'alleanza con ${fullName(a === G.player ? b : a)} è finita.`, 'bad');
  staticDirty = true;
}
function allianceChance(n, other) {
  if (atWar(n, other) || allied(n, other)) return 0;
  if (G.n[n].wars.some(w => allied(other, w))) return 0;
  let p = 0.18;
  if (G.n[n].wars.some(w => atWar(other, w))) p += 0.5;
  if (armyOf(other) > armyOf(n)) p += 0.12;
  if (G.n[n].allies.length >= 4) p *= 0.3;
  if (other === G.player || n === G.player) { const r = relOf(n === G.player ? other : n); if (r < -20) return 0; p += r / 150; }
  return Math.max(0, p);
}

// ---------- movement of land, air and sea forces ----------
function provDist(a, b) {
  const p = W.provs[a].c, q = W.provs[b].c;
  let dx = Math.abs(p[0] - q[0]); dx = Math.min(dx, MW - dx);
  return Math.hypot(dx, p[1] - q[1]);
}
const isRoute = (a, b) => W.routeSet.has(a < b ? a + '-' + b : b + '-' + a);
// an enemy fleet at either end of a sea crossing stops troops from crossing
const routeBlocked = (owner, a, b) => G.fleets.some(f => (f.prov === a || f.prov === b) && atWar(f.owner, owner));
// land path: through own and allied land (and open sea crossings); the last hop may enter `to`
function findPath(owner, from, to) {

      }
      if (P.ships >= 2 && W.provs[i].coastal && Math.random() < 0.3) {
        let best = null;
        for (const w of me.wars) for (const t of provsOf(w)) {
          if (!W.provs[t].coastal || provDist(i, t) > 500 || G.fleets.some(f => f.prov === t && f.owner === n)) continue;
          if (G.p[t].ships > P.ships) continue;
          const path = findSeaPath(i, t);
          if (path && (!best || path.length < best.length)) best = path;

        if (best) sendFleet(n, best, P.ships, 'station');

    }
  }

  // move reserves toward the front while at war

  for (const i of owned) {
    const front = me.wars.length ? enemyNb(i).length > 0 : W.provs[i].nb.some(j => G.p[j].owner !== n);
    if (front) { dist.set(i, 0); q.push(i); }
  }
  while (q.length) {
    const nq = [];

  if (me.wars.length && me.gold > 150) {
    const cap = G.p[me.capital];
    if (Math.random() < 0.25) { me.gold -= FGT_COST; cap.fgt++; }
    if (Math.random() < 0.2 && me.gold > BMB_COST) { me.gold -= BMB_COST; cap.bmb++; }
    const port = W.provs[me.capital].coastal ? me.capital : owned.find(i => W.provs[i].coastal);

    </div>`;
    const modes = [];
    if (P.army >= 10) modes.push(['land', 'Truppe']);
    if (P.fgt + P.bmb > 0) modes.push(['air', 'Missione aerea']);
    if (P.ships > 0) modes.push(['sea', 'Flotta']);
    if (modes.length) {
      html += `<div class="move">`;
      if (P.army >= 10) {
        const step = P.army >= 1000 ? 100 : 10;
        html += `<label for="moveAmt">Truppe da inviare <b id="moveVal">${fmt(P.army)}</b></label>
        <input type="range" id="moveAmt" min="${step}" max="${P.army}" step="${step}" value="${moveKeep && moveKeep <= P.army ? moveKeep : P.army}">`;
      }
      html += `<div class="sendrow">${modes.map(([k, l]) => `<button class="act send ${moveMode === k ? 'on' : ''}" data-mode="${k}">${moveMode === k ? 'Annulla' : l}</button>`).join('')}</div>`;
      const hints = {
        land: 'Tocca una tua provincia per spostare le truppe o una nemica per attaccare, anche lontana. Marce lunghe abbassano il morale.',
        air: `Tocca una provincia nemica entro ${AIR_RANGE} km di mappa per bombardarla (i caccia scortano), o una tua per trasferire gli aerei.`,
        sea: 'Tocca un tuo porto per spostare la flotta, o la costa di un nemico per attaccarne la flotta e bloccarne il porto.',
      };
      html += `<p class="hint">${moveMode ? hints[moveMode] : 'Scegli cosa inviare, poi tocca la destinazione sulla mappa.'}</p></div>`;
    }
  } else {
    const war = atWar(me, o), ally = allied(me, o), tr = truceLeft(me, o), r = relOf(o);

    html += `<div class="vs">${tag}<span class="tag rel" style="--r:${r}">Rapporti ${relWord(r)} ${r > 0 ? '+' : ''}${r}</span><span class="sub">${provsOf(o).length} province · forza ${fmt(armyOf(o))} · la tua ${fmt(armyOf(me))}</span></div>`;
    if (theirAllies.length) html += `<div class="sub">Alleati: ${theirAllies.slice(0, 5).map(x => esc(fullName(x))).join(', ')}${theirAllies.length > 5 ? '…' : ''}</div>`;
    const cool = k => (G.asked[k + o] || 0) > G.day;
    const myFleet = G.fleets.find(f => f.prov === i && f.owner === me);
    if (war) {
      const nk = G.n[me].nukes;
      html += `<div class="actions"><button class="act peace wide" id="aPeace" ${cool('pp') ? 'disabled' : ''}>${cool('pp') ? 'Riprova tra qualche settimana' : 'Proponi la pace'}</button>
        ${myFleet ? `<button class="act wide" id="aRecall">Richiama la flotta (${myFleet.ships} navi)</button>` : ''}
        ${nk > 0 ? `<button class="act nuke wide" id="aNuke"><svg><use href="#i-nuke"/></svg>${pendingConfirm === 'nuke' + i ? 'Conferma lancio su ' + esc(pr.name) : 'Lancia testata nucleare · ' + nk + ' disponibili'}</button>` : ''}</div>`;
    } else if (ally) {
      html += `<div class="actions"><button class="act" id="aAid" ${cool('ai') || gold < AID_COST ? 'disabled' : ''}>Invia aiuti<small>${AID_COST} oro</small></button>
        <button class="act wide" id="aBreak" style="grid-column: span 2">${pendingConfirm === 'break' + o ? 'Conferma: rompi l\'alleanza' : 'Rompi l\'alleanza'}</button></div>`;
    } else {
      const warn = theirAllies.filter(x => x !== me).length;
      html += `<div class="actions">
        <button class="act" id="aAid" ${cool('ai') || gold < AID_COST ? 'disabled' : ''}>Invia aiuti<small>${AID_COST} oro · +10</small></button>
        <button class="act peace" id="aAlly" ${cool('pa') ? 'disabled' : ''} style="grid-column: span 2">${cool('pa') ? 'Riprova tra qualche settimana' : 'Proponi un\'alleanza'}</button>
        ${tr ? '' : `<button class="act war wide" id="aWar">${pendingConfirm === o ? 'Conferma: guerra a ' + esc(fullName(o)) + (warn ? ` (+${warn} alleati)` : '') : 'Dichiara guerra'}</button>`}</div>`;
    }
  }
  panel.innerHTML = html;
  panel.hidden = false;
  $('closePanel').onclick = () => { selected = -1; moveMode = false; pendingConfirm = null; renderPanel(); staticDirty = true; requestRender(); };
  if (o === me) {
    $('rInf').onclick = () => recruit(i, 'inf');
    $('rFgt').onclick = () => recruit(i, 'fgt');
    $('rBmb').onclick = () => recruit(i, 'bmb');
    $('rShip').onclick = () => recruit(i, 'ship');
    $('aEco').onclick = () => upgradeEco(i);
    $('aFort').onclick = () => fortify(i);
    for (const b of panel.querySelectorAll('[data-mode]')) b.onclick = () => { moveMode = moveMode === b.dataset.mode ? false : b.dataset.mode; renderPanel(); };
    const r = $('moveAmt');
    if (r) {
      $('moveVal').textContent = fmt(+r.value);
      r.oninput = () => { moveKeep = +r.value; $('moveVal').textContent = fmt(+r.value); };
      r.onpointerdown = () => { sliderBusy = true; };
      r.onpointerup = r.onpointercancel = r.onchange = () => { sliderBusy = false; };
    }
  } else {
    const confirmThen = (key, fn) => () => { if (pendingConfirm === key) fn(); else { pendingConfirm = key; renderPanel(); } };
    if ($('aPeace')) $('aPeace').onclick = () => playerPeace(o);
    if ($('aNuke')) $('aNuke').onclick = confirmThen('nuke' + i, () => playerNuke(i));
    if ($('aWar')) $('aWar').onclick = confirmThen(o, () => playerDeclare(o));
    if ($('aAlly')) $('aAlly').onclick = () => playerAlly(o);
    if ($('aAid')) $('aAid').onclick = () => playerAid(o);
    if ($('aBreak')) $('aBreak').onclick = confirmThen('break' + o, () => playerBreak(o));
    if ($('aRecall')) $('aRecall').onclick = () => { const f = G.fleets.find(f => f.prov === i && f.owner === me); if (f) recallFleet(f); afterAction(); };
  }
}

// ---------- state dashboard ----------
let dashOpen = false, dashTab = 'over';

function openDash(tab) { dashOpen = true; if (tab) dashTab = tab; $('dash').hidden = false; renderDash(); }
function closeDash() { dashOpen = false; $('dash').hidden = true; }
function spark(vals, color, h = 56) {
  if (vals.length < 2) return '<p class="sub">Il grafico si riempie con il passare dei mesi.</p>';
  const w = 300, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, k) => [k / (vals.length - 1) * w, h - 4 - (v - lo) / span * (h - 8)]);
  const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3" fill="${color}"/></svg>`;
}
const relBar = r => `<span class="relbar"><i style="left:50%;width:${Math.abs(r) / 2}%;${r < 0 ? 'transform:translateX(-100%);' : ''}background:${r >= 20 ? 'var(--peace)' : r <= -20 ? 'var(--war)' : 'var(--muted)'}"></i></span>`;

      <h3>Flotte schierate (${fl.length})</h3>${fl.length ? fl.map((f, k) => `<div class="drow"><b>${SEA_ICON} ${f.ships} navi</b><span class="sub">blocco a ${esc(pname(f.prov))}</span><button class="btn sm" data-recall="${k}">Richiama</button></div>`).join('') : '<p class="sub">Nessuna flotta davanti a coste nemiche.</p>'}
      <h3>Guarnigioni principali</h3>${top.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">${fmt(G.p[i].army)} soldati${G.p[i].fgt + G.p[i].bmb ? ` · ${AIR_ICON} ${G.p[i].fgt + G.p[i].bmb}` : ''}${G.p[i].ships ? ` · ${SEA_ICON} ${G.p[i].ships}` : ''}</span></button>`).join('')}`;
  } else if (dashTab === 'eco') {

function showEnd(win) {
  $('clock').hidden = true;
  showModal(`<h1 style="font-size:30px">${win ? 'Vittoria' : 'Sconfitta'}</h1>
    <p>${win ? `Il ${dateStr(G.day)} ${esc(fullName(G.player))} governa il mondo intero.` : `Il ${dateStr(G.day)} l'ultima provincia di ${esc(nat(G.player).place)} è caduta.`}</p>
    <div class="row"><button class="btn primary" id="again">Nuova partita</button></div>`, () => { $('again').onclick = () => { modalQueue.length = 0; hideModal(); toIntro(); }; });
}
function showNews() {
  unread = 0; $('newsCount').textContent = ''; $('newsBtn').classList.remove('has');
  showModal(`<div class="eyebrow">Notizie</div><h1 style="font-size:26px">Cosa sta succedendo</h1>
    <div class="feed">${feed.length ? feed.map((f, k) => `<button class="fi ${f.kind}" data-k="${k}"><span>${dateStr(f.day)}</span>${esc(f.msg)}</button>`).join('') : '<p>Ancora nessuna notizia.</p>'}</div>
    <div class="row"><button class="btn" id="fClose">Chiudi</button></div>`, () => {
    $('fClose').onclick = hideModal;
    for (const b of document.querySelectorAll('.fi')) b.onclick = () => {
      const f = feed[+b.dataset.k]; hideModal();
      if (f.prov >= 0) { const c = W.provs[f.prov].c; centerOn(c[0], c[1], Math.max(cam.s, 0.9), 0.4); requestRender(); }
    };
  });
}
function showArsenal() {
  const me = G.n[G.player];
  const status = me.prog < 0 ? 'Nessun programma nucleare.' : me.prog > 0 ? `Programma in corso: pronto tra ${Math.ceil((me.prog - G.day) / 30)} mesi.` : 'Programma completato: puoi costruire testate.';
  showModal(`<h1 style="font-size:26px">Arsenale nucleare</h1>
    <div class="arsenal"><svg><use href="#i-nuke"/></svg><div><b>${me.nukes} testate</b><span class="sub">${status}</span></div></div>
    <p>Per lanciare, tocca una provincia di un paese in guerra con te. L'esplosione distrugge quasi tutto l'esercito della provincia, azzera economia e fortezze e la contamina per un anno. Chi ha testate risponde, e altri paesi possono dichiararti guerra.</p>
    <div class="row">
      ${me.prog < 0 ? `<button class="btn primary" id="nProg" ${me.gold < NUKE_PROGRAM_COST ? 'disabled' : ''}>Avvia programma · ${NUKE_PROGRAM_COST} oro</button>` : ''}
      ${me.prog === 0 ? `<button class="btn primary" id="nBuild" ${me.gold < NUKE_COST ? 'disabled' : ''}>Costruisci testata · ${NUKE_COST} oro</button>` : ''}
      <button class="btn" id="nClose">Chiudi</button>
    </div>`, () => {
    if ($('nProg')) $('nProg').onclick = () => { hideModal(); startProgram(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    $('nClose').onclick = hideModal;
  });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>
      <li>Il tempo scorre da solo. In basso a destra metti in pausa o acceleri (1×, 2×, 4×). Ogni giorno incassi la rendita meno il mantenimento delle forze.</li>
      <li>Tocca una tua provincia per arruolare fanteria, caccia, bombardieri e navi (solo sulla costa), migliorare l'economia o fortificarla.</li>
      <li>Truppe di terra: le uniche che conquistano. Marciano lente attraverso il tuo territorio e quello degli alleati; marce lunghe abbassano il morale.</li>
      <li>Aviazione: bombarda le province nemiche entro il raggio, indebolendone truppe e difese. I caccia scortano e difendono.</li>
      <li>Marina: attacca le flotte nemiche, blocca i porti (rendita dimezzata), sostiene gli sbarchi e impedisce al nemico di attraversare il mare.</li>
      <li>Province staccate dalla capitale restano senza rifornimenti e perdono truppe.</li>
      <li>Per attaccare un paese devi prima dichiarargli guerra. Le province che conquisti lampeggiano in blu, quelle che perdi in rosso.</li>
      <li>Alleanze: se qualcuno attacca un tuo alleato ti viene chiesto di intervenire, e i tuoi alleati ti difendono.</li>
      <li>Il simbolo radioattivo apre l'arsenale nucleare. Il giornale raccoglie tutte le notizie.</li>
    </ul>
    <label class="toggle"><input type="checkbox" id="mAuto" ${G.autoPause ? 'checked' : ''}> Pausa automatica sugli allarmi gravi (guerra dichiarata, capitale attaccata, armi nucleari)</label>
    <div class="row"><button class="btn primary" id="mClose">Riprendi</button><button class="btn" id="mNew">Nuova partita</button></div>`, () => {
    $('mClose').onclick = hideModal;
    $('mAuto').onchange = e => { G.autoPause = e.target.checked; save(); };
    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); modalQueue.length = 0; hideModal(); toIntro(); }
      else { $('mNew').dataset.c = '1'; $('mNew').textContent = 'Conferma: perdi la partita attuale'; }
    };
  });
}
function setSpeed(k) {
  speedIdx = k;
  for (const b of document.querySelectorAll('#clock button')) b.classList.toggle('on', +b.dataset.s === k);
}

function findProv(name) { const p = W.provs.find(p => p.name === name); return p ? p.c : [MW / 2, MH / 2]; }
function toIntro() {
  phase = 'pick'; pickNation = -1; selected = -1;
  G = initialState(); ownVer++; bordersDirty = true; staticDirty = true;
  feed.length = 0; unread = 0;
  $('top').hidden = true; $('clock').hidden = true; $('panel').hidden = true; $('banner').hidden = true; closeDash();
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  vw = window.innerWidth; vh = window.innerHeight;
  const [x, y] = findProv('Vienna');
  centerOn(x, y, Math.max(minScale(), vw / 1100), 0.3);
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play'; lastDayShown = -1;
  $('intro').hidden = true; $('top').hidden = false; $('clock').hidden = false;
  setSpeed(1);
  staticDirty = true;
  updateUI(); resize();
}
$('startBtn').onclick = () => {
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 420), 0.25);
  startPlay(); save();
  toast(`Governi ${fullName(pickNation)}. Il tempo scorre: buona fortuna.`, 'good');
};
$('continueBtn').onclick = () => {
  if (!restore(loadSaved())) return;
  selected = -1;
  const c = W.provs[G.n[G.player].capital].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 700), 0.4);
  startPlay();
};
for (const b of document.querySelectorAll('#clock button')) b.onclick = () => setSpeed(+b.dataset.s);
window.addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'play' && !modalOpen) { e.preventDefault(); setSpeed(speedIdx ? 0 : 1); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('menuBtn').onclick = showMenu;
$('newsBtn').onclick = showNews;
$('dashBtn').onclick = () => openDash();
$('layerBtn').onclick = () => {
  mapMode = mapMode === 'sat' ? 'pol' : 'sat';
  try { localStorage.setItem('tdc-mapmode', mapMode); } catch (e) {}
  bordersDirty = true; staticDirty = true; requestRender();
  toast(mapMode === 'sat' ? 'Mappa satellitare' : 'Mappa politica a colori');
};

function boot(data) {
  W = buildWorld();
  readFonts();
  prepareSea();
  if (restore(data) && G.player >= 0) {
    vw = window.innerWidth; vh = window.innerHeight;
    const c = W.provs[G.n[G.player].capital].c; centerOn(c[0], c[1], vw / 700, 0.4);
    startPlay();
  } else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); bordersDirty = true; staticDirty = true; requestRender(); });
  requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
}
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
