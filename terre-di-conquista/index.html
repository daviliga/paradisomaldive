<style>
/* Layout: edge-to-edge map, floating frosted HUD cards (identity left, resources right), a floating sheet for the selection and a pill CTA for the turn. Single dark "command center" look. */
:root {

  --radius: 18px;

}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }

.glass {

  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

#top {

button { font-family: var(--body); }

  bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
  margin: 0 auto; max-width: 520px;

}
#panel .head { gap: 10px; }

.ic { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; flex: none; }

#panel .actions { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }

.slimrow { display: flex; align-items: center; gap: 10px; }

#panel .head { display: flex; align-items: center; gap: 12px; }
#panel .chip { width: 12px; height: 34px; border-radius: 6px; flex: none; }
#panel h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; min-width: 0; text-wrap: balance; letter-spacing: -0.01em; }
#panel .sub, .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
.cap-badge { display: inline-block; vertical-align: 3px; margin-left: 6px; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: rgba(245,196,81,.12); padding: 3px 7px; border-radius: 999px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

}
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 800; cursor: pointer;
  background: rgba(255,255,255,0.07); color: var(--ink); border: 1px solid var(--line);
}
.btn.primary { flex: 1; background: linear-gradient(135deg, #6f9bff, #4a6cf0); color: #fff; border: 0; box-shadow: 0 8px 22px rgba(74, 108, 240, 0.4); }

  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
}

#banner {

  for (const i of shuffle(provsOf(n).slice())) {
    if (G.p[i].owner !== n || G.p[i].army < 300) continue;
    const targets = enemyNb(i).filter(t => !marching.has(t)).sort((a, b) => defense(a) - defense(b));
    if (!targets.length) continue;
    const t = targets[0], send = G.p[i].army * 0.75;

        let best = -1, bv = 0;
        for (const w of me.wars) for (const t of provsOf(w)) {
          if (provDist(i, t) > AIR_RANGE) continue;
          const v = G.p[t].army - G.p[t].fgt * 400;
          if (v > bv) { bv = v; best = t; }
        }
        if (best >= 0) sendAir(n, i, best, Math.floor(P.fgt / 2), P.bmb, 'strike');
      }
      if (P.ships + P.sub + P.car >= 2 && W.provs[i].sp && Math.random() < 0.3) {
        let best = -1, bd = 500;
        for (const w of me.wars) for (const t of provsOf(w)) {
          if (!W.provs[t].sp || G.p[t].ships > P.ships) continue;
          if (G.units.some(u => u.kind === 'fleet' && u.owner === n && ptDist([u.x, u.y], W.provs[t].sp) < 60)) continue;
          const d = provDist(i, t);
          if (d < bd) { bd = d; best = t; }
        }
        if (best >= 0) sendFleet(n, { prov: i }, W.provs[best].sp, P.ships);
      }
      if (P.mis > 0 && Math.random() < 0.5) {
        let best = -1, bv = 300;
        for (const w of me.wars) for (const t of provsOf(w)) { if (provDist(i, t) <= missileRange(n) && G.p[t].army > bv) { bv = G.p[t].army; best = t; } }
        if (best >= 0) fireMissile(n, i, best);

    }
  }

  // move reserves toward the front while at war
  const owned = provsOf(n);
  const dist = new Map();
  let q = [];
  for (const i of owned) {
    const front = me.wars.length ? enemyNb(i).length > 0 : W.provs[i].nb.some(j => G.p[j].owner !== n);
    if (front) { dist.set(i, 0); q.push(i); }
  }
  while (q.length) {
    const nq = [];
    for (const a of q) for (const b of W.provs[a].nb) if (G.p[b].owner === n && !dist.has(b)) { dist.set(b, dist.get(a) + 1); nq.push(b); }
    q = nq;
  }
  if (me.wars.length) for (const i of owned) {
    const d = dist.get(i);

    const step = W.provs[i].nb.find(j => G.p[j].owner === n && dist.get(j) === d - 1);
    if (step !== undefined) sendArmy(n, { prov: i }, W.provs[step].c, G.p[i].army - 300, { merge: true, allowLanding: false });
  }

  // spend: soldiers where the threat is highest, some planes and ships at war, economy in peace
  const fronts = owned.filter(i => dist.get(i) === 0);
  const want = me.wars.length ? Infinity : owned.length * 1600 + 2000;
  if (me.wars.length && me.gold > 150) {
    const apt = owned.find(i => G.p[i].apt), port = owned.find(i => G.p[i].port);
    if (apt !== undefined && Math.random() < 0.25) { me.gold -= FGT_COST; G.p[apt].fgt++; }
    if (apt !== undefined && Math.random() < 0.2 && me.gold > BMB_COST) { me.gold -= BMB_COST; G.p[apt].bmb++; }
    if (port !== undefined && Math.random() < 0.15 && me.gold > SHIP_COST) { me.gold -= SHIP_COST; G.p[port].ships++; }
    const bar = owned.find(i => G.p[i].bar);
    if (bar !== undefined && Math.random() < 0.12 && me.gold > MIS_COST + 60) { me.gold -= MIS_COST; G.p[bar].mis++; }
    if (bar !== undefined && Math.random() < 0.25 && me.gold > TANK_COST + 60) { me.gold -= TANK_COST; G.p[bar].tnk += TANK_BATCH; }
    if (port !== undefined && hasTech(n, 'subs') && Math.random() < 0.06 && me.gold > SUB_COST + 80) { me.gold -= SUB_COST; G.p[port].sub++; }
    const cap = me.capital;
    if (G.p[cap].owner === n && G.p[cap].aa < (hasTech(n, 'aa2') ? 2 : 1) && me.gold > 150 && Math.random() < 0.1) { me.gold -= AA_COST[G.p[cap].aa]; G.p[cap].aa++; }
    if (G.p[cap].owner === n && hasTech(n, 'abm') && !G.p[cap].abm && me.gold > ABM_COST + 100 && Math.random() < 0.05) { me.gold -= ABM_COST; G.p[cap].abm = 1; }
  }
  // in peace the armed forces are built up slowly, as the budget allows
  if (!me.wars.length && Math.random() < 0.4) {
    const apt = owned.find(i => G.p[i].apt), port = owned.find(i => G.p[i].port), bar = owned.find(i => G.p[i].bar), r = Math.random();
    const buy = (cost, fn) => { if (me.gold >= cost) { me.gold -= cost; fn(); } };
    if (r < 0.3 && bar !== undefined) buy(TANK_COST, () => { G.p[bar].tnk += TANK_BATCH; });
    else if (r < 0.55 && apt !== undefined) buy(FGT_COST, () => G.p[apt].fgt++);
    else if (r < 0.7 && apt !== undefined) buy(BMB_COST, () => G.p[apt].bmb++);
    else if (r < 0.85 && port !== undefined) buy(SHIP_COST, () => G.p[port].ships++);
    else if (r < 0.9 && port !== undefined && hasTech(n, 'subs')) buy(SUB_COST, () => G.p[port].sub++);
    else if (r < 0.93 && port !== undefined && hasTech(n, 'carrier')) buy(CAR_COST, () => G.p[port].car++);
    else if (bar !== undefined) buy(MIS_COST, () => G.p[bar].mis++);
    const cap = me.capital;
    if (G.p[cap].owner === n && !G.p[cap].aa && me.gold > 200 && Math.random() < 0.1) { me.gold -= AA_COST[0]; G.p[cap].aa = 1; }
  }
  if (me.gold > 220 && Math.random() < 0.05) {
    const front = owned.filter(i => !G.p[i].bar && W.provs[i].nb.some(j => G.p[j].owner !== n));
    if (front.length) { me.gold -= BAR_COST; G.p[front[0]].bar = 1; }
  }
  let army = forcesOf(n).army, guard = 0;

    let target = barracks[0], worst = -Infinity;
    for (const i of barracks) {

    }
    me.gold -= RECRUIT_COST; G.p[target].army += RECRUIT; army += RECRUIT;
  }
  if (!me.wars.length && me.gold > 50) {
    const cheap = owned.filter(i => G.p[i].eco < 5).sort((a, b) => G.p[a].eco - G.p[b].eco)[0];
    if (cheap !== undefined && me.gold >= ecoCost(cheap)) { me.gold -= ecoCost(cheap); G.p[cheap].eco++; }
  }
}

function aiSpy(n) {

// ---------- the home front: stability, research, resources (player) ----------
function stabFactors(n) {

  if (x.draft) f.push(['Leva obbligatoria', -10]);
  if (x.wars.length) f.push([`${x.wars.length} ${x.wars.length === 1 ? 'guerra' : 'guerre'} in corso`, -Math.min(15, x.wars.length * 4)]);
  if (sanctioned(n)) f.push(['Sanzioni ONU', -8]);
  if (x.short && x.short.food) f.push(['Carenza di cibo', -15]);
  const rad = provsOf(n).filter(i => radLeft(i)).length;
  if (rad) f.push(['Province contaminate', -Math.min(12, rad * 4)]);
  if (Math.round(x.mood)) f.push([x.mood > 0 ? 'Vittorie recenti' : 'Sconfitte recenti', Math.round(x.mood)]);
  if (x.gold > 500) f.push(['Casse piene', 5]);

}
const stabTarget = n => Math.max(0, Math.min(100, stabFactors(n).reduce((s, f) => s + f[1], 0)));

  x.mood *= 0.985;
  if (was >= 35 && x.stab < 35) raiseAlert('Proteste in piazza: la stabilità è sotto 35. La rendita cala del 15%.', x.capital, false);
  if (was >= 20 && x.stab < 20) raiseAlert('Il paese è sull\'orlo della rivolta: alcune province possono ribellarsi.', x.capital, true);
  if (x.stab < 20 && G.day % 10 === 0 && Math.random() < 0.35) {
    const cand = provsOf(n).filter(i => i !== x.capital && !G.p[i].rev);
    if (cand.length) { const i = cand[Math.floor(Math.random() * cand.length)]; G.p[i].rev = 1; markAlert(i, 'alert'); raiseAlert(`${pname(i)} è in rivolta: non paga tasse e i soldati disertano. Reprimila o alza la stabilità.`, i, false); staticDirty = true; }
  }
  if (x.stab >= 35) for (const i of provsOf(n)) if (G.p[i].rev) { G.p[i].rev = 0; news(`La rivolta a ${pname(i)} è finita.`, 'good', i); staticDirty = true; }
  for (const i of provsOf(n)) if (G.p[i].rev) G.p[i].army = Math.floor(G.p[i].army * 0.99);
  // research
  const rpDay = (income(n).rd + 2) / 30 * (hasTech(n, 'ind') ? 1.1 : 1);
  if (x.res && !x.tech.includes(x.res)) {
    x.rp += rpDay;
    if (x.rp >= TECHS[x.res].cost) { x.rp -= TECHS[x.res].cost; x.tech.push(x.res); news(`Ricerca completata: ${TECHS[x.res].name}. ${TECHS[x.res].what[0].toUpperCase() + TECHS[x.res].what.slice(1)}.`, 'good'); x.res = ''; }
  } else x.rp = Math.min(x.rp + rpDay, 400);

}
// monthly production and consumption of oil, steel and food
function resourceFlow(n) {
  const prod = { oil: 0, steel: 0, food: 0 }, use = { oil: 0, steel: 0, food: 0 };
  let pop = 0;
  for (const i of provsOf(n)) {
    const a2 = WD.countries[W.provs[i].country].a, P = G.p[i];
    if (radLeft(i) || P.rev) continue;
    pop += W.provs[i].pop;
    // goods only reach the market along working railways
    const link = !P.sup ? 0 : railCut(i) ? 0.5 : 1;
    prod.food += Math.max(0.3, Math.min(6, W.provs[i].pop / 1.0e6)) * (hasTech(n, 'agri') ? 1.3 : 1);
    prod.oil += (OIL[a2] || 0) * link;
    prod.steel += ((STEEL[a2] || 0) + (P.eco >= 4 ? 0.4 : 0) + (hasTech(n, 'ind') ? 0.3 : 0)) * link;

  const f = forcesOf(n);

  use.steel = provsOf(n).length * 0.05;

const buyPrice = k => Math.round(G.market[k] * 10 * (sanctioned(G.player) ? 1.5 : 1));
const sellPrice = k => Math.round(G.market[k] * 10 * (sanctioned(G.player) ? 0.6 : 0.85));

// ---------- the clock ----------
function dailyUpdate() {

    const x = G.n[n];

  }

        <button class="pb" id="aBreak">${pendingConfirm === 'break' + o ? 'Conferma' : 'Rompi alleanza'}</button>`;
    } else {
      const warn = G.n[o].allies.filter(x => x !== me && G.n[x].alive).length;
      html += `<button class="pb" id="aAlly" ${cool('pa') ? 'disabled' : ''}>Alleanza</button>
        <button class="pb" id="aAid" ${cool('ai') || gold < AID_COST ? 'disabled' : ''}>Aiuti ${AID_COST}</button>
        ${tr ? '' : `<button class="pb war" id="aWar">${pendingConfirm === o ? `Conferma${warn ? ` (+${warn} alleati)` : ''}` : 'Guerra'}</button>`}`;
    }
    html += `</div>`;
  }
  panel.innerHTML = html;
  panel.hidden = false;
  $('closePanel').onclick = () => { selected = -1; moveMode = false; panelOpen = false; pendingConfirm = null; renderPanel(); staticDirty = true; requestRender(); };
  if ($('aRepress')) $('aRepress').onclick = () => repress(i);
  if ($('aRail')) $('aRail').onclick = () => { if (spend(30)) { G.p[i].rail = 0; staticDirty = true; news(`Ferrovia riparata a ${pname(i)}.`, 'good', i); afterAction(); } };
  for (const b of panel.querySelectorAll('[data-retreat]')) b.onclick = () => {
    const bt = G.battles.find(x => x.id === +b.dataset.retreat);
    if (bt) { retreat(bt); toast(`Ritirata da ${pname(i)}: i superstiti tornano indietro.`); afterAction(); }
  };
  if (mine) {
    for (const b of panel.querySelectorAll('[data-mode]')) b.onclick = () => {
      moveMode = b.dataset.mode; panelOpen = false;
      const r = moveMode === 'air' ? AIR_RANGE : moveMode === 'missile' ? missileRange(me) : 0;
      if (r) centerOn(pr.c[0], pr.c[1], Math.min(cam.s, Math.min(vw, vh * 0.7) / (r * 2.3)), 0.42);
      renderPanel(); staticDirty = true; requestRender();
    };
    $('pManage').onclick = () => { panelOpen = !panelOpen; renderPanel(); };
    $('pNuke').onclick = enterNukeMode;
    if (panelOpen) {
      $('rInf').onclick = () => recruit(i, 'inf');
      $('rTnk').onclick = () => recruit(i, 'tnk');
      $('rSub').onclick = () => recruit(i, 'sub');
      $('rCar').onclick = () => recruit(i, 'car');
      $('aAA').onclick = () => upgradeAA(i);
      $('aABM').onclick = () => buildABM(i);
      $('rMis').onclick = () => recruit(i, 'mis');
      $('rFgt').onclick = () => recruit(i, 'fgt');
      $('rBmb').onclick = () => recruit(i, 'bmb');
      $('rShip').onclick = () => recruit(i, 'ship');
      $('aEco').onclick = () => upgradeEco(i);
      $('aFort').onclick = () => fortify(i);
      for (const b of panel.querySelectorAll('[data-build]')) b.onclick = () => build(i, b.dataset.build);
    }
  } else {
    const confirmThen = (key, fn) => () => { if (pendingConfirm === key) fn(); else { pendingConfirm = key; renderPanel(); } };
    if ($('aPeace')) $('aPeace').onclick = () => playerPeace(o);
    if ($('aNuke')) $('aNuke').onclick = confirmThen('nuke' + i, () => playerNuke(i));
    if ($('aWar')) $('aWar').onclick = confirmThen(o, () => playerDeclare(o));
    if ($('aAlly')) $('aAlly').onclick = () => playerAlly(o);
    if ($('aAid')) $('aAid').onclick = () => playerAid(o);
    if ($('aBreak')) $('aBreak').onclick = confirmThen('break' + o, () => playerBreak(o));
    $('aSpy').onclick = () => showSpy(o, i);
  }
}

let dashOpen = false, dashTab = 'over';

function openDash(tab) { dashOpen = true; if (tab) dashTab = tab; $('dash').hidden = false; renderDash(); }
function closeDash() { dashOpen = false; $('dash').hidden = true; }
function spark(vals, color, h = 56) {
  if (vals.length < 2) return '<p class="sub">Il grafico si riempie con il passare dei mesi.</p>';
  const w = 300, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, k) => [k / (vals.length - 1) * w, h - 4 - (v - lo) / span * (h - 8)]);
  const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3" fill="${color}"/></svg>`;
}

    <h3>Rendita mensile nel tempo</h3>${spark(G.hist.map(h => h.inc), '#3ddc97')}
    <h3>Province più ricche</h3>${rich.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">economia ${G.p[i].eco}/5</span><span class="rv">+${provIncome(i)}</span></button>`).join('')}
    <h3>Problemi</h3>${issues.length ? issues.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">${[radLeft(i) ? 'contaminata' : '', blockaded(i) ? 'porto bloccato' : '', !G.p[i].sup ? 'senza rifornimenti' : ''].filter(Boolean).join(', ')}</span></button>`).join('') : '<p class="sub">Nessuna provincia in difficoltà.</p>'}`;
  } else {
    const score = n => { const ff = forcesOf(n); return provsOf(n).length * 10 + power(ff) / 1000 + income(n).inc; };
    const all = G.n.map((_, n) => n).filter(n => G.n[n].alive).sort((a, b) => score(b) - score(a));
    const myRank = all.indexOf(me) + 1;
    body = `<p class="sub">Punteggio: province, forza militare ed economia. Sei <b>${myRank}°</b> su ${all.length}.</p>
      ${all.slice(0, 12).map((n, k) => `<button class="drow ${n === me ? 'me' : ''}" data-goc="${n}"><span class="rk">${k + 1}</span><span class="chip" style="background:${nat(n).color}"></span><b>${esc(fullName(n))}</b><span class="sub">${provsOf(n).length} prov. · ${fmt(armyOf(n))}</span><span class="rv">${Math.round(score(n))}</span></button>`).join('')}
      ${myRank > 12 ? `<button class="drow me" data-goc="${me}"><span class="rk">${myRank}</span><b>${esc(fullName(me))}</b><span class="rv">${Math.round(score(me))}</span></button>` : ''}`;
  }
  const el = $('dash');
  const scroll = el.querySelector('.dbody')?.scrollTop || 0;
  el.innerHTML = `<div class="dhead"><div><div class="eyebrow">Stato · ${dateStr(G.day)}</div><h1>${esc(fullName(me))}</h1></div>
      <button class="icon-btn" id="dClose" aria-label="Chiudi" style="background:rgba(255,255,255,.06)"><svg><use href="#i-close"/></svg></button></div>
    <div class="dtabs">${tabs.map(([k, l]) => `<button class="${k === dashTab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="dbody">${body}</div>`;
  el.querySelector('.dbody').scrollTop = scroll;
  $('dClose').onclick = closeDash;
  for (const b of el.querySelectorAll('[data-tab]')) b.onclick = () => { dashTab = b.dataset.tab; renderDash(); el.querySelector('.dbody').scrollTop = 0; };
  for (const b of el.querySelectorAll('[data-go]')) b.onclick = () => goTo(+b.dataset.go);
  for (const b of el.querySelectorAll('[data-goc]')) b.onclick = () => goTo(G.n[+b.dataset.goc].capital);
  for (const b of el.querySelectorAll('[data-peace]')) b.onclick = () => playerPeace(+b.dataset.peace);
  if ($('dNuke')) $('dNuke').onclick = () => { closeDash(); showArsenal(); };
  for (const b of el.querySelectorAll('[data-tax]')) b.onclick = () => { x.tax = +b.dataset.tax; afterAction(); };
  if ($('gDraft')) $('gDraft').onchange = e => { x.draft = e.target.checked; afterAction(); };
  if ($('gRb')) $('gRb').onchange = e => { x.rb = +e.target.value; afterAction(); };
  for (const b of el.querySelectorAll('[data-tech]')) b.onclick = () => { x.res = b.dataset.tech; toast(`Ricerca avviata: ${TECHS[x.res].name}.`); afterAction(); };
  for (const b of el.querySelectorAll('[data-buy]')) b.onclick = () => trade(b.dataset.buy, true);
  for (const b of el.querySelectorAll('[data-sell]')) b.onclick = () => trade(b.dataset.sell, false);
  for (const b of el.querySelectorAll('[data-recall]')) b.onclick = () => { const f = fleetsOf(me)[+b.dataset.recall]; if (f) recallFleet(f); afterAction(); };
  for (const b of el.querySelectorAll('[data-unit]')) b.onclick = () => { const u = unitById(+b.dataset.unit); if (!u) return; closeDash(); selUnit = u.id; selected = -1; centerOn(u.x, u.y, Math.max(cam.s, 1), 0.35); renderPanel(); requestRender(); };
}

// modals pause the clock; requests arriving meanwhile wait in line
function ask(fn) { if (modalOpen || phase !== 'play') modalQueue.push(fn); else fn(); }
function showModal(html, wire) { $('modalBox').innerHTML = html; $('modal').hidden = false; modalOpen = true; wire && wire(); }
function hideModal() {
  $('modal').hidden = true; modalOpen = false;
  if (modalQueue.length && phase === 'play') modalQueue.shift()();
}
function showOffer(n) {
  if (!atWar(G.player, n)) return hideModal();
  showModal(`<div class="eyebrow">Diplomazia</div><h1 style="font-size:26px">Proposta di pace</h1><p>${esc(fullName(n))} chiede di firmare la pace. Seguirebbero 10 mesi di tregua.</p>
    <div class="row"><button class="btn primary" id="okP">Accetta</button><button class="btn" id="noP">Rifiuta</button></div>`, () => {
    $('okP').onclick = () => { makePeace(G.player, n); hideModal(); news(`Pace con ${fullName(n)}.`, 'good', G.n[n].capital); afterAction(); };
    $('noP').onclick = hideModal;
  });
}
function showAllianceOffer(n) {
  if (allied(G.player, n) || atWar(G.player, n) || !G.n[n].alive) return hideModal();
  const enemies = G.n[n].wars.filter(w => G.n[w].alive);
  showModal(`<div class="eyebrow">Diplomazia</div><h1 style="font-size:26px">Proposta di alleanza</h1>
    <p>${esc(fullName(n))} propone un'alleanza difensiva: se qualcuno attacca uno dei due, l'altro entra in guerra.${enemies.length ? ` Al momento è in guerra con ${enemies.slice(0, 3).map(x => esc(fullName(x))).join(', ')}.` : ''}</p>
    <div class="row"><button class="btn primary" id="okA">Accetta</button><button class="btn" id="noA">Rifiuta</button></div>`, () => {
    $('okA').onclick = () => { makeAlliance(G.player, n); hideModal(); afterAction(); };
    $('noA').onclick = hideModal;
  });
}
function showCallToArms(ally, aggressor) {
  if (!allied(G.player, ally) || atWar(G.player, aggressor) || !G.n[ally].alive || !G.n[aggressor].alive) return hideModal();
  showModal(`<div class="eyebrow">Alleanza</div><h1 style="font-size:26px">Un alleato è sotto attacco</h1>
    <p>${esc(fullName(aggressor))} ha dichiarato guerra a ${esc(fullName(ally))}. Se non intervieni, l'alleanza finisce.</p>
    <div class="row"><button class="btn primary" id="okC">Entra in guerra</button><button class="btn" id="noC">Resta fuori</button></div>`, () => {
    $('okC').onclick = () => { hideModal(); declareWar(G.player, aggressor); news(`Sei entrato in guerra contro ${fullName(aggressor)} al fianco di ${fullName(ally)}.`, 'bad', G.n[aggressor].capital); afterAction(); };
    $('noC').onclick = () => { hideModal(); breakAlliance(G.player, ally); afterAction(); };
  });
}
function showEnd(win) {
  $('clock').hidden = true; $('nukeBtn').hidden = true; $('multiBtn').hidden = true;
  showModal(`<h1 style="font-size:30px">${win ? 'Vittoria' : 'Sconfitta'}</h1>
    <p>${win ? `Il ${dateStr(G.day)} ${esc(fullName(G.player))} governa il mondo intero.` : `Il ${dateStr(G.day)} l'ultima provincia di ${esc(nat(G.player).place)} è caduta.`}</p>
    <div class="row"><button class="btn primary" id="again">Nuova partita</button></div>`, () => { $('again').onclick = () => { modalQueue.length = 0; hideModal(); toIntro(); }; });
}
function showNews() {
  unread = 0; $('newsCount').textContent = ''; $('newsBtn').classList.remove('has');
  showModal(`<div class="eyebrow">Notizie</div><h1 style="font-size:26px">Cosa sta succedendo</h1>
    <div class="feed">${feed.length ? feed.map((f, k) => `<button class="fi ${f.kind}" data-k="${k}"><span>${dateStr(f.day)}</span>${esc(f.msg)}</button>`).join('') : '<p>Ancora nessuna notizia.</p>'}</div>
    <div class="row"><button class="btn" id="fClose">Chiudi</button></div>`, () => {
    $('fClose').onclick = hideModal;
    for (const b of document.querySelectorAll('.fi')) b.onclick = () => {
      const f = feed[+b.dataset.k]; hideModal();
      if (f.prov >= 0) { const c = W.provs[f.prov].c; centerOn(c[0], c[1], Math.max(cam.s, 0.9), 0.4); requestRender(); }
    };
  });
}
function showArsenal() {
  const me = G.n[G.player];
  const status = me.prog < 0 ? 'Nessun programma nucleare.' : me.prog > 0 ? `Programma in corso: pronto tra ${Math.ceil((me.prog - G.day) / 30)} mesi.` : 'Programma completato: puoi costruire testate.';
  showModal(`<h1 style="font-size:26px">Arsenale nucleare</h1>
    <div class="arsenal"><svg><use href="#i-nuke"/></svg><div><b>${me.nukes} testate</b><span class="sub">${status}</span></div></div>
    <p>Per lanciare usa il pulsante ☢ in basso a sinistra (o quello nel pannello di una tua provincia), poi tocca una provincia di un paese in guerra con te e conferma. Uno scudo antimissile nemico può fermare la testata. L'esplosione distrugge quasi tutto l'esercito della provincia, azzera economia e fortezze e la contamina per un anno. Chi ha testate risponde, e altri paesi possono dichiararti guerra.</p>
    <div class="row">
      ${me.prog < 0 ? `<button class="btn primary" id="nProg" ${me.gold < NUKE_PROGRAM_COST ? 'disabled' : ''}>Avvia programma · ${NUKE_PROGRAM_COST} oro</button>` : ''}
      ${me.prog === 0 ? `<button class="btn primary" id="nBuild" ${me.gold < NUKE_COST ? 'disabled' : ''}>Costruisci testata · ${NUKE_COST} oro</button>` : ''}
      <button class="btn" id="nClose">Chiudi</button>
    </div>`, () => {
    if ($('nProg')) $('nProg').onclick = () => { hideModal(); startProgram(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    $('nClose').onclick = hideModal;
  });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>
      <li>Il tempo scorre da solo. In basso a destra metti in pausa o acceleri (1×, 2×, 4×). Ogni giorno incassi la rendita meno il mantenimento delle forze.</li>
      <li>Tocca una tua provincia per arruolare fanteria, caccia, bombardieri e navi (solo sulla costa), migliorare l'economia o fortificarla.</li>
      <li>Truppe di terra: le uniche che conquistano. Le mandi in un punto qualsiasi: dove arrivano restano come armata sulla mappa, che puoi toccare e muovere di nuovo.</li>
      <li>Lanciamissili: si costruiscono in caserma e colpiscono province o unità nemiche nel loro raggio. Un missile impiega qualche giorno ad arrivare; uno nucleare intercontinentale qualche giorno in più, e il bersaglio viene avvisato.</li>
      <li>Aviazione: bombarda le province nemiche entro il raggio, indebolendone truppe e difese. I caccia scortano e difendono.</li>
      <li>Marina: attacca le flotte nemiche, blocca i porti (rendita dimezzata), sostiene gli sbarchi e impedisce al nemico di attraversare il mare.</li>
      <li>Province staccate dalla capitale restano senza rifornimenti e perdono truppe.</li>
      <li>Per attaccare un paese devi prima dichiarargli guerra. Le province che conquisti lampeggiano in blu, quelle che perdi in rosso.</li>
      <li>Alleanze: se qualcuno attacca un tuo alleato ti viene chiesto di intervenire, e i tuoi alleati ti difendono.</li>
      <li>Le battaglie durano qualche giorno: sulla mappa vedi le spade incrociate e una barra con le forze in campo. Manda rinforzi prima della fine, o ritirati.</li>
      <li>Carri armati (in caserma): valgono 60 soldati l'uno e rendono l'armata più veloce. Sottomarini (invisibili finché non sono vicini) e portaerei (8 aerei a bordo) richiedono la tecnologia.</li>
      <li>Contraerea: abbatte aerei nemici. Scudo antimissile: intercetta missili e testate vicino alle tue province.</li>
      <li>Le unità che vincono guadagnano esperienza: fino a tre stelle, +10% di forza ciascuna.</li>
      <li>Tappe: nel movimento premi “+ Tappe” e tocca più punti. Le flotte possono fare la pattuglia tra due punti. Tocca un'unità in marcia per fermarla.</li>
      <li>Selezione multipla (il pulsante con il riquadro, in basso a sinistra): trascina un dito per scegliere più armate e muoverle insieme.</li>
      <li>Governo (nel cruscotto): tasse, leva obbligatoria e bilancio della ricerca. La stabilità sotto 35 porta proteste, sotto 20 rivolte.</li>
      <li>L'ONU sanziona chi attacca senza motivo o usa armi nucleari; aiuta chi viene aggredito.</li>
      <li>Risorse: petrolio, acciaio e cibo. Si producono nelle province e si comprano o vendono nel Commercio.</li>
      <li>Spie: tocca una provincia straniera e premi Spie per infiltrarti, sabotare o rubare tecnologie.</li>
      <li>DEFCON: l'allerta mondiale va da 5 (pace) a 1. Sale con le guerre tra grandi potenze e con i lanci. Le testate si possono usare solo a DEFCON 2 o 1.</li>
      <li>Ogni paese ha un capo con il suo carattere (aggressivo, prudente, pacifico, imprevedibile) che decide guerre e paci. I capi invecchiano, muoiono o perdono le elezioni.</li>
      <li>Ferrovie: collegano le tue città. Bombardamenti, missili e sabotaggi le interrompono: rifornimenti e produzione rallentano finché non le ripari.</li>
      <li>La ricaduta radioattiva di un'atomica segue il vento e contamina le province sottovento.</li>
      <li>I segnali rossi pulsanti sulla mappa indicano attacchi e allarmi recenti: toccali per andarci.</li>
      <li>Il pulsante ☢ in basso a sinistra apre la modalità nucleare. Il giornale raccoglie tutte le notizie.</li>
    </ul>
    <label class="toggle"><input type="checkbox" id="mAuto" ${G.autoPause ? 'checked' : ''}> Pausa automatica sugli allarmi gravi (guerra dichiarata, capitale attaccata, armi nucleari)</label>
    <label class="toggle"><input type="checkbox" id="mSound" ${soundOn ? 'checked' : ''}> Suoni: esplosioni, lanci, sirene di allarme</label>
    <div class="row"><button class="btn" id="mSlots">Salvataggi</button><button class="btn" id="mTut">Rivedi tutorial</button></div>
    <div class="row"><button class="btn primary" id="mClose">Riprendi</button><button class="btn" id="mNew">Nuova partita</button></div>`, () => {
    $('mClose').onclick = hideModal;
    $('mSlots').onclick = () => { hideModal(); showSlots(true); };
    $('mTut').onclick = () => { hideModal(); startTutorial(); };
    $('mAuto').onchange = e => { G.autoPause = e.target.checked; save(); };
    $('mSound').onchange = e => { soundOn = e.target.checked; try { localStorage.setItem('tdc-sound', soundOn ? '1' : '0'); } catch (er) {} if (soundOn) audio(); };
    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); modalQueue.length = 0; hideModal(); toIntro(); }
      else { $('mNew').dataset.c = '1'; $('mNew').textContent = 'Conferma: perdi la partita attuale'; }
    };
  });
}
function setSpeed(k) {
  speedIdx = k;
  for (const b of document.querySelectorAll('#clock button')) b.classList.toggle('on', +b.dataset.s === k);
}

function findProv(name) { const p = W.provs.find(p => p.name === name); return p ? p.c : [MW / 2, MH / 2]; }
function toIntro() {
  phase = 'pick'; pickNation = -1; selected = -1;
  G = initialState(); applyScenario(scenKey); ownVer++; bordersDirty = true; staticDirty = true;
  feed.length = 0; unread = 0;
  renderScen();
  $('top').hidden = true; $('clock').hidden = true; $('panel').hidden = true; $('nukeBtn').hidden = true; $('multiBtn').hidden = true; marks.length = 0;
  $('dashBtn').hidden = false; $('duelBar').hidden = true; plumes.length = 0;
  multi = false; multiSel.units.clear(); multiSel.provs.clear(); selMove = 0; selUnit = 0; moveMode = false; nukeAim = -1; wayMode = ''; wayPts = []; $('banner').hidden = true; closeDash();
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  $('loadBtn').hidden = ![1, 2, 3].some(k => slotMeta(k));
  vw = window.innerWidth; vh = window.innerHeight;
  const [x, y] = findProv('Vienna');
  centerOn(x, y, Math.max(minScale(), vw / 1100), 0.3);
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play'; lastDayShown = -1;
  $('intro').hidden = true; $('top').hidden = false; $('clock').hidden = false; $('nukeBtn').hidden = false; $('multiBtn').hidden = false;
  setSpeed(1);
  staticDirty = true;
  updateUI(); resize();
}
function startWatch() {
  G.player = -1; G.observer = true; selected = -1;
  updateDefcon(true);
  centerOn(MW / 2, MH * 0.45, minScale() * 1.6, 0.45);
  startPlay();
  $('nukeBtn').hidden = true; $('multiBtn').hidden = true; $('dashBtn').hidden = true;
  setSpeed(2);
  toast('Osservi il mondo. Tocca una provincia per intervenire come un dio.', 'good');
}
$('startBtn').onclick = () => {
  if (modeKey === 'watch') return startWatch();
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 420), 0.25);
  if (modeKey === 'duel') { setupDuel(); updateDuelBar(); } else setGoals();
  updateDefcon(true);
  startPlay(); save();
  const wars = G.n[G.player].wars.filter(w => G.n[w].alive);
  toast(`Governi ${fullName(pickNation)}.${wars.length ? ` Sei già in guerra con ${wars.map(fullName).join(', ')}!` : ' Nessun paese ha ancora forze armate: arruolale in caserma, aeroporto e porto prima degli altri.'}`, wars.length ? 'bad' : 'good');
  if (!tutorialDone()) startTutorial();
};
$('loadBtn').onclick = () => showSlots(false);
$('continueBtn').onclick = () => {
  if (!restore(loadSaved())) return;
  if (!G.goals && !G.duel) setGoals();
  updateDuelBar();
  selected = -1;
  const c = W.provs[G.n[G.player].capital].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 700), 0.4);
  startPlay();
};
for (const b of document.querySelectorAll('#clock button')) b.onclick = () => setSpeed(+b.dataset.s);
window.addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'play' && !modalOpen) { e.preventDefault(); setSpeed(speedIdx ? 0 : 1); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('menuBtn').onclick = showMenu;
$('newsBtn').onclick = showNews;
$('dashBtn').onclick = () => openDash();
$('nukeBtn').onclick = () => { if (phase === 'play') enterNukeMode(); };
$('multiBtn').onclick = () => { if (phase !== 'play') return; toggleMulti(!multi); if (multi) toast('Selezione multipla: trascina un dito sulla mappa per scegliere le unità.'); };
$('layerBtn').onclick = () => {
  mapMode = mapMode === 'sat' ? 'night' : mapMode === 'night' ? 'pol' : 'sat';
  try { localStorage.setItem('tdc-mapmode', mapMode); } catch (e) {}
  bordersDirty = true; staticDirty = true; requestRender();
  toast({ sat: 'Mappa satellitare di giorno', night: 'Mappa notturna: le luci delle città', pol: 'Mappa politica a colori' }[mapMode]);
};

function boot(data) {
  W = buildWorld();
  readFonts();
  prepareSea();
  if (restore(data) && G.player >= 0) {
    vw = window.innerWidth; vh = window.innerHeight;
    const c = W.provs[G.n[G.player].capital].c; centerOn(c[0], c[1], vw / 700, 0.4);
    startPlay();
  } else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); bordersDirty = true; staticDirty = true; requestRender(); });
  requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
}
if ('serviceWorker' in navigator && !window.claude && /github\.io$|^localhost$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
