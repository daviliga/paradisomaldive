<style>
/* Layout: full-screen map canvas, a slim command bar on top, a bottom sheet for the selected province. Single dark "war room" look. */
:root {
  --sea: #13243b;
  --sea-deep: #0c1828;
  --ink: #ece6d6;
  --muted: #9ba7b6;
  --panel: rgba(16, 24, 37, 0.94);
  --line: rgba(236, 230, 214, 0.14);
  --gold: #d8b25a;
  --war: #d0563e;
  --peace: #78ad72;
  --display: "IM Fell English SC", "Iowan Old Style", "Palatino", Georgia, serif;
  --body: "Alegreya Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sea-deep);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; background: var(--sea-deep); }

#top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(var(--panel), rgba(16, 24, 37, 0.7));
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
#top .flag { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.5); flex: none; }
#top .who { font-family: var(--display); font-size: 17px; line-height: 1.1; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .who small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); }
.stat { display: flex; flex-direction: column; align-items: flex-end; font-size: 14px; line-height: 1.15; }
.stat span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat b { font-weight: 700; }
.stat .gold { color: var(--gold); }
.icon-btn { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; flex: none; cursor: pointer; }

button { font-family: var(--body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#endTurn {
  position: fixed; z-index: 6;
  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--gold); color: #1b1408; border: 0; border-radius: 999px;
  padding: 14px 20px; font-size: 16px; font-weight: 700; letter-spacing: .02em;
  box-shadow: 0 6px 20px rgba(0,0,0,.45); cursor: pointer;
}
#endTurn:disabled { opacity: .5; }

#panel {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 76px) max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 14px 14px 0 0;
  display: grid; gap: 12px;
  font-variant-numeric: tabular-nums;
  max-height: 62%; overflow-y: auto;
}
#panel .head { display: flex; align-items: center; gap: 10px; }
#panel .chip { width: 14px; height: 14px; border-radius: 3px; flex: none; }
#panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; flex: 1; min-width: 0; text-wrap: balance; }
#panel .sub { color: var(--muted); font-size: 13px; }
#panel .close { margin-left: auto; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell { display: flex; flex-direction: column; gap: 2px; }
.cell span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cell b { font-size: 17px; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.act {
  background: rgba(236,230,214,.06); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 6px; font-size: 14px; font-weight: 500; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.act small { color: var(--gold); font-size: 12px; }
.act:disabled { opacity: .4; }
.act.war { border-color: var(--war); color: #f3c2b6; }
.act.peace { border-color: var(--peace); color: #cfe7c9; }
.act.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 8px; }
.move { display: grid; gap: 6px; }
.move label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.move label b { color: var(--ink); }
.move input { width: 100%; accent-color: var(--gold); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.tag { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); }
.tag.war { color: #f3c2b6; border-color: var(--war); }
.tag.peace { color: #cfe7c9; border-color: var(--peace); }
.tag.truce { color: var(--gold); border-color: var(--gold); }

#toasts {
  position: fixed; z-index: 7; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  display: grid; justify-items: center; gap: 6px; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.toast {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: 8px; padding: 8px 12px; font-size: 14px; max-width: 420px;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
  animation: tin .25s ease-out;
}
.toast.bad { border-left-color: var(--war); }
.toast.good { border-left-color: var(--peace); }
@keyframes tin { from { transform: translateY(-6px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

#intro, #modal {
  position: fixed; z-index: 8; left: 0; right: 0; bottom: 0;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  display: grid; gap: 12px;
}
#modal { top: 0; bottom: 0; border-radius: 0; align-content: center; justify-items: center; background: rgba(8, 13, 22, 0.86); }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; display: grid; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: .01em; }
#intro p, #modal p { margin: 0; line-height: 1.45; max-width: 60ch; color: var(--muted); }
#intro .pick { display: flex; align-items: center; gap: 10px; min-height: 28px; }
#intro .pick b { font-family: var(--display); font-size: 20px; font-weight: 400; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
  background: rgba(236,230,214,.06); color: var(--ink); border: 1px solid var(--line);
}
.btn.primary { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.btn:disabled { opacity: .45; }
#modal ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.45; }
</style>

<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
<script>
'use strict';
const MW = 2000, MH = 1300;
const SAVE_KEY = 'terre-di-conquista-v1';
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const RECRUIT = 1000, RECRUIT_COST = 20;

// ---------- random + noise ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(r) {
  const P = new Float32Array(65536);
  for (let i = 0; i < P.length; i++) P[i] = r();
  const g = (x, y) => P[((y & 255) << 8) | (x & 255)];
  const s = t => t * t * (3 - 2 * t);
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = s(x - xi), v = s(y - yi);
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  return (x, y) => { let t = 0, amp = 1, f = 1, norm = 0; for (let o = 0; o < 5; o++) { t += n(x * f + o * 17.3, y * f - o * 9.1) * amp; norm += amp; amp *= 0.5; f *= 2; } return t / norm; };
}
function centroid(poly) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < poly.length - 1; i++) {
    const [x0, y0] = poly[i], [x1, y1] = poly[i + 1], f = x0 * y1 - x1 * y0;
    a += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f;
  }
  a *= 0.5;
  return Math.abs(a) < 1e-6 ? poly[0].slice() : [cx / (6 * a), cy / (6 * a)];
}
const SYL = ['ar','bel','cor','dra','el','fen','gal','hor','is','lun','mar','nor','ost','pra','ros','sel','tar','ul','ven','zar','mon','val','tor','ber','cas','li','ra','dor','sa','ve','an','tu','ka','me','ri','go','fa','ne'];
const END = ['ia','a','o','ena','ara','ond','ell','ia','an','ica','ura',''];
function makeName(r) {
  const k = r() < 0.6 ? 2 : 1;
  let s = '';
  for (let i = 0; i < k; i++) s += SYL[Math.floor(r() * SYL.length)];
  s += END[Math.floor(r() * END.length)];
  if (s.length < 4) s += 'ia';
  return s[0].toUpperCase() + s.slice(1);
}
const TITLES = ['Regno di','Impero di','Ducato di','Repubblica di','Granducato di','Principato di','Sultanato di','Confederazione di','Marca di','Lega di'];

// ---------- world generation (deterministic from seed) ----------
function genWorld(seed) {
  const r = mulberry32(seed);
  const noise = makeNoise(r);
  const cols = 42, rows = 27, cw = MW / cols, ch = MH / rows;
  let pts = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
    pts.push([(x + 0.12 + 0.76 * r()) * cw, (y + 0.12 + 0.76 * r()) * ch]);
  let del = d3.Delaunay.from(pts), vor = del.voronoi([0, 0, MW, MH]);
  for (let i = 0; i < pts.length; i++) pts[i] = centroid(vor.cellPolygon(i));
  del = d3.Delaunay.from(pts); vor = del.voronoi([0, 0, MW, MH]);

  const N = pts.length;
  const polys = [], val = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    polys.push(vor.cellPolygon(i));
    const [x, y] = pts[i];
    const nx = (x / MW - 0.5) * 2, ny = (y / MH - 0.5) * 2;
    val[i] = noise(x / 480, y / 480) - (nx * nx * 0.85 + ny * ny) * 0.32;
  }
  const sorted = Array.from(val).sort((a, b) => a - b);
  const thr = sorted[Math.floor(N * 0.56)];
  const land = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const edge = polys[i].some(([x, y]) => x < 1 || y < 1 || x > MW - 1 || y > MH - 1);
    land[i] = !edge && val[i] > thr ? 1 : 0;
  }
  const nbrs = [];
  for (let i = 0; i < N; i++) nbrs.push([...del.neighbors(i)]);

  // provinces
  const cellProv = new Int32Array(N).fill(-1);
  const provs = [];
  for (let i = 0; i < N; i++) if (land[i]) {
    cellProv[i] = provs.length;
    provs.push({ id: provs.length, cell: i, poly: polys[i], c: pts[i], elev: val[i] - thr, nb: [], name: makeName(r) });
  }
  for (const p of provs) p.nb = nbrs[p.cell].filter(j => land[j]).map(j => cellProv[j]);

  // connect separate landmasses with sea routes so every province is reachable
  const routes = [];
  const compOf = new Int32Array(provs.length).fill(-1);
  let nc = 0;
  for (const p of provs) if (compOf[p.id] < 0) {
    const q = [p.id]; compOf[p.id] = nc;
    while (q.length) { const a = q.pop(); for (const b of provs[a].nb) if (compOf[b] < 0) { compOf[b] = nc; q.push(b); } }
    nc++;
  }
  const merged = new Set([compOf[0]]);
  while (merged.size < nc) {
    let best = null, bd = Infinity;
    for (const a of provs) if (merged.has(compOf[a.id])) for (const b of provs) if (!merged.has(compOf[b.id])) {
      const d = (a.c[0] - b.c[0]) ** 2 + (a.c[1] - b.c[1]) ** 2;
      if (d < bd) { bd = d; best = [a.id, b.id]; }
    }
    routes.push(best);
    provs[best[0]].nb.push(best[1]); provs[best[1]].nb.push(best[0]);
    merged.add(compOf[best[1]]);
  }

  // shared edges between cells (for borders and coastlines)
  const edgeMap = new Map(), edges = [];
  const k = (p) => p[0].toFixed(2) + ',' + p[1].toFixed(2);
  for (let i = 0; i < N; i++) {
    const poly = polys[i];
    for (let j = 0; j < poly.length - 1; j++) {
      const a = poly[j], b = poly[j + 1], ka = k(a), kb = k(b);
      const key = ka < kb ? ka + '|' + kb : kb + '|' + ka;
      let e = edgeMap.get(key);
      if (!e) { e = { a, b, c: [] }; edgeMap.set(key, e); edges.push(e); }
      e.c.push(i);
    }
  }
  const provEdges = [], coast = [];
  for (const e of edges) {
    const pa = cellProv[e.c[0]], pb = e.c.length > 1 ? cellProv[e.c[1]] : -1;
    if (pa >= 0 && pb >= 0) provEdges.push({ a: e.a, b: e.b, p: pa, q: pb });
    else if (pa >= 0 || pb >= 0) coast.push(e);
  }

  // sea depth by distance to land
  const depth = new Int32Array(N).fill(99);
  let frontier = [];
  for (let i = 0; i < N; i++) if (land[i]) { depth[i] = 0; frontier.push(i); }
  for (let d = 1; d < 5; d++) {
    const next = [];
    for (const i of frontier) for (const j of nbrs[i]) if (depth[j] > d) { depth[j] = d; next.push(j); }
    frontier = next;
  }

  // nations: spread capitals with farthest-point sampling, grow round-robin
  const NN = Math.min(14, Math.max(6, Math.floor(provs.length / 22)));
  const caps = [Math.floor(r() * provs.length)];
  while (caps.length < NN) {
    let best = -1, bd = -1;
    for (const p of provs) {
      let m = Infinity;
      for (const c of caps) { const q = provs[c]; m = Math.min(m, (p.c[0] - q.c[0]) ** 2 + (p.c[1] - q.c[1]) ** 2); }
      m *= 0.6 + r() * 0.8;
      if (m > bd) { bd = m; best = p.id; }
    }
    caps.push(best);
  }
  const owner = new Int32Array(provs.length).fill(-1);
  const queues = caps.map((c, i) => { owner[c] = i; return [c]; });
  const speed = caps.map(() => 0.5 + r());
  let left = provs.length - NN, guard = 0;
  while (left > 0 && guard++ < 100000) {
    for (let n = 0; n < NN; n++) {
      if (r() > speed[n] / 1.5) continue;
      const q = queues[n];
      if (!q.length) continue;
      const idx = Math.floor(r() * q.length), a = q[idx];
      const free = provs[a].nb.filter(b => owner[b] < 0);
      if (!free.length) { q.splice(idx, 1); continue; }
      const b = free[Math.floor(r() * free.length)];
      owner[b] = n; q.push(b); left--;
    }
  }
  const hue0 = r() * 360;
  const nations = caps.map((c, i) => {
    const h = (hue0 + i * 137.508) % 360;
    const s = 34 + r() * 22, l = 50 + r() * 14;
    const place = makeName(r);
    return { id: i, place, title: TITLES[Math.floor(r() * TITLES.length)], color: `hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`, hue: h, capital: c };
  });
  const init = provs.map((p, i) => {
    const isCap = caps.includes(i);
    return { owner: owner[i], army: isCap ? 3000 : 400 + Math.floor(r() * 9) * 100, eco: isCap ? 3 : 1 + (r() < 0.3 ? 1 : 0), fort: isCap ? 1 : 0 };
  });
  return { seed, provs, nations, init, edges: provEdges, coast, polys, land, depth, routes, del, cellProv, N };
}

// ---------- game state ----------
let W = null;        // static world
let G = null;        // dynamic game state
let phase = 'pick';  // pick | play | over
let pickNation = -1;
let selected = -1;
let pendingConfirm = null;
let busy = false;

function newGame(seed) {
  W = genWorld(seed);
  G = {
    v: 1, seed, turn: 0, player: -1,
    p: W.init.map(o => ({ owner: o.owner, army: o.army, fresh: o.army, eco: o.eco, fort: o.fort, hit: 0 })),
    n: W.nations.map(n => ({ gold: 60, alive: true, capital: n.capital, wars: [], since: {} })),
    truce: {}, asked: [],
  };
  prepareRender();
}
function serialize() {
  return { v: 1, seed: G.seed, turn: G.turn, player: G.player, phase,
    p: G.p.map(x => [x.owner, x.army, x.fresh, x.eco, x.fort]),
    n: G.n.map(x => ({ gold: x.gold, alive: x.alive, capital: x.capital, wars: x.wars, since: x.since })),
    truce: G.truce };
}
function restore(s) {
  W = genWorld(s.seed);
  G = { v: 1, seed: s.seed, turn: s.turn, player: s.player, truce: s.truce || {}, asked: [],
    p: s.p.map(a => ({ owner: a[0], army: a[1], fresh: a[2], eco: a[3], fort: a[4], hit: 0 })),
    n: s.n.map(x => ({ gold: x.gold, alive: x.alive, capital: x.capital, wars: x.wars.slice(), since: x.since || {} })) };
  prepareRender();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) {} }
function loadSaved() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

const nat = i => W.nations[i];
const fullName = i => nat(i).title + ' ' + nat(i).place;
const provsOf = n => { const out = []; for (let i = 0; i < G.p.length; i++) if (G.p[i].owner === n) out.push(i); return out; };
const armyOf = n => { let s = 0; for (const p of G.p) if (p.owner === n) s += p.army; return s; };
const atWar = (a, b) => G.n[a].wars.includes(b);
const tkey = (a, b) => a < b ? a + '-' + b : b + '-' + a;
const truceLeft = (a, b) => G.truce[tkey(a, b)] || 0;
const provIncome = i => 2 + G.p[i].eco * 2 + (G.n[G.p[i].owner].capital === i ? 6 : 0);
function income(n) {
  let inc = 0, army = 0;
  for (let i = 0; i < G.p.length; i++) if (G.p[i].owner === n) { inc += provIncome(i); army += G.p[i].army; }
  return { inc, upkeep: Math.round(army / 1000 * 0.8), net: inc - Math.round(army / 1000 * 0.8) };
}
const defense = i => G.p[i].army * (1.1 + 0.15 * G.p[i].fort);
const ecoCost = i => 25 * G.p[i].eco;
const fortCost = i => 40 * (G.p[i].fort + 1);
function neighborNations(n) {
  const s = new Set();
  for (let i = 0; i < G.p.length; i++) if (G.p[i].owner === n) for (const j of W.provs[i].nb) if (G.p[j].owner !== n) s.add(G.p[j].owner);
  return [...s];
}
function dateStr(t) { return MONTHS[t % 12] + ' ' + (1440 + Math.floor(t / 12)); }

function declareWar(a, b) {
  if (atWar(a, b)) return;
  G.n[a].wars.push(b); G.n[b].wars.push(a);
  G.n[a].since[b] = G.turn; G.n[b].since[a] = G.turn;
  if (b === G.player) toast(`${fullName(a)} ti ha dichiarato guerra!`, 'bad');
  else if (a !== G.player && G.n[G.player] && neighborNations(G.player).includes(a)) toast(`${nat(a).place} ha dichiarato guerra a ${nat(b).place}.`);
}
function makePeace(a, b) {
  G.n[a].wars = G.n[a].wars.filter(x => x !== b);
  G.n[b].wars = G.n[b].wars.filter(x => x !== a);
  G.truce[tkey(a, b)] = 10;
}

function capture(i, newOwner, army) {
  const p = G.p[i], old = p.owner;
  p.owner = newOwner; p.army = army; p.fresh = 0;
  p.eco = Math.max(1, p.eco - 1); p.fort = Math.max(0, p.fort - 1);
  p.hit = G.turn + 1;
  if (old === G.player) toast(`Hai perso ${W.provs[i].name}.`, 'bad');
  if (G.n[old].capital === i) {
    const rest = provsOf(old);
    if (rest.length) {
      rest.sort((x, y) => G.p[y].eco - G.p[x].eco || G.p[y].army - G.p[x].army);
      G.n[old].capital = rest[0];
      if (old === G.player) toast(`La capitale è stata spostata a ${W.provs[rest[0]].name}.`, 'bad');
    }
  }
  if (!provsOf(old).length) {
    G.n[old].alive = false;
    for (const w of G.n[old].wars.slice()) makePeace(old, w);
    if (old !== G.player) toast(`${fullName(old)} è stato annesso da ${nat(newOwner).place}.`, newOwner === G.player ? 'good' : '');
  }
  bordersDirty = true;
}
function attack(from, to, amount) {
  const A = amount, D = G.p[to].army, me = G.p[from].owner;
  G.p[from].army -= A; G.p[from].fresh = Math.max(0, G.p[from].fresh - A);
  if (D <= 0) { capture(to, me, A); return { win: true, lossA: 0, lossD: 0 }; }
  const atk = A * (0.85 + Math.random() * 0.3), def = defense(to) * (0.85 + Math.random() * 0.3);
  if (atk > def) {
    const surv = Math.max(1, Math.round(A * (1 - 0.6 * def / atk) / 10) * 10);
    capture(to, me, surv);
    return { win: true, lossA: A - surv, lossD: D };
  }
  const survD = Math.max(0, Math.round(D * (1 - 0.6 * atk / def) / 10) * 10);
  G.p[to].army = survD; G.p[to].fresh = Math.min(G.p[to].fresh, survD);
  const back = Math.round(A * 0.25 * atk / def / 10) * 10;
  G.p[from].army += back;
  return { win: false, lossA: A - back, lossD: D - survD };
}

// ---------- AI ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function aiTurn(n) {
  const me = G.n[n];
  const myArmy = armyOf(n);
  const nb = neighborNations(n);

  // diplomacy
  if (me.wars.length === 0 && Math.random() < 0.07) {
    const cands = nb.filter(m => G.n[m].alive && !truceLeft(n, m) && armyOf(m) < myArmy * 0.75);
    if (cands.length) { cands.sort((a, b) => armyOf(a) - armyOf(b)); declareWar(n, cands[0]); }
  }
  for (const m of me.wars.slice()) {
    const long = G.turn - (me.since[m] || 0) > 18;
    const losing = myArmy < armyOf(m) * 0.55;
    if (m === G.player) {
      if ((losing && Math.random() < 0.2) || (long && Math.random() < 0.06)) offers.push(n);
    } else if ((losing && Math.random() < 0.25) || (long && Math.random() < 0.1)) makePeace(n, m);
  }

  const mine = provsOf(n);
  const enemyNb = i => W.provs[i].nb.filter(j => atWar(n, G.p[j].owner));

  // attacks
  for (const i of shuffle(mine.slice())) {
    if (G.p[i].owner !== n || G.p[i].fresh <= 0) continue;
    const targets = enemyNb(i).sort((a, b) => defense(a) - defense(b));
    if (!targets.length) continue;
    const t = targets[0];
    const send = Math.round(G.p[i].fresh * 0.85 / 10) * 10;
    if (send > defense(t) * 1.25 + 200) attack(i, t, send);
  }

  // move reserves toward the front (or the border when at peace)
  const owned = provsOf(n);
  const dist = new Map();
  let q = [];
  for (const i of owned) {
    const front = me.wars.length ? enemyNb(i).length > 0 : W.provs[i].nb.some(j => G.p[j].owner !== n);
    if (front) { dist.set(i, 0); q.push(i); }
  }
  while (q.length) {
    const nq = [];
    for (const a of q) for (const b of W.provs[a].nb) if (G.p[b].owner === n && !dist.has(b)) { dist.set(b, dist.get(a) + 1); nq.push(b); }
    q = nq;
  }
  for (const i of owned) {
    const d = dist.get(i);
    if (!d || G.p[i].fresh <= 300) continue;
    const step = W.provs[i].nb.find(j => G.p[j].owner === n && dist.get(j) === d - 1);
    if (step === undefined) continue;
    const mv = me.wars.length ? G.p[i].fresh - 200 : Math.round((G.p[i].fresh - 300) * 0.5 / 10) * 10;
    if (mv <= 0) continue;
    G.p[i].army -= mv; G.p[i].fresh -= mv; G.p[step].army += mv;
  }

  // recruit
  const fronts = owned.filter(i => dist.get(i) === 0);
  const want = me.wars.length ? Infinity : owned.length * 1600;
  let guard = 0;
  while (me.gold >= RECRUIT_COST + 15 && armyOf(n) < want && guard++ < 20) {
    let target = me.capital;
    if (fronts.length) {
      let worst = -Infinity;
      for (const i of fronts) {
        let threat = 0;
        for (const j of W.provs[i].nb) if (G.p[j].owner !== n) threat += G.p[j].army * (atWar(n, G.p[j].owner) ? 1 : 0.3);
        const s = threat - G.p[i].army;
        if (s > worst) { worst = s; target = i; }
      }
    }
    me.gold -= RECRUIT_COST; G.p[target].army += RECRUIT;
  }
  // build at peace
  if (!me.wars.length && me.gold > 50) {
    const cheap = owned.filter(i => G.p[i].eco < 5).sort((a, b) => G.p[a].eco - G.p[b].eco)[0];
    if (cheap !== undefined && me.gold >= ecoCost(cheap)) { me.gold -= ecoCost(cheap); G.p[cheap].eco++; }
  }
}
let offers = [];

// ---------- turn ----------
function endTurn() {
  if (busy || phase !== 'play') return;
  busy = true;
  pendingConfirm = null;
  offers = [];
  const order = shuffle(G.n.map((_, i) => i).filter(i => G.n[i].alive && i !== G.player));
  for (const n of order) if (G.n[n].alive) aiTurn(n);
  for (let n = 0; n < G.n.length; n++) {
    if (!G.n[n].alive) continue;
    G.n[n].gold += income(n).net;
    if (G.n[n].gold < 0) {
      for (const i of provsOf(n)) G.p[i].army = Math.round(G.p[i].army * 0.9 / 10) * 10;
      G.n[n].gold = 0;
      if (n === G.player) toast('Casse vuote: i soldati non pagati disertano.', 'bad');
    }
  }
  for (const k in G.truce) { G.truce[k]--; if (G.truce[k] <= 0) delete G.truce[k]; }
  for (const p of G.p) p.fresh = p.army;
  G.asked = [];
  G.turn++;
  busy = false;
  if (selected >= 0 && G.p[selected].owner !== G.player) selected = -1;
  checkEnd();
  save();
  updateUI(); requestRender();
  if (phase === 'play' && offers.length) showOffer(offers.shift());
}
function checkEnd() {
  if (!G.n[G.player].alive) { phase = 'over'; clearSaved(); showEnd(false); return; }
  if (G.n.filter(n => n.alive).length === 1) { phase = 'over'; clearSaved(); showEnd(true); }
}

// ---------- player actions ----------
function recruit(i) {
  const me = G.n[G.player];
  if (me.gold < RECRUIT_COST) return toast('Oro insufficiente.', 'bad');
  me.gold -= RECRUIT_COST; G.p[i].army += RECRUIT;
  afterAction();
}
function upgradeEco(i) {
  const me = G.n[G.player], c = ecoCost(i);
  if (G.p[i].eco >= 5 || me.gold < c) return;
  me.gold -= c; G.p[i].eco++;
  afterAction();
}
function fortify(i) {
  const me = G.n[G.player], c = fortCost(i);
  if (G.p[i].fort >= 3 || me.gold < c) return;
  me.gold -= c; G.p[i].fort++;
  afterAction();
}
function afterAction() { save(); updateUI(); requestRender(); }
function moveAmount() {
  const el = document.getElementById('moveAmt');
  return el ? +el.value : 0;
}
function tryMove(from, to) {
  const P = G.p, me = G.player;
  const amt = Math.min(moveAmount(), P[from].fresh);
  if (amt <= 0) { toast('Nessuna truppa disponibile per muoversi in questo turno.'); return; }
  if (P[to].owner === me) {
    P[from].army -= amt; P[from].fresh -= amt; P[to].army += amt;
    toast(`${fmt(amt)} soldati spostati a ${W.provs[to].name}.`);
  } else if (atWar(me, P[to].owner)) {
    const res = attack(from, to, amt);
    if (res.win) toast(`Vittoria! ${W.provs[to].name} è tua. Perdite: ${fmt(res.lossA)}.`, 'good');
    else toast(`Attacco respinto a ${W.provs[to].name}. Perdite: ${fmt(res.lossA)}, nemico: ${fmt(res.lossD)}.`, 'bad');
    checkEnd();
  } else {
    toast(`Sei in pace con ${nat(P[to].owner).place}: dichiara guerra per attaccare.`);
    return;
  }
  afterAction();
}
function playerDeclare(n) {
  if (truceLeft(G.player, n)) return toast(`Tregua in corso con ${nat(n).place}.`);
  declareWar(G.player, n);
  toast(`Hai dichiarato guerra a ${fullName(n)}.`, 'bad');
  pendingConfirm = null;
  afterAction();
}
function playerPeace(n) {
  if (G.asked.includes(n)) return;
  G.asked.push(n);
  const mine = armyOf(G.player), theirs = armyOf(n);
  const ok = theirs < mine * 0.8 || Math.random() < 0.18;
  if (ok) { makePeace(G.player, n); toast(`${nat(n).place} accetta la pace. Tregua di 10 mesi.`, 'good'); }
  else toast(`${nat(n).place} rifiuta la pace.`, 'bad');
  afterAction();
}

// ---------- rendering ----------
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
let dpr = 1, vw = 0, vh = 0;
const cam = { x: 0, y: 0, s: 1 };
let seaLayer = null, reliefLayer = null, provPaths = [];
let bordersDirty = true, borderCache = null, labelCache = null;

function prepareRender() {
  provPaths = W.provs.map(p => {
    const path = new Path2D();
    p.poly.forEach(([x, y], i) => i ? path.lineTo(x, y) : path.moveTo(x, y));
    path.closePath();
    return path;
  });
  const SC = 1;
  seaLayer = document.createElement('canvas');
  seaLayer.width = MW * SC; seaLayer.height = MH * SC;
  const s = seaLayer.getContext('2d');
  s.scale(SC, SC);
  const shades = ['#2c4c6c', '#24425f', '#1d3752', '#172d45', '#13253a'];
  s.fillStyle = shades[4]; s.fillRect(0, 0, MW, MH);
  for (let i = 0; i < W.N; i++) {
    if (W.land[i]) continue;
    const d = Math.min(W.depth[i], 5);
    s.fillStyle = s.strokeStyle = shades[d - 1];
    s.beginPath(); W.polys[i].forEach(([x, y], k) => k ? s.lineTo(x, y) : s.moveTo(x, y));
    s.fill(); s.lineWidth = 1; s.stroke();
  }
  // soft blur for the sea gradient
  const tmp = document.createElement('canvas'); tmp.width = seaLayer.width; tmp.height = seaLayer.height;
  const t = tmp.getContext('2d'); t.filter = 'blur(14px)'; t.drawImage(seaLayer, 0, 0);
  seaLayer = tmp;

  reliefLayer = document.createElement('canvas');
  reliefLayer.width = MW; reliefLayer.height = MH;
  const rl = reliefLayer.getContext('2d');
  const maxE = Math.max(...W.provs.map(p => p.elev));
  W.provs.forEach((p, i) => {
    const e = p.elev / maxE;
    rl.fillStyle = `rgba(30, 22, 10, ${(0.05 + e * 0.32).toFixed(3)})`;
    rl.fill(provPaths[i]);
  });
  bordersDirty = true;
  fitCamera();
}

function buildBorders() {
  const thin = new Path2D(), thick = new Path2D(), coast = new Path2D();
  for (const e of W.edges) {
    const t = G.p[e.p].owner === G.p[e.q].owner ? thin : thick;
    t.moveTo(e.a[0], e.a[1]); t.lineTo(e.b[0], e.b[1]);
  }
  for (const e of W.coast) { coast.moveTo(e.a[0], e.a[1]); coast.lineTo(e.b[0], e.b[1]); }
  borderCache = { thin, thick, coast };

  // nation labels along the principal axis of their territory
  labelCache = [];
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let n = 0; n < G.n.length; n++) {
    if (!G.n[n].alive) continue;
    const ps = provsOf(n);
    let mx = 0, my = 0;
    for (const i of ps) { mx += W.provs[i].c[0]; my += W.provs[i].c[1]; }
    mx /= ps.length; my /= ps.length;
    let sxx = 0, syy = 0, sxy = 0;
    for (const i of ps) { const dx = W.provs[i].c[0] - mx, dy = W.provs[i].c[1] - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    let ang = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    if (ps.length < 3) ang = 0;
    ang = Math.max(-0.6, Math.min(0.6, ang));
    const ux = Math.cos(ang), uy = Math.sin(ang);
    let lo = Infinity, hi = -Infinity;
    for (const i of ps) { const pr = (W.provs[i].c[0] - mx) * ux + (W.provs[i].c[1] - my) * uy; lo = Math.min(lo, pr); hi = Math.max(hi, pr); }
    const ext = hi - lo + 46;
    const text = nat(n).place.toUpperCase().split('').join(' ');
    ctx.font = '100px ' + getComputedStyle(document.body).getPropertyValue('--display');
    const w100 = ctx.measureText(text).width;
    let size = Math.min(ext * 0.82 / w100 * 100, 14 + Math.sqrt(ps.length) * 9);
    size = Math.max(11, size);
    const cxp = mx + ux * (lo + hi) / 2, cyp = my + uy * (lo + hi) / 2;
    labelCache.push({ n, text, x: cxp, y: cyp, ang, size });
  }
  ctx.restore();
  bordersDirty = false;
}

let renderQueued = false;
function requestRender() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(render); } }
function render() {
  renderQueued = false;
  if (!W) return;
  if (bordersDirty) buildBorders();
  const s = cam.s;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0c1828'; ctx.fillRect(0, 0, vw, vh);
  ctx.save();
  ctx.translate(cam.x, cam.y); ctx.scale(s, s);
  ctx.drawImage(seaLayer, 0, 0, MW, MH);

  const pickMode = phase === 'pick';
  for (let i = 0; i < W.provs.length; i++) {
    const o = G.p[i].owner;
    ctx.fillStyle = W.nations[o].color;
    ctx.fill(provPaths[i]);
  }
  ctx.lineJoin = 'round';
  ctx.lineWidth = 1; // hide hairline seams between same-coloured cells
  for (let i = 0; i < W.provs.length; i++) { ctx.strokeStyle = W.nations[G.p[i].owner].color; ctx.stroke(provPaths[i]); }
  ctx.drawImage(reliefLayer, 0, 0);

  // highlight the picked nation / selection
  if (pickMode && pickNation >= 0) {
    ctx.fillStyle = 'rgba(255, 248, 225, 0.28)';
    for (let i = 0; i < W.provs.length; i++) if (G.p[i].owner === pickNation) ctx.fill(provPaths[i]);
  }
  for (let i = 0; i < W.provs.length; i++) if (G.p[i].hit === G.turn && phase === 'play') {
    ctx.fillStyle = 'rgba(208, 86, 62, 0.35)'; ctx.fill(provPaths[i]);
  }
  let targets = [];
  if (phase === 'play' && selected >= 0) {
    ctx.fillStyle = 'rgba(255, 248, 225, 0.33)'; ctx.fill(provPaths[selected]);
    if (G.p[selected].owner === G.player && G.p[selected].fresh > 0) targets = W.provs[selected].nb;
  }

  const px = 1 / s;
  ctx.strokeStyle = 'rgba(25, 20, 12, 0.28)'; ctx.lineWidth = 0.7 * px; ctx.stroke(borderCache.thin);
  ctx.strokeStyle = 'rgba(18, 16, 14, 0.85)'; ctx.lineWidth = 1.8 * px; ctx.stroke(borderCache.thick);
  ctx.strokeStyle = 'rgba(8, 14, 24, 0.95)'; ctx.lineWidth = 1.6 * px; ctx.stroke(borderCache.coast);

  // sea routes
  ctx.setLineDash([5 * px, 5 * px]); ctx.strokeStyle = 'rgba(236, 230, 214, 0.45)'; ctx.lineWidth = 1.2 * px;
  for (const [a, b] of W.routes) { ctx.beginPath(); ctx.moveTo(...W.provs[a].c); ctx.lineTo(...W.provs[b].c); ctx.stroke(); }
  ctx.setLineDash([]);

  for (const t of targets) {
    const enemy = G.p[t].owner !== G.player;
    if (enemy && !atWar(G.player, G.p[t].owner)) continue;
    ctx.strokeStyle = enemy ? '#ff7a5c' : '#f4e6b0';
    ctx.lineWidth = 2.6 * px;
    ctx.stroke(provPaths[t]);
  }
  if (selected >= 0) { ctx.strokeStyle = '#fff6da'; ctx.lineWidth = 2.6 * px; ctx.stroke(provPaths[selected]); }

  // nation names
  const disp = getComputedStyle(document.body).getPropertyValue('--display');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const L of labelCache) {
    if (L.size * s < 7) continue;
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.ang);
    ctx.font = L.size.toFixed(1) + 'px ' + disp;
    ctx.fillStyle = 'rgba(22, 18, 12, 0.62)';
    ctx.fillText(L.text, 0, 0);
    ctx.restore();
  }
  ctx.restore();

  // screen-space overlays: capitals, armies, arrows
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const showAll = s > 0.75;
  for (let i = 0; i < W.provs.length; i++) {
    const P = G.p[i], [mx, my] = W.provs[i].c;
    const x = mx * s + cam.x, y = my * s + cam.y;
    if (x < -40 || y < -40 || x > vw + 40 || y > vh + 40) continue;
    const isCap = G.n[P.owner].capital === i;
    if (isCap) star(x, y - (showAll || P.owner === G.player ? 13 : 0), 6.5);
    const mine = phase === 'play' && P.owner === G.player;
    if (P.army > 0 && (showAll || mine || i === selected || targets.includes(i))) {
      const label = fmt(P.army);
      ctx.font = '700 11px ' + getComputedStyle(document.body).getPropertyValue('--body');
      const w = ctx.measureText(label).width + 10;
      ctx.fillStyle = mine ? 'rgba(16, 24, 37, 0.9)' : 'rgba(40, 30, 22, 0.78)';
      roundRect(x - w / 2, y - 8, w, 16, 5); ctx.fill();
      if (mine && P.fresh > 0) { ctx.fillStyle = '#d8b25a'; ctx.beginPath(); ctx.arc(x + w / 2 - 1, y - 7, 3, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#f2ecdc'; ctx.fillText(label, x, y + 0.5);
    }
  }
}
function star(x, y, r) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = '#f1d27a'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fmt(n) { return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n); }

// ---------- camera + input ----------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  clampCam(); requestRender();
}
function fitCamera() {
  vw = window.innerWidth; vh = window.innerHeight;
  cam.s = Math.min(vw / MW, vh / MH) * 1.05;
  if (vw < 600) cam.s = Math.min(vw / MW * 2.1, vh / MH * 1.1);
  cam.x = (vw - MW * cam.s) / 2; cam.y = (vh - MH * cam.s) / 2;
  clampCam();
}
function minScale() { return Math.min(vw / MW, vh / MH) * 0.9; }
function clampCam() {
  cam.s = Math.max(minScale(), Math.min(5, cam.s));
  const mw = MW * cam.s, mh = MH * cam.s, m = 80;
  cam.x = mw < vw ? (vw - mw) / 2 : Math.min(m, Math.max(vw - mw - m, cam.x));
  cam.y = mh < vh ? (vh - mh) / 2 : Math.min(m + 50, Math.max(vh - mh - m - 120, cam.y));
}
function zoomAt(sx, sy, ns) {
  const mx = (sx - cam.x) / cam.s, my = (sy - cam.y) / cam.s;
  cam.s = Math.max(minScale(), Math.min(5, ns));
  cam.x = sx - mx * cam.s; cam.y = sy - my * cam.s;
  clampCam(); requestRender();
}
const pointers = new Map();
let gesture = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: cam.s, mx: (mid.x - cam.x) / cam.s, my: (mid.y - cam.y) / cam.s, moved: true };
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  if (gesture.type === 'pan') {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) gesture.moved = true;
    if (gesture.moved) { cam.x = gesture.cx + dx; cam.y = gesture.cy + dy; clampCam(); requestRender(); }
  } else if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    cam.s = Math.max(minScale(), Math.min(5, gesture.s0 * d / gesture.d0));
    cam.x = mid.x - gesture.mx * cam.s; cam.y = mid.y - gesture.my * cam.s;
    clampCam(); requestRender();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.type === 'pan' && !gesture.moved && pointers.size === 0 && e.type === 'pointerup') tap(e.clientX, e.clientY);
  if (pointers.size === 1) { const [p] = [...pointers.values()]; gesture = { type: 'pan', sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: true }; }
  else if (pointers.size === 0) gesture = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
window.addEventListener('resize', resize);

function provAt(sx, sy) {
  const mx = (sx - cam.x) / cam.s, my = (sy - cam.y) / cam.s;
  if (mx < 0 || my < 0 || mx > MW || my > MH) return -1;
  return W.cellProv[W.del.find(mx, my)];
}
function tap(sx, sy) {
  if (!W || busy) return;
  const i = provAt(sx, sy);
  if (phase === 'pick') {
    pickNation = i >= 0 ? G.p[i].owner : -1;
    updateIntro(); requestRender();
    return;
  }
  if (phase !== 'play') return;
  if (i < 0) { selected = -1; pendingConfirm = null; updateUI(); requestRender(); return; }
  if (selected >= 0 && selected !== i && G.p[selected].owner === G.player && G.p[selected].fresh > 0 && W.provs[selected].nb.includes(i)) {
    const o = G.p[i].owner;
    if (o === G.player || atWar(G.player, o)) { tryMove(selected, i); return; }
  }
  selected = i; pendingConfirm = null;
  updateUI(); requestRender();
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('toasts');
  box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  setTimeout(() => el.remove(), 3800);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function updateIntro() {
  const box = $('pickInfo');
  if (pickNation < 0) { box.innerHTML = '<span class="sub">Tocca un paese sulla mappa per sceglierlo.</span>'; $('startBtn').disabled = true; $('startBtn').textContent = 'Gioca'; return; }
  const ps = provsOf(pickNation);
  box.innerHTML = `<span class="chip" style="width:16px;height:16px;border-radius:3px;background:${nat(pickNation).color}"></span>
    <div><b>${esc(fullName(pickNation))}</b><div class="sub">${ps.length} province · ${fmt(armyOf(pickNation))} soldati · rendita +${income(pickNation).net}/mese</div></div>`;
  $('startBtn').disabled = false;
  $('startBtn').textContent = 'Gioca con ' + nat(pickNation).place;
}

function updateUI() {
  if (phase === 'pick') return;
  const me = G.player, inc = income(me);
  $('topFlag').style.background = nat(me).color;
  $('topName').firstChild.textContent = nat(me).place;
  $('topDate').textContent = dateStr(G.turn) + ' · ' + provsOf(me).length + ' province';
  $('topGold').textContent = `${G.n[me].gold} (${inc.net >= 0 ? '+' : ''}${inc.net})`;
  $('topArmy').textContent = fmt(armyOf(me));
  renderPanel();
}

function renderPanel() {
  const panel = $('panel');
  if (phase !== 'play' || selected < 0) { panel.hidden = true; return; }
  const i = selected, P = G.p[i], o = P.owner, me = G.player, gold = G.n[me].gold;
  const isCap = G.n[o].capital === i;
  let html = `<div class="head"><span class="chip" style="background:${nat(o).color}"></span>
    <div style="min-width:0;flex:1"><h2>${esc(W.provs[i].name)}${isCap ? ' ★' : ''}</h2><div class="sub">${esc(fullName(o))}</div></div>
    <button class="icon-btn close" id="closePanel" aria-label="Chiudi">✕</button></div>
    <div class="grid4">
      <div class="cell"><span>Truppe</span><b>${fmt(P.army)}</b></div>
      <div class="cell"><span>Economia</span><b>${P.eco}/5</b></div>
      <div class="cell"><span>Fortezza</span><b>${P.fort}/3</b></div>
      <div class="cell"><span>Rendita</span><b>+${provIncome(i)}</b></div>
    </div>`;
  if (o === me) {
    html += `<div class="actions">
      <button class="act" id="aRec" ${gold < RECRUIT_COST ? 'disabled' : ''}>Arruola 1k<small>${RECRUIT_COST} oro</small></button>
      <button class="act" id="aEco" ${P.eco >= 5 || gold < ecoCost(i) ? 'disabled' : ''}>Economia<small>${P.eco >= 5 ? 'max' : ecoCost(i) + ' oro'}</small></button>
      <button class="act" id="aFort" ${P.fort >= 3 || gold < fortCost(i) ? 'disabled' : ''}>Fortifica<small>${P.fort >= 3 ? 'max' : fortCost(i) + ' oro'}</small></button>
    </div>`;
    if (P.fresh > 0) {
      const step = P.fresh >= 1000 ? 100 : 10;
      html += `<div class="move"><label for="moveAmt">Truppe da muovere <b id="moveVal">${fmt(P.fresh)}</b></label>
        <input type="range" id="moveAmt" min="${step}" max="${P.fresh}" step="${step}" value="${P.fresh}">
        <p class="hint">Tocca una provincia evidenziata: bordo chiaro per spostarti, rosso per attaccare.</p></div>`;
    } else html += `<p class="hint">Queste truppe hanno già marciato. Potranno muoversi il prossimo mese.</p>`;
  } else {
    const ps = provsOf(o).length;
    const war = atWar(me, o), tr = truceLeft(me, o);
    const tag = war ? '<span class="tag war">In guerra</span>' : tr ? `<span class="tag truce">Tregua · ${tr} mesi</span>` : '<span class="tag peace">In pace</span>';
    html += `<div class="sub">${tag}&nbsp; ${ps} province · esercito ${fmt(armyOf(o))} · tu ${fmt(armyOf(me))}</div>`;
    if (war) html += `<div class="actions"><button class="act peace wide" id="aPeace" ${G.asked.includes(o) ? 'disabled' : ''}>${G.asked.includes(o) ? 'Hanno già risposto questo mese' : 'Proponi la pace'}</button></div>`;
    else if (!tr) {
      const confirm = pendingConfirm === o;
      html += `<div class="actions"><button class="act war wide" id="aWar">${confirm ? 'Conferma: guerra a ' + esc(nat(o).place) : 'Dichiara guerra'}</button></div>`;
    }
  }
  panel.innerHTML = html;
  panel.hidden = false;
  $('closePanel').onclick = () => { selected = -1; pendingConfirm = null; updateUI(); requestRender(); };
  if (o === me) {
    $('aRec').onclick = () => recruit(i);
    $('aEco').onclick = () => upgradeEco(i);
    $('aFort').onclick = () => fortify(i);
    const r = $('moveAmt');
    if (r) r.oninput = () => { $('moveVal').textContent = fmt(+r.value); };
  } else {
    if ($('aPeace')) $('aPeace').onclick = () => playerPeace(o);
    if ($('aWar')) $('aWar').onclick = () => { if (pendingConfirm === o) playerDeclare(o); else { pendingConfirm = o; renderPanel(); } };
  }
}

function showModal(html, wire) { $('modalBox').innerHTML = html; $('modal').hidden = false; wire && wire(); }
function hideModal() { $('modal').hidden = true; }
function showOffer(n) {
  showModal(`<h1 style="font-size:26px">Proposta di pace</h1><p>${esc(fullName(n))} chiede di firmare la pace. Seguirebbero 10 mesi di tregua.</p>
    <div class="row"><button class="btn primary" id="okP">Accetta</button><button class="btn" id="noP">Rifiuta</button></div>`, () => {
    $('okP').onclick = () => { makePeace(G.player, n); hideModal(); toast(`Pace con ${nat(n).place}.`, 'good'); afterAction(); next(); };
    $('noP').onclick = () => { hideModal(); next(); };
  });
  function next() { if (offers.length) showOffer(offers.shift()); }
}
function showEnd(win) {
  $('endTurn').hidden = true;
  showModal(`<h1 style="font-size:30px">${win ? 'Vittoria' : 'Sconfitta'}</h1>
    <p>${win ? `Nel ${dateStr(G.turn)} ${esc(fullName(G.player))} domina l'intero continente.` : `Nel ${dateStr(G.turn)} l'ultima provincia di ${esc(nat(G.player).place)} è caduta.`}</p>
    <div class="row"><button class="btn primary" id="again">Nuova partita</button></div>`, () => { $('again').onclick = () => { hideModal(); toIntro(); }; });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>
      <li>Ogni turno è un mese. A fine turno incassi la rendita delle province meno il soldo delle truppe.</li>
      <li>Tocca una tua provincia per arruolare, migliorare l'economia o fortificarla.</li>
      <li>Con una tua provincia selezionata, tocca una provincia confinante per spostare le truppe o attaccare. Ogni truppa marcia una volta al mese.</li>
      <li>Per attaccare un paese devi prima dichiarargli guerra: tocca una sua provincia.</li>
      <li>Le linee tratteggiate sono rotte marittime tra le isole.</li>
      <li>Vinci quando sei l'ultima nazione rimasta.</li>
    </ul>
    <div class="row"><button class="btn primary" id="mClose">Riprendi</button><button class="btn" id="mNew">Nuova partita</button></div>`, () => {
    $('mClose').onclick = hideModal;
    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); hideModal(); toIntro(); }
      else { $('mNew').dataset.c = '1'; $('mNew').textContent = 'Conferma: perdi la partita attuale'; }
    };
  });
}

function toIntro(seed) {
  phase = 'pick'; pickNation = -1; selected = -1;
  newGame(seed ?? Math.floor(Math.random() * 1e9));
  $('top').hidden = true; $('endTurn').hidden = true; $('panel').hidden = true;
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play';
  $('intro').hidden = true; $('top').hidden = false; $('endTurn').hidden = false;
  updateUI(); resize();
}
$('startBtn').onclick = () => {
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  cam.s = Math.max(cam.s, Math.min(1.1, window.innerWidth / 700));
  cam.x = window.innerWidth / 2 - c[0] * cam.s; cam.y = window.innerHeight * 0.38 - c[1] * cam.s;
  startPlay(); save();
  toast(`Governi ${fullName(pickNation)}. Buona fortuna.`, 'good');
};
$('rerollBtn').onclick = () => toIntro();
$('continueBtn').onclick = () => { const s = loadSaved(); if (!s) return; restore(s); selected = -1; startPlay(); };
$('endTurn').onclick = endTurn;
$('menuBtn').onclick = showMenu;

function boot(data) {
  if (data && data.seed !== undefined && data.player >= 0) { restore(data); startPlay(); }
  else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bordersDirty = true; requestRender(); });
}
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
