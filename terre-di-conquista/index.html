<style>
/* Layout: edge-to-edge map, floating frosted HUD cards (identity left, resources right), a floating sheet for the selection and a pill CTA for the turn. Single dark "command center" look. */
:root {

  --radius: 18px;

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;

}
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; background: var(--bg); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
svg.i { width: 16px; height: 16px; flex: none; }

#top {
  position: fixed; z-index: 5; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 10px);

}
#top > * { pointer-events: auto; }
.who-card { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; min-width: 104px; flex: 0 1 auto; }

button { font-family: var(--body); }

  bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
  margin: 0 auto; max-width: 520px;
  padding: 10px 12px; border-radius: 20px;

}
#panel .head { gap: 10px; }

.ic { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; flex: none; }
.frow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.pb.main { background: linear-gradient(135deg, #6f9bff, #4a6cf0); border: 0; color: #fff; }

.pb.nuke { border-color: rgba(212,242,90,.5); color: #e9f9b8; background: rgba(212,242,90,.1); }

.sect { font: 800 10.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
#panel .actions { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
#panel.slim { padding: 8px 10px; gap: 4px; max-height: none; }
.slimrow { display: flex; align-items: center; gap: 10px; }
.slimrow input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slimrow b { font-weight: 800; white-space: nowrap; }
.mi { color: #8fbcff; display: inline-flex; font-size: 16px; }
.mi .ic { width: 18px; height: 18px; }
.slimhint { font-size: 12px; color: var(--muted); font-weight: 600; }
#panel .head { display: flex; align-items: center; gap: 12px; }
#panel .chip { width: 12px; height: 34px; border-radius: 6px; flex: none; }
#panel h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; min-width: 0; text-wrap: balance; letter-spacing: -0.01em; }
#panel .sub, .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
.cap-badge { display: inline-block; vertical-align: 3px; margin-left: 6px; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: rgba(245,196,81,.12); padding: 3px 7px; border-radius: 999px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { display: grid; gap: 3px; padding: 7px 9px; border-radius: 12px; background: rgba(255,255,255,0.04); }

  border-radius: 14px; padding: 8px 6px; font-size: 13px; font-weight: 700; cursor: pointer;

}

  padding: 22px 20px 20px; border-radius: 26px;

}
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

.pick { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,0.05); }

.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.stats span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.stats em { font-style: normal; color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 800; cursor: pointer;
  background: rgba(255,255,255,0.07); color: var(--ink); border: 1px solid var(--line);
}
.btn.primary { flex: 1; background: linear-gradient(135deg, #6f9bff, #4a6cf0); color: #fff; border: 0; box-shadow: 0 8px 22px rgba(74, 108, 240, 0.4); }
.btn:disabled { opacity: .4; box-shadow: none; }
#modal { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(4, 7, 14, 0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

#clock {
  position: fixed; z-index: 6; display: flex; gap: 2px; padding: 4px; border-radius: 999px;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
}
#clock button { min-width: 44px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 800; font-size: 14px; cursor: pointer; display: grid; place-items: center; }

#banner {
  position: fixed; z-index: 7; left: 50%; transform: translateX(-50%);

.feed { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
.fi { text-align: left; display: grid; gap: 2px; padding: 9px 12px; border-radius: 12px; border: 0; border-left: 3px solid var(--accent); background: rgba(255,255,255,.05); color: var(--ink); font: 600 13.5px/1.35 var(--body); cursor: pointer; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kpi { display: grid; gap: 2px; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,.05); min-width: 0; }
.kpi span { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.kpi small { font-size: 12px; color: var(--muted); font-weight: 600; }

.pos { color: var(--peace) !important; } .neg { color: var(--war) !important; }

.vsgrid > span:nth-child(-n+3) { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  DE: [10, 5], IT: [9, 9], TR: [12, 8], IL: [10, 3], PK: [9, 4], EG: [8, 5], SA: [9, 4], IR: [6, 5], BR: [6, 6], AU: [6, 6],
  ES: [6, 6], CA: [5, 6], UA: [4, 2], GR: [5, 6], ID: [4, 8], TW: [8, 6], KP: [6, 4], VN: [4, 4], PL: [6, 2], DZ: [5, 4] };
const AI_EVERY = 7;           // days between decisions of each AI nation

};
// natural resources: oil producers and steel makers (per province, per month)
const OIL = { SA: 3, RU: 1.5, US: 1, IR: 2, IQ: 3, AE: 3, KW: 4, VE: 2, NG: 1.5, CA: 1, NO: 2, KZ: 1, QA: 4, LY: 2, DZ: 1.2, AO: 1.5, BR: 0.5, MX: 0.8, CN: 0.3, AZ: 2, OM: 2, GB: 0.4, EG: 0.4, ID: 0.4, MY: 0.6, CO: 0.5, EC: 0.8, TM: 1.5, GA: 1, CG: 1, BN: 3, SS: 1 };
const STEEL = { CN: 2, IN: 1.2, JP: 2, US: 0.8, RU: 0.8, KR: 3, DE: 1.5, TR: 1.2, BR: 0.8, IR: 0.8, IT: 1, TW: 2, UA: 1, VN: 0.8, FR: 0.8, ES: 0.8, MX: 0.6, CA: 0.4, PL: 0.8, AU: 0.5, SE: 0.8, AT: 1, CZ: 1, BE: 1.5, NL: 1, ZA: 0.6 };

const BASE_PRICE = { oil: 4, steel: 3, food: 2 };
const STEEL_USE = { tnk: 5, fgt: 4, bmb: 5, ship: 8, sub: 10, car: 30, mis: 2 };
const TAX = [{ name: 'Basse', mult: 0.8, stab: 12 }, { name: 'Normali', mult: 1, stab: 0 }, { name: 'Alte', mult: 1.25, stab: -14 }];
const START_SUB = { US: 8, RU: 6, CN: 6, GB: 3, FR: 3, IN: 2, JP: 3, KR: 2, KP: 3, IR: 1, TR: 2, DE: 1, IT: 2, IL: 1, PK: 1, AU: 1, ES: 1, BR: 1 };

const START_TECH = {

  CN: ['subs', 'carrier', 'abm', 'aa2', 'tank2'], GB: ['subs', 'carrier', 'aa2', 'lrm'], FR: ['subs', 'carrier', 'aa2', 'lrm'],

// ---------- world (static) ----------
function decodeRing(d) {
  const a = new Float32Array(d.length);
  let x = 0, y = 0;
  for (let i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; a[i] = x / 2; a[i + 1] = y / 2; }
  return a;
}
function ringPath(path, r) { path.moveTo(r[0], r[1]); for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]); path.closePath(); }
const ecoFromPop = pop => pop >= 5e6 ? 5 : pop >= 1.5e6 ? 4 : pop >= 5e5 ? 3 : pop >= 1.5e5 ? 2 : 1;

function buildWorld() {
  const routeSet = new Set(WD.routes.map(([a, b]) => a < b ? a + '-' + b : b + '-' + a));
  const provs = WD.p.map((p, i) => {
    const rings = [];
    for (const poly of p.r) for (const r of poly) rings.push(decodeRing(r));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const path = new Path2D();
    for (const r of rings) {
      ringPath(path, r);
      for (let k = 0; k < r.length; k += 2) { x0 = Math.min(x0, r[k]); x1 = Math.max(x1, r[k]); y0 = Math.min(y0, r[k + 1]); y1 = Math.max(y1, r[k + 1]); }
    }
    const land = p.nb.filter(j => !routeSet.has(i < j ? i + '-' + j : j + '-' + i));
    return { id: i, name: p.n, country: p.c, pop: p.pop, area: p.a || 1, cap: !!p.k, c: [p.x, p.y], nb: p.nb, landNb: land, rings, bb: [x0, y0, x1, y1], path };
  });

  // border chunks grouped in tiles, so only visible tiles get stroked
  const TILE = 250, tcols = Math.ceil(MW / TILE), trows = Math.ceil(MH / TILE);
  const chunks = [];
  for (const a of WD.arcs) {
    const pts = decodeRing(a.d);
    for (let s = 0; s < pts.length - 2; s += 60) {
      const seg = pts.subarray(s, Math.min(pts.length, s + 62));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let k = 0; k < seg.length; k += 2) { x0 = Math.min(x0, seg[k]); x1 = Math.max(x1, seg[k]); y0 = Math.min(y0, seg[k + 1]); y1 = Math.max(y1, seg[k + 1]); }
      const tile = Math.min(tcols - 1, Math.floor((x0 + x1) / 2 / TILE)) + tcols * Math.min(trows - 1, Math.floor((y0 + y1) / 2 / TILE));
      chunks.push({ o: a.o, pts: seg, tile, bb: [x0, y0, x1, y1] });
    }
  }
  const tiles = [];
  for (let t = 0; t < tcols * trows; t++) tiles.push({ bb: [Infinity, Infinity, -Infinity, -Infinity], chunks: [] });
  for (const ch of chunks) {
    const T = tiles[ch.tile]; T.chunks.push(ch);
    T.bb = [Math.min(T.bb[0], ch.bb[0]), Math.min(T.bb[1], ch.bb[1]), Math.max(T.bb[2], ch.bb[2]), Math.max(T.bb[3], ch.bb[3])];
  }

  // hit-test grid
  const HG = 50, hcols = Math.ceil(MW / HG), hrows = Math.ceil(MH / HG);
  const hit = Array.from({ length: hcols * hrows }, () => []);
  for (const p of provs) {
    for (let gy = Math.floor(p.bb[1] / HG); gy <= Math.floor(p.bb[3] / HG); gy++)
      for (let gx = Math.floor(p.bb[0] / HG); gx <= Math.floor(p.bb[2] / HG); gx++)
        if (gx >= 0 && gy >= 0 && gx < hcols && gy < hrows) hit[gx + gy * hcols].push(p.id);
  }

  // nations = countries with at least one province
  const nations = WD.countries.map((c, i) => ({ id: i, place: c.n, capital: -1, size: 0, color: '#888', nb: new Set() }));
  for (const p of provs) {
    const n = nations[p.country];

function dailyUpdate() {

}

        <div class="row">${front !== undefined ? `<button class="btn" data-go="${front}">Vai al fronte</button>` : ''}<button class="btn" data-peace="${w}" ${(G.asked['pp' + w] || 0) > G.day ? 'disabled' : ''}>Proponi la pace</button></div>
      </div>`;
    }).join('') : '<p class="sub">Nessuna guerra in corso. Per ora.</p>';
  } else if (dashTab === 'dip') {
    const allies = x.allies.filter(a => G.n[a].alive);
    const truces = Object.entries(G.truce).map(([k, v]) => [k.split('-').map(Number), v]).filter(([ab]) => ab.includes(me)).map(([ab, v]) => [ab[0] === me ? ab[1] : ab[0], v - G.day]);
    const others = new Set([...neighborNations(me), ...x.wars]);
    const powers = G.n.map((_, n) => n).filter(n => G.n[n].alive && n !== me).sort((a, b) => armyOf(b) - armyOf(a)).slice(0, 8);
    for (const p of powers) others.add(p);
    for (const a of allies) others.delete(a);
    const row = n => `<button class="drow" data-goc="${n}"><span class="chip" style="background:${nat(n).color}"></span><b>${esc(fullName(n))}</b>${relBar(relOf(n))}<span class="rv">${relOf(n) > 0 ? '+' : ''}${relOf(n)}</span><span class="tag ${atWar(me, n) ? 'war' : allied(me, n) ? 'ally' : truceLeft(me, n) ? 'truce' : 'peace'}">${atWar(me, n) ? 'Guerra' : allied(me, n) ? 'Alleato' : truceLeft(me, n) ? 'Tregua' : relWord(relOf(n))}</span></button>`;
    body = `<h3>Alleati (${allies.length})</h3>${allies.length ? allies.map(row).join('') : '<p class="sub">Nessun alleato. Proponi un\'alleanza toccando un paese sulla mappa.</p>'}
      <h3>Tregue</h3>${truces.length ? truces.map(([n, d]) => `<div class="drow"><span class="chip" style="background:${nat(n).color}"></span><b>${esc(fullName(n))}</b><span class="sub">ancora ${Math.ceil(d / 30)} mesi</span></div>`).join('') : '<p class="sub">Nessuna tregua in corso.</p>'}
      <h3>Rapporti con vicini e potenze</h3>${[...others].sort((a, b) => relOf(a) - relOf(b)).map(row).join('')}
      <p class="sub">I rapporti salgono con alleanze, aiuti e paci; scendono con dichiarazioni di guerra, conquiste e armi nucleari.</p>`;
  } else if (dashTab === 'mil') {
    const mv = G.moves.filter(m => m.owner === me);
    const fl = fleetsOf(me), arm = G.units.filter(u => u.owner === me && u.kind === 'army');
    const top = mine.slice().sort((a, b) => power(G.p[b]) - power(G.p[a])).slice(0, 8);
    const what = m => m.type === 'air' ? `${ICON.apt} ${m.fgt + m.bmb} aerei` : m.type === 'sea' ? `${ICON.port} ${m.ships + (m.subs || 0) + (m.cars || 0)} navi` : m.type === 'missile' ? `${ICON.mis} missile` : `${fmt(m.amount)} soldati${m.tanks ? ` · ${m.tanks} carri` : ''}`;
    const bts = G.battles.filter(b => b.owner === me || G.p[b.prov].owner === me);
    body = `<div class="kpis">
      <div class="kpi"><span>Soldati</span><b>${fmt(f.army)}</b></div><div class="kpi"><span>Caccia</span><b>${f.fgt}</b></div>
      <div class="kpi"><span>Bombardieri</span><b>${f.bmb}</b></div><div class="kpi"><span>Navi</span><b>${f.ships}</b></div>
      <div class="kpi"><span>Carri</span><b>${f.tnk}</b></div><div class="kpi"><span>Sottomarini</span><b>${f.sub}</b></div><div class="kpi"><span>Portaerei</span><b>${f.car}</b></div></div>
      <h3>Battaglie in corso (${bts.length})</h3>${bts.length ? bts.map(b => `<button class="drow" data-go="${b.prov}"><b>⚔︎ ${esc(pname(b.prov))}</b><span class="sub">${b.owner === me ? 'attacchi' : 'difendi'} · ${Math.round((b.owner === me ? battleOdds(b) : 1 - battleOdds(b)) * 100)}% a tuo favore</span><span class="rv">${daysWord(Math.max(1, Math.ceil(b.end - G.time)))}</span></button>`).join('') : '<p class="sub">Nessuna battaglia.</p>'}
      <h3>In movimento (${mv.length})</h3>${mv.length ? mv.map(m => { const t = moveTarget(m), f0 = provAtMap(m.pts[0][0], m.pts[0][1]); return `<button class="drow" data-go="${t >= 0 ? t : G.n[me].capital}"><b>${what(m)}</b><span class="sub">${f0 >= 0 ? esc(pname(f0)) : 'mare'} → ${t >= 0 ? esc(pname(t)) : 'mare aperto'}</span><span class="rv">${daysWord(Math.max(1, Math.ceil(m.arr - G.time)))}</span></button>`; }).join('') : '<p class="sub">Nessuna forza in movimento.</p>'}
      <h3>Armate sulla mappa (${arm.length})</h3>${arm.length ? arm.map(u => `<button class="drow" data-unit="${u.id}"><b>${ICON.inf} ${fmt(u.n)} soldati</b><span class="sub">${u.prov >= 0 ? esc(pname(u.prov)) : ''}</span></button>`).join('') : '<p class="sub">Nessuna armata schierata fuori dalle guarnigioni.</p>'}
      <h3>Flotte in mare (${fl.length})</h3>${fl.length ? fl.map((f, k) => { const c = coastNear([f.x, f.y], 70); return `<div class="drow"><b>${ICON.port} ${hulls(f)} navi</b><span class="sub">${c >= 0 ? (atWar(me, G.p[c].owner) ? 'blocco a ' : 'presso ') + esc(pname(c)) : 'in mare aperto'}</span><button class="btn sm" data-unit="${f.id}">Vedi</button><button class="btn sm" data-recall="${k}">Rientra</button></div>`; }).join('') : '<p class="sub">Nessuna flotta in mare.</p>'}
      <h3>Guarnigioni principali</h3>${top.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">${fmt(G.p[i].army)} soldati${G.p[i].fgt + G.p[i].bmb ? ` · ${ICON.apt} ${G.p[i].fgt + G.p[i].bmb}` : ''}${G.p[i].ships ? ` · ${ICON.port} ${G.p[i].ships}` : ''}</span></button>`).join('')}`;
  } else if (dashTab === 'gov') {
    const st = Math.round(x.stab), tgt = Math.round(stabTarget(me));
    const revs = mine.filter(i => G.p[i].rev);
    body = `<div class="kpis">
      <div class="kpi"><span>Stabilità</span><b class="${st < 35 ? 'neg' : st >= 60 ? 'pos' : ''}">${st}</b><small>tende a ${tgt} · ${st < 20 ? 'rivolte' : st < 35 ? 'proteste: rendita −15%' : st < 60 ? 'tranquilla' : 'popolo soddisfatto'}</small></div>
      <div class="kpi"><span>ONU</span><b class="${sanctioned(me) ? 'neg' : 'pos'}">${sanctioned(me) ? 'Sanzioni' : 'In regola'}</b><small>${sanctioned(me) ? `ancora ${Math.ceil((x.sanc - G.day) / 30)} mesi: rendita −25%` : 'nessuna sanzione'}</small></div>
    </div>
    <div class="meterbar"><i style="width:${st}%"></i><em style="left:${tgt}%"></em></div>
    <h3>Cosa pesa sulla stabilità</h3>
    <div class="factors">${stabFactors(me).map(([l, v]) => `<div class="drow"><b>${esc(l)}</b><span class="rv ${v > 0 && l !== 'Base' ? 'pos' : v < 0 ? 'neg' : ''}">${l === 'Base' ? v : (v > 0 ? '+' : '') + v}</span></div>`).join('')}</div>
    <h3>Tasse</h3>
    <div class="seg">${TAX.map((t, k) => `<button class="${x.tax === k ? 'on' : ''}" data-tax="${k}">${t.name}<small>rendita ×${t.mult}${t.stab ? ` · stab. ${t.stab > 0 ? '+' : ''}${t.stab}` : ''}</small></button>`).join('')}</div>
    <h3>Leva obbligatoria</h3>
    <label class="toggle"><input type="checkbox" id="gDraft" ${x.draft ? 'checked' : ''}> Fanteria a ${Math.round(RECRUIT_COST * 0.7)} oro invece di ${RECRUIT_COST}, ma stabilità −10</label>
    <h3>Bilancio della ricerca: ${x.rb}% della rendita (${inc.rd} oro al mese)</h3>
    <input type="range" id="gRb" min="0" max="30" step="5" value="${x.rb}" class="wide">
    ${revs.length ? `<h3>Province in rivolta</h3>${revs.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">nessuna rendita, i soldati disertano</span></button>`).join('')}` : ''}`;
  } else if (dashTab === 'tech') {
    const cur = x.res ? TECHS[x.res] : null, rpm = Math.round(inc.rd + 2);
    body = `<div class="kpis">
      <div class="kpi"><span>In ricerca</span><b style="font-size:17px">${cur ? esc(cur.name) : 'Nulla'}</b><small>${cur ? `${Math.floor(x.rp)}/${cur.cost} punti · circa ${Math.max(1, Math.ceil((cur.cost - x.rp) / Math.max(1, rpm)))} mesi` : `${Math.floor(x.rp)} punti accumulati`}</small></div>
      <div class="kpi"><span>Punti al mese</span><b>${rpm}</b><small>alza il bilancio nel Governo</small></div>
    </div>
    ${cur ? `<div class="meterbar"><i style="width:${Math.min(100, x.rp / cur.cost * 100)}%"></i></div>` : ''}
    <h3>Tecnologie</h3>
    ${Object.entries(TECHS).map(([k, t]) => { const have = x.tech.includes(k), lock = t.need && !x.tech.includes(t.need);
      return `<button class="drow tech ${have ? 'have' : ''} ${x.res === k ? 'me' : ''}" data-tech="${k}" ${have || lock ? 'disabled' : ''}><b>${esc(t.name)}</b><span class="sub">${have ? 'acquisita' : lock ? `serve ${esc(TECHS[t.need].name)}` : esc(t.what)}</span><span class="rv">${have ? '✓' : t.cost}</span></button>`; }).join('')}
    <p class="sub">Gli altri paesi fanno ricerca da soli; puoi anche rubare tecnologie con le spie.</p>`;
  } else if (dashTab === 'trade') {
    const { prod, use } = resourceFlow(me);
    body = `<p class="sub">Le risorse si aggiornano ogni mese. ${sanctioned(me) ? '<b class="neg">Con le sanzioni compri a +50% e vendi a −40%.</b>' : ''}</p>
    ${['oil', 'steel', 'food'].map(k => { const net = Math.round((prod[k] - use[k]) * 10) / 10;
      return `<div class="card rescard"><div class="ch"><b>${RES_NAMES[k]}</b><span class="sub">scorta ${Math.floor(x.stock[k])}${x.short[k] ? ' · <span class="neg">esaurito</span>' : ''}</span><span class="rv ${net < 0 ? 'neg' : 'pos'}">${net >= 0 ? '+' : ''}${net}/mese</span></div>
        <div class="sub">prodotto ${prod[k]} · consumato ${use[k]}${k === 'steel' ? ' · in più si consuma costruendo mezzi' : ''}</div>
        <div class="row"><button class="btn sm" data-buy="${k}" ${x.gold < buyPrice(k) ? 'disabled' : ''}>Compra 10 · ${buyPrice(k)} oro</button><button class="btn sm" data-sell="${k}" ${x.stock[k] < 10 ? 'disabled' : ''}>Vendi 10 · ${sellPrice(k)} oro</button></div></div>`; }).join('')}
    <p class="sub">Petrolio: senza, carri, aerei e navi combattono al 70%. Acciaio: serve per carri (${STEEL_USE.tnk}), aerei (${STEEL_USE.fgt}), navi (${STEEL_USE.ship}), sottomarini (${STEEL_USE.sub}), portaerei (${STEEL_USE.car}), missili (${STEEL_USE.mis}). Cibo: senza, la stabilità crolla.</p>`;
  } else if (dashTab === 'eco') {
    const rich = mine.slice().sort((a, b) => provIncome(b) - provIncome(a)).slice(0, 8);
    const issues = mine.filter(i => radLeft(i) || blockaded(i) || !G.p[i].sup);
    body = `<div class="kpis">
      <div class="kpi"><span>Entrate</span><b class="pos">+${inc.inc}</b><small>al mese dalle province</small></div>
      <div class="kpi"><span>Esercito</span><b class="neg">−${inc.army}</b><small>soldo dei soldati</small></div>
      <div class="kpi"><span>Aviazione</span><b class="neg">−${inc.air}</b><small>manutenzione</small></div>
      <div class="kpi"><span>Marina</span><b class="neg">−${inc.navy}</b><small>manutenzione</small></div>
      <div class="kpi"><span>Ricerca</span><b class="neg">−${inc.rd}</b><small>${x.rb}% della rendita</small></div>
    </div>
    <h3>Rendita mensile nel tempo</h3>${spark(G.hist.map(h => h.inc), '#3ddc97')}
    <h3>Province più ricche</h3>${rich.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">economia ${G.p[i].eco}/5</span><span class="rv">+${provIncome(i)}</span></button>`).join('')}
    <h3>Problemi</h3>${issues.length ? issues.map(i => `<button class="drow" data-go="${i}"><b>${esc(pname(i))}</b><span class="sub">${[radLeft(i) ? 'contaminata' : '', blockaded(i) ? 'porto bloccato' : '', !G.p[i].sup ? 'senza rifornimenti' : ''].filter(Boolean).join(', ')}</span></button>`).join('') : '<p class="sub">Nessuna provincia in difficoltà.</p>'}`;
  } else {
    const score = n => { const ff = forcesOf(n); return provsOf(n).length * 10 + power(ff) / 1000 + income(n).inc; };
    const all = G.n.map((_, n) => n).filter(n => G.n[n].alive).sort((a, b) => score(b) - score(a));
    const myRank = all.indexOf(me) + 1;
    body = `<p class="sub">Punteggio: province, forza militare ed economia. Sei <b>${myRank}°</b> su ${all.length}.</p>
      ${all.slice(0, 12).map((n, k) => `<button class="drow ${n === me ? 'me' : ''}" data-goc="${n}"><span class="rk">${k + 1}</span><span class="chip" style="background:${nat(n).color}"></span><b>${esc(fullName(n))}</b><span class="sub">${provsOf(n).length} prov. · ${fmt(armyOf(n))}</span><span class="rv">${Math.round(score(n))}</span></button>`).join('')}
      ${myRank > 12 ? `<button class="drow me" data-goc="${me}"><span class="rk">${myRank}</span><b>${esc(fullName(me))}</b><span class="rv">${Math.round(score(me))}</span></button>` : ''}`;
  }
  const el = $('dash');
  const scroll = el.querySelector('.dbody')?.scrollTop || 0;
  el.innerHTML = `<div class="dhead"><div><div class="eyebrow">Stato · ${dateStr(G.day)}</div><h1>${esc(fullName(me))}</h1></div>
      <button class="icon-btn" id="dClose" aria-label="Chiudi" style="background:rgba(255,255,255,.06)"><svg><use href="#i-close"/></svg></button></div>
    <div class="dtabs">${tabs.map(([k, l]) => `<button class="${k === dashTab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="dbody">${body}</div>`;
  el.querySelector('.dbody').scrollTop = scroll;
  $('dClose').onclick = closeDash;
  for (const b of el.querySelectorAll('[data-tab]')) b.onclick = () => { dashTab = b.dataset.tab; renderDash(); el.querySelector('.dbody').scrollTop = 0; };
  for (const b of el.querySelectorAll('[data-go]')) b.onclick = () => goTo(+b.dataset.go);
  for (const b of el.querySelectorAll('[data-goc]')) b.onclick = () => goTo(G.n[+b.dataset.goc].capital);
  for (const b of el.querySelectorAll('[data-peace]')) b.onclick = () => playerPeace(+b.dataset.peace);
  if ($('dNuke')) $('dNuke').onclick = () => { closeDash(); showArsenal(); };
  for (const b of el.querySelectorAll('[data-tax]')) b.onclick = () => { x.tax = +b.dataset.tax; afterAction(); };
  if ($('gDraft')) $('gDraft').onchange = e => { x.draft = e.target.checked; afterAction(); };
  if ($('gRb')) $('gRb').onchange = e => { x.rb = +e.target.value; afterAction(); };
  for (const b of el.querySelectorAll('[data-tech]')) b.onclick = () => { x.res = b.dataset.tech; toast(`Ricerca avviata: ${TECHS[x.res].name}.`); afterAction(); };
  for (const b of el.querySelectorAll('[data-buy]')) b.onclick = () => trade(b.dataset.buy, true);
  for (const b of el.querySelectorAll('[data-sell]')) b.onclick = () => trade(b.dataset.sell, false);
  for (const b of el.querySelectorAll('[data-recall]')) b.onclick = () => { const f = fleetsOf(me)[+b.dataset.recall]; if (f) recallFleet(f); afterAction(); };
  for (const b of el.querySelectorAll('[data-unit]')) b.onclick = () => { const u = unitById(+b.dataset.unit); if (!u) return; closeDash(); selUnit = u.id; selected = -1; centerOn(u.x, u.y, Math.max(cam.s, 1), 0.35); renderPanel(); requestRender(); };
}

// modals pause the clock; requests arriving meanwhile wait in line
function ask(fn) { if (modalOpen || phase !== 'play') modalQueue.push(fn); else fn(); }
function showModal(html, wire) { $('modalBox').innerHTML = html; $('modal').hidden = false; modalOpen = true; wire && wire(); }
function hideModal() {
  $('modal').hidden = true; modalOpen = false;
  if (modalQueue.length && phase === 'play') modalQueue.shift()();
}
function showOffer(n) {
  if (!atWar(G.player, n)) return hideModal();
  showModal(`<div class="eyebrow">Diplomazia</div><h1 style="font-size:26px">Proposta di pace</h1><p>${esc(fullName(n))} chiede di firmare la pace. Seguirebbero 10 mesi di tregua.</p>
    <div class="row"><button class="btn primary" id="okP">Accetta</button><button class="btn" id="noP">Rifiuta</button></div>`, () => {
    $('okP').onclick = () => { makePeace(G.player, n); hideModal(); news(`Pace con ${fullName(n)}.`, 'good', G.n[n].capital); afterAction(); };
    $('noP').onclick = hideModal;
  });
}
function showAllianceOffer(n) {
  if (allied(G.player, n) || atWar(G.player, n) || !G.n[n].alive) return hideModal();
  const enemies = G.n[n].wars.filter(w => G.n[w].alive);
  showModal(`<div class="eyebrow">Diplomazia</div><h1 style="font-size:26px">Proposta di alleanza</h1>
    <p>${esc(fullName(n))} propone un'alleanza difensiva: se qualcuno attacca uno dei due, l'altro entra in guerra.${enemies.length ? ` Al momento è in guerra con ${enemies.slice(0, 3).map(x => esc(fullName(x))).join(', ')}.` : ''}</p>
    <div class="row"><button class="btn primary" id="okA">Accetta</button><button class="btn" id="noA">Rifiuta</button></div>`, () => {
    $('okA').onclick = () => { makeAlliance(G.player, n); hideModal(); afterAction(); };
    $('noA').onclick = hideModal;
  });
}
function showCallToArms(ally, aggressor) {
  if (!allied(G.player, ally) || atWar(G.player, aggressor) || !G.n[ally].alive || !G.n[aggressor].alive) return hideModal();
  showModal(`<div class="eyebrow">Alleanza</div><h1 style="font-size:26px">Un alleato è sotto attacco</h1>
    <p>${esc(fullName(aggressor))} ha dichiarato guerra a ${esc(fullName(ally))}. Se non intervieni, l'alleanza finisce.</p>
    <div class="row"><button class="btn primary" id="okC">Entra in guerra</button><button class="btn" id="noC">Resta fuori</button></div>`, () => {
    $('okC').onclick = () => { hideModal(); declareWar(G.player, aggressor); news(`Sei entrato in guerra contro ${fullName(aggressor)} al fianco di ${fullName(ally)}.`, 'bad', G.n[aggressor].capital); afterAction(); };
    $('noC').onclick = () => { hideModal(); breakAlliance(G.player, ally); afterAction(); };
  });
}
function showEnd(win) {
  $('clock').hidden = true; $('nukeBtn').hidden = true; $('multiBtn').hidden = true;
  showModal(`<h1 style="font-size:30px">${win ? 'Vittoria' : 'Sconfitta'}</h1>
    <p>${win ? `Il ${dateStr(G.day)} ${esc(fullName(G.player))} governa il mondo intero.` : `Il ${dateStr(G.day)} l'ultima provincia di ${esc(nat(G.player).place)} è caduta.`}</p>
    <div class="row"><button class="btn primary" id="again">Nuova partita</button></div>`, () => { $('again').onclick = () => { modalQueue.length = 0; hideModal(); toIntro(); }; });
}
function showNews() {
  unread = 0; $('newsCount').textContent = ''; $('newsBtn').classList.remove('has');
  showModal(`<div class="eyebrow">Notizie</div><h1 style="font-size:26px">Cosa sta succedendo</h1>
    <div class="feed">${feed.length ? feed.map((f, k) => `<button class="fi ${f.kind}" data-k="${k}"><span>${dateStr(f.day)}</span>${esc(f.msg)}</button>`).join('') : '<p>Ancora nessuna notizia.</p>'}</div>
    <div class="row"><button class="btn" id="fClose">Chiudi</button></div>`, () => {
    $('fClose').onclick = hideModal;
    for (const b of document.querySelectorAll('.fi')) b.onclick = () => {
      const f = feed[+b.dataset.k]; hideModal();
      if (f.prov >= 0) { const c = W.provs[f.prov].c; centerOn(c[0], c[1], Math.max(cam.s, 0.9), 0.4); requestRender(); }
    };
  });
}
function showArsenal() {
  const me = G.n[G.player];
  const status = me.prog < 0 ? 'Nessun programma nucleare.' : me.prog > 0 ? `Programma in corso: pronto tra ${Math.ceil((me.prog - G.day) / 30)} mesi.` : 'Programma completato: puoi costruire testate.';
  showModal(`<h1 style="font-size:26px">Arsenale nucleare</h1>
    <div class="arsenal"><svg><use href="#i-nuke"/></svg><div><b>${me.nukes} testate</b><span class="sub">${status}</span></div></div>
    <p>Per lanciare usa il pulsante ☢ in basso a sinistra (o quello nel pannello di una tua provincia), poi tocca una provincia di un paese in guerra con te e conferma. Uno scudo antimissile nemico può fermare la testata. L'esplosione distrugge quasi tutto l'esercito della provincia, azzera economia e fortezze e la contamina per un anno. Chi ha testate risponde, e altri paesi possono dichiararti guerra.</p>
    <div class="row">
      ${me.prog < 0 ? `<button class="btn primary" id="nProg" ${me.gold < NUKE_PROGRAM_COST ? 'disabled' : ''}>Avvia programma · ${NUKE_PROGRAM_COST} oro</button>` : ''}
      ${me.prog === 0 ? `<button class="btn primary" id="nBuild" ${me.gold < NUKE_COST ? 'disabled' : ''}>Costruisci testata · ${NUKE_COST} oro</button>` : ''}
      <button class="btn" id="nClose">Chiudi</button>
    </div>`, () => {
    if ($('nProg')) $('nProg').onclick = () => { hideModal(); startProgram(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    if ($('nBuild')) $('nBuild').onclick = () => { hideModal(); buildNuke(); };
    $('nClose').onclick = hideModal;
  });
}
function showMenu() {
  showModal(`<h1 style="font-size:26px">Come si gioca</h1>
    <ul>

    $('mNew').onclick = () => {
      if ($('mNew').dataset.c) { clearSaved(); modalQueue.length = 0; hideModal(); toIntro(); }

}
function setSpeed(k) {
  speedIdx = k;
  for (const b of document.querySelectorAll('#clock button')) b.classList.toggle('on', +b.dataset.s === k);
}

function findProv(name) { const p = W.provs.find(p => p.name === name); return p ? p.c : [MW / 2, MH / 2]; }
function toIntro() {
  phase = 'pick'; pickNation = -1; selected = -1;
  G = initialState(); ownVer++; bordersDirty = true; staticDirty = true;
  feed.length = 0; unread = 0;
  $('top').hidden = true; $('clock').hidden = true; $('panel').hidden = true; $('nukeBtn').hidden = true; $('multiBtn').hidden = true; marks.length = 0;
  multi = false; multiSel.units.clear(); multiSel.provs.clear(); selMove = 0; selUnit = 0; moveMode = false; nukeAim = -1; wayMode = ''; wayPts = []; $('banner').hidden = true; closeDash();
  $('intro').hidden = false;
  $('continueBtn').hidden = !loadSaved();
  vw = window.innerWidth; vh = window.innerHeight;
  const [x, y] = findProv('Vienna');
  centerOn(x, y, Math.max(minScale(), vw / 1100), 0.3);
  updateIntro(); resize();
}
function startPlay() {
  phase = 'play'; lastDayShown = -1;
  $('intro').hidden = true; $('top').hidden = false; $('clock').hidden = false; $('nukeBtn').hidden = false; $('multiBtn').hidden = false;
  setSpeed(1);
  staticDirty = true;
  updateUI(); resize();
}
$('startBtn').onclick = () => {
  if (pickNation < 0) return;
  G.player = pickNation; selected = G.n[pickNation].capital;
  const c = W.provs[selected].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 420), 0.25);
  startPlay(); save();
  toast(`Governi ${fullName(pickNation)}. Il tempo scorre: buona fortuna.`, 'good');
};
$('continueBtn').onclick = () => {
  if (!restore(loadSaved())) return;
  selected = -1;
  const c = W.provs[G.n[G.player].capital].c;
  centerOn(c[0], c[1], Math.max(cam.s, vw / 700), 0.4);
  startPlay();
};
for (const b of document.querySelectorAll('#clock button')) b.onclick = () => setSpeed(+b.dataset.s);
window.addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'play' && !modalOpen) { e.preventDefault(); setSpeed(speedIdx ? 0 : 1); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('menuBtn').onclick = showMenu;
$('newsBtn').onclick = showNews;
$('dashBtn').onclick = () => openDash();
$('nukeBtn').onclick = () => { if (phase === 'play') enterNukeMode(); };
$('multiBtn').onclick = () => { if (phase !== 'play') return; toggleMulti(!multi); if (multi) toast('Selezione multipla: trascina un dito sulla mappa per scegliere le unità.'); };
$('layerBtn').onclick = () => {
  mapMode = mapMode === 'sat' ? 'pol' : 'sat';
  try { localStorage.setItem('tdc-mapmode', mapMode); } catch (e) {}
  bordersDirty = true; staticDirty = true; requestRender();
  toast(mapMode === 'sat' ? 'Mappa satellitare' : 'Mappa politica a colori');
};

function boot(data) {
  W = buildWorld();
  readFonts();
  prepareSea();
  if (restore(data) && G.player >= 0) {
    vw = window.innerWidth; vh = window.innerHeight;
    const c = W.provs[G.n[G.player].capital].c; centerOn(c[0], c[1], vw / 700, 0.4);
    startPlay();
  } else toIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); bordersDirty = true; staticDirty = true; requestRender(); });
  requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
}
window.claude?.hot?.snapshot?.(() => (G && phase === 'play' ? serialize() : null));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? null);
</script>
